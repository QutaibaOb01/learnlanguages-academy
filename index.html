Object.assign(LLA.GRAMMAR.de, {
c2u1: ['Präfixverben: trennbar oder untrennbar','Prefix verbs: separable or inseparable (über-, um-, durch-)','الأفعال ذات السوابق: منفصلة أو متصلة',
  'übersetzen (untrennbar): Sie hat den Text übersetzt. = translate\nübersetzen (trennbar): Die Fähre hat uns übergesetzt. = ferry across\numfahren: das Hindernis umfahren (drive around) · das Schild umfahren → umgefahren (knock over)',
  'Some prefixes (über-, um-, durch-, unter-, wieder-) can be separable or inseparable, and the meaning changes. Separable verbs stress the prefix and form the participle with -ge- (übergesetzt); inseparable verbs stress the stem and have no ge- (übersetzt).',
  'بعض السوابق (über- وum- وdurch- وunter- وwieder-) قد تكون منفصلة أو متصلة ويتغيّر المعنى. الأفعال المنفصلة يقع النبر فيها على السابقة ويُصاغ اسم المفعول بـ -ge- (übergesetzt)، والمتصلة يقع النبر على الجذر ولا تأخذ ge- (übersetzt).',
  'Der Fährmann hat die Reisenden übergesetzt, und die Dolmetscherin hat ihre Fragen übersetzt.',
  'Sie hat den Roman ins Arabische ___.|übersetzt|übergesetzt|überzusetzt|setzt über',
  'Der Fahrer hat das Schild ___. Jetzt liegt es auf der Straße.|umgefahren|umfahren|umzufahren|fährt um'],
c2u2: ['Irreale Vergleichssätze: als ob, als wenn, als + Verb','Unreal comparisons: als ob / als + verb (Konjunktiv)','جمل التشبيه غير الواقعي: als ob',
  'als ob / als wenn + Konjunktiv (Verb am Ende): Er tat, als ob er nichts gesehen hätte.\nals + Konjunktiv (Verb direkt nach als): Er tat, als hätte er nichts gesehen.\nliterarisch auch Konjunktiv I: als sei nichts geschehen',
  'Unreal comparisons (“as if”) use the Konjunktiv. After als ob / als wenn the verb goes to the end; after als alone the verb comes immediately after it. Literary texts also use Konjunktiv I: als sei nichts geschehen.',
  'جمل التشبيه غير الواقعي («كما لو أنّ») تستخدم الـ Konjunktiv. بعد als ob / als wenn يذهب الفعل إلى آخر الجملة، وبعد als وحدها يأتي الفعل مباشرة بعدها. وتستخدم النصوص الأدبية أيضاً Konjunktiv I: als sei nichts geschehen.',
  'Sie lächelte, als wäre nichts geschehen.',
  'Er tat, als ___ er nichts gesehen.|hätte|habe gehabt|hat|wäre',
  'Sie sprach so ruhig, als ob nichts geschehen ___.|wäre|hätte|sei gewesen|würde'],
c2u3: ['Komplexe Partizipialattribute und Gerundiv','Complex participle attributes and the gerundive (zu + Partizip I)','الصفات المركّبة من اسم الفاعل وصيغة الوجوب',
  'die von Kant begründete Pflichtethik (Partizip II)\ndie seit Jahrhunderten diskutierte Frage\nGerundiv: eine schwer zu beantwortende Frage = eine Frage, die schwer zu beantworten ist',
  'Academic and philosophical German packs whole relative clauses into the noun phrase. The gerundive (zu + Partizip I + ending) expresses necessity or possibility: das zu lösende Problem = the problem that must be solved.',
  'تختصر الألمانية الأكاديمية والفلسفية جملاً موصولة كاملة داخل المركّب الاسمي. وصيغة Gerundiv (zu + Partizip I + نهاية الصفة) تعبّر عن الوجوب أو الإمكان: das zu lösende Problem أي المشكلة التي يجب حلّها.',
  'Die von Philosophen seit Jahrhunderten gestellte Frage bleibt unbeantwortet.',
  'Das ist eine schwer zu ___ Frage.|beantwortende|beantwortend|beantworten|beantwortete',
  'Die von Kant ___ Pflichtethik prägt bis heute die Diskussion.|begründete|begründende|begründet|zu begründende'],
c2u4: ['Formelhafter Konjunktiv I','Formulaic Konjunktiv I: Man nehme …, Es lebe …, sei es … sei es','صيغ Konjunktiv I الثابتة',
  'Aufforderung: Man nehme 200 g Mehl. · Man bedenke die Folgen!\nWunsch: Es lebe die Freiheit! · Gott sei Dank!\nKonzession: sei es aus Angst, sei es aus Bequemlichkeit',
  'Konjunktiv I survives in fixed formulas: instructions and appeals with man (Man bedenke …), wishes (Es lebe …), and the concessive sei es … sei es (“whether … or …”). Rhetoric uses these forms for a solemn, emphatic tone.',
  'يبقى Konjunktiv I حيّاً في صيغ ثابتة: التعليمات والدعوات مع man (Man bedenke …)، والأمنيات (Es lebe …)، وصيغة التنازل sei es … sei es (سواء … أو …). وتستخدم الخطابة هذه الصيغ لنبرة رسمية مؤكّدة.',
  'Man bedenke: Jede Entscheidung hat ihren Preis.',
  'Man ___ die Folgen dieser Entscheidung!|bedenke|bedenkt|bedachte|bedenken',
  'Wir unterstützen jedes Engagement, ___ es groß oder klein.|sei|ist|wäre|sein'],
c2u5: ['Unpersönliches Passiv und Passiv mit Dativ','Impersonal passive and the passive of dative verbs','المبني للمجهول غير الشخصي ومع أفعال الـ Dativ',
  'Es wird angenommen, dass … · Hier wird geforscht.\nDativverben ohne Subjekt: Dem Patienten wurde geholfen.\nAkkusativ → Subjekt: Den Teilnehmern wurde ein Placebo verabreicht.',
  'Scientific German often uses an impersonal passive with es or with no subject at all. Verbs with a dative object (helfen, danken) keep the dative in the passive, so the verb stays singular: Den Patienten wurde geholfen. If there is an accusative object, it becomes the subject.',
  'تستخدم الألمانية العلمية كثيراً المبني للمجهول غير الشخصي مع es أو بلا فاعل أصلاً. والأفعال التي تأخذ مفعولاً في حالة Dativ (helfen وdanken) تحتفظ به في المبني للمجهول فيبقى الفعل مفرداً: Den Patienten wurde geholfen. أما المفعول في حالة Akkusativ فيصبح نائب فاعل.',
  'Es wird vermutet, dass die Abweichung auf einen Messfehler zurückzuführen ist.',
  'Den Teilnehmern ___ ein Placebo verabreicht.|wurde|wurden|wird gewesen|waren',
  'Es ___ angenommen, dass die Ergebnisse reproduzierbar sind.|wird|werden|ist|hat'],
c2u6: ['Distanzierte Redewiedergabe','Distanced reporting: zufolge, laut, Konjunktiv I in the past','نقل الخبر مع التحفّظ',
  'dem Bericht zufolge (nachgestellt, + Dativ) · laut Bericht\nangeblich · vermeintlich · mutmaßlich\nVergangenheit: Er erklärte, er habe von nichts gewusst.',
  'Critical journalism distances itself from claims: zufolge (placed after a dative noun), laut, adverbs like angeblich (allegedly) and mutmaßlich (presumably), and Konjunktiv I in the past: habe / sei + participle.',
  'تبتعد الصحافة النقدية عن تبنّي الادعاءات باستخدام zufolge (تأتي بعد اسم في حالة Dativ)، وlaut، وظروف مثل angeblich (يُزعم) وmutmaßlich (يُفترض)، وKonjunktiv I في الماضي: habe / sei + اسم المفعول.',
  'Dem Bericht zufolge soll der Konzern die Zahlen geschönt haben.',
  'Dem Bericht ___ sind die Zahlen falsch.|zufolge|laut|gemäß nach|nach zu',
  'Der Minister erklärte, er ___ von nichts gewusst.|habe|habt|hätte gehabt|sei'],
c2u7: ['Substantivierte Adjektive und Partizipien','Nominalised adjectives and participles (der Fremde, ein Deutscher)','الصفات المستعملة أسماءً',
  'der Fremde · ein Fremder · die Fremden · viele Fremde\nder / die Deutsche · ein Deutscher · mit einem Deutschen\nder Jugendliche · Angehörige · Einheimische',
  'Many nouns for people are adjectives or participles used as nouns. They keep adjective endings: der Deutsche but ein Deutscher, die Jugendlichen but viele Jugendliche. Only der Deutsche is a nationality noun of this type.',
  'كثير من الأسماء الدالّة على الأشخاص صفات أو أسماء مفعول تُستعمل أسماءً، وتحتفظ بنهايات الصفة: der Deutsche لكن ein Deutscher، وdie Jugendlichen لكن viele Jugendliche. وكلمة Deutsche هي اسم الجنسية الوحيد من هذا النوع.',
  'Viele Jugendliche mit Migrationsgeschichte fühlen sich als Einheimische und als Fremde zugleich.',
  'Viele ___ sprechen zu Hause zwei Sprachen.|Jugendliche|Jugendlichen|Jugendlicher|Jugendlichem',
  'Sie ist mit einem ___ verheiratet.|Deutschen|Deutscher|Deutsche|Deutsch'],
c2u8: ['Doppelter Infinitiv im Nebensatz','Double infinitive in subordinate clauses (… hätten reagieren müssen)','المصدر المزدوج في الجملة التابعة',
  'Hauptsatz: Wir hätten früher reagieren müssen.\nNebensatz: …, dass wir früher hätten reagieren müssen.\n(das finite Verb steht vor dem doppelten Infinitiv)',
  'With modal verbs in the perfect or Konjunktiv II past, German uses two infinitives instead of a participle. In a subordinate clause, the finite auxiliary does not go to the very end but before the two infinitives: …, dass wir das hätten vorhersehen müssen.',
  'مع الأفعال المساعدة في الماضي التام أو Konjunktiv II الماضي تستخدم الألمانية مصدرين بدلاً من اسم المفعول. وفي الجملة التابعة لا يذهب الفعل المصرَّف إلى آخر الجملة بل يأتي قبل المصدرين: …, dass wir das hätten vorhersehen müssen.',
  'Im Nachhinein ist klar, dass wir das Angebot hätten annehmen sollen.',
  'Ich glaube, dass wir früher ___ müssen.|hätten reagieren|reagieren hätten|hätten reagiert|reagiert hätten',
  'Es wäre besser gewesen, wenn wir den Vertrag nicht ___ hätten.|unterschrieben|unterschreiben|zu unterschreiben|unterschrieb'],
c2u9: ['Indirekte Fragen und Aufforderungen','Reported questions and requests (ob, man möge / solle)','نقل الأسئلة والطلبات',
  'Ja/Nein-Frage → ob: Sie fragte, ob er schon angekommen sei.\nW-Frage → Fragewort: Er wollte wissen, wann die Sitzung beginne.\nAufforderung → sollen / mögen: Er bat, man möge ihm helfen.',
  'In language mediation you must report questions and requests precisely. Yes/no questions are introduced by ob, other questions by the question word, both with the verb at the end. Requests use sollen, or the more polite mögen in Konjunktiv I: man möge …',
  'في الوساطة اللغوية يجب نقل الأسئلة والطلبات بدقّة: أسئلة نعم / لا تُنقل بـ ob، والأسئلة الأخرى بأداة الاستفهام، والفعل في آخر الجملة في الحالتين. وتُنقل الطلبات بـ sollen أو بصيغة mögen الأكثر تهذيباً في Konjunktiv I: man möge …',
  'Die Delegation bat, man möge das Protokoll ins Englische übersetzen.',
  'Der Gast bat, man ___ ihm den Text übersetzen.|möge|mag|mochte|müsse',
  'Sie fragte, ___ der Dolmetscher schon angekommen sei.|ob|dass|wenn|was'],
c2u10: ['Konnektoren: es sei denn, geschweige denn, andernfalls','Connectors: es sei denn (unless), geschweige denn (let alone), andernfalls','أدوات الربط: es sei denn وgeschweige denn',
  'es sei denn (, dass) = außer wenn: Wir schaffen es nicht, es sei denn, alle helfen mit.\ngeschweige denn = und noch weniger: Er kann es kaum lesen, geschweige denn übersetzen.\nandernfalls / sonst (Verb an Position 2)',
  'Es sei denn introduces the only condition under which something will happen (“unless”); it is followed by main-clause word order or by dass. Geschweige denn (“let alone”) follows a negative statement. Andernfalls and sonst mean “otherwise”.',
  'es sei denn تقدّم الشرط الوحيد الذي يتحقّق معه الأمر (إلّا إذا)، ويليها ترتيب الجملة الرئيسية أو dass. وgeschweige denn (فضلاً عن / ناهيك عن) تأتي بعد جملة منفية. أما andernfalls وsonst فتعنيان «وإلّا».',
  'Die Ziele sind kaum zu erreichen, es sei denn, wir ändern sofort unser Verhalten.',
  'Viele können sich die Zukunft kaum vorstellen, ___ sie planen.|geschweige denn|es sei denn|andernfalls|sondern',
  'Die Klimaziele sind nicht erreichbar, ___ alle Länder handeln sofort.|es sei denn|geschweige denn|andernfalls|sofern']
});

Object.assign(LLA.GRAMMAR.en, {
c2u1: ['Three-part phrasal verbs','Three-part phrasal verbs: put up with, come up with, look down on','الأفعال المركّبة من ثلاثة أجزاء',
  'put up with (tolerate) · come up with (think of)\nlook down on (despise) · get away with (escape punishment)\nrun out of · face up to · cut down on',
  'Three-part phrasal verbs (verb + adverb + preposition) cannot be separated, and their meaning is usually idiomatic: I can’t put up with the noise. Learn them as fixed units, like idioms.',
  'الأفعال المركّبة من ثلاثة أجزاء (فعل + ظرف + حرف جر) لا تنفصل، ومعناها اصطلاحي عادة: I can’t put up with the noise (لا أطيق الضجيج). احفظها كوحدات ثابتة مثل التعابير الاصطلاحية.',
  'She always comes up with creative solutions when we run out of ideas.',
  'I can’t ___ his rudeness any longer.|put up with|put with up|put up|put on with',
  'In the end, she ___ a brilliant solution.|came up with|came up|came with up|came over with'],
c2u2: ['Inversion for literary effect','Literary inversion: Little did she know …, So … was …, Such was …','التقديم لأغراض أدبية',
  'Little did she know that her life was about to change.\nSo strong was the storm that the ship sank.\nSuch was his anger that … · Down came the rain.',
  'Literary and rhetorical English moves an element to the front for dramatic effect. After little, so + adjective and such, the verb (or auxiliary) comes before the subject.',
  'تنقل الإنجليزية الأدبية والخطابية عنصراً إلى بداية الجملة لتأثير درامي. وبعد little وso + صفة وsuch يأتي الفعل (أو الفعل المساعد) قبل الفاعل.',
  'Little did the narrator suspect that the letter would change everything.',
  'Little ___ that her life was about to change.|did she know|she knew|she did know|knew she',
  'So strong ___ the storm that the ship sank.|was|it was|were|is it'],
c2u3: ['Hypothesis: suppose, but for, were to','Hypothesis: suppose, imagine, but for, if it were not for','الافتراض: suppose وbut for',
  'Suppose / Imagine (that) everything were determined …\nBut for his help (= If it hadn’t been for his help), I would have failed.\nIf we were to accept this argument, …',
  'Philosophical arguments test ideas with hypotheses: suppose / imagine + past subjunctive (were), if … were to, and but for + noun (“if it were not for”). These structures present a situation as purely theoretical.',
  'تختبر الحجج الفلسفية الأفكار بالفرضيات: suppose / imagine + صيغة الماضي الافتراضية (were)، وif … were to، وbut for + اسم (لولا). وهذه التراكيب تقدّم الموقف على أنه نظري بحت.',
  'Suppose the world were fully determined: could anyone be held responsible?',
  'Suppose everything ___ determined in advance: would we still be responsible?|were|is being|would be|be',
  '___ his help, I would never have finished the thesis.|But for|Unless|Except|Without of'],
c2u4: ['Emphasis: emphatic do, whatsoever, the very','Emphasis: emphatic do, whatsoever, the very','أساليب التوكيد في الإنجليزية',
  'emphatic do: I do understand your concerns, but …\nno … whatsoever / at all: There is no evidence whatsoever.\nthe very: This is the very problem we must solve.',
  'Speakers add emphasis with do / does / did before the main verb, with whatsoever or at all after a negative noun phrase, and with the very before a noun. These devices are typical of persuasive speech.',
  'يضيف المتحدثون التوكيد بوضع do / does / did قبل الفعل الرئيسي، وبإضافة whatsoever أو at all بعد مركّب اسمي منفي، وبوضع the very قبل الاسم. وهذه الأساليب شائعة في الخطاب الإقناعي.',
  'We do share your goals; we simply disagree about the means.',
  'I ___ understand your concerns, but we must act now.|do|am|does|did to',
  'There is no evidence ___ to support this claim.|whatsoever|whatever it|at all of|any'],
c2u5: ['Passive reporting with perfect infinitives','Passive reporting: is believed to have …, is thought to have been …','نقل الآراء بالمبني للمجهول والمصدر التام',
  'is said / believed / thought + to + infinitive (present)\n+ to have + past participle (earlier action): The vaccine is believed to have saved millions.\n+ to have been + past participle (passive): The error is thought to have been caused by …',
  'Scientific and journalistic texts report findings impersonally: subject + is believed / thought / said + to-infinitive. Use to have + past participle when the action happened earlier, and to have been + past participle when it is also passive.',
  'تنقل النصوص العلمية والصحفية النتائج بأسلوب غير شخصي: الفاعل + is believed / thought / said + to + المصدر. ونستخدم to have + التصريف الثالث عندما يكون الحدث سابقاً، وto have been + التصريف الثالث عندما يكون مبنياً للمجهول أيضاً.',
  'The decline is thought to have been caused by a combination of factors.',
  'The vaccine is believed ___ millions of lives.|to have saved|to save it|having saved|that it saved',
  'The error is thought ___ by a faulty sensor.|to have been caused|to have caused|being caused|to cause'],
c2u6: ['Distancing language in the media','Distancing: allegedly, reportedly, according to, so-called','لغة التحفّظ في الإعلام',
  'allegedly · reportedly · purportedly · apparently\naccording to (unconfirmed) reports · sources suggest that …\nthe so-called “reform” (doubt or irony)',
  'Responsible journalism marks information that has not been proven: adverbs like allegedly and reportedly, phrases like according to, and so-called to show doubt about a label. Media criticism checks whether these markers are used honestly.',
  'تُميّز الصحافة المسؤولة المعلومات غير المثبتة بظروف مثل allegedly وreportedly، وبعبارات مثل according to، وبكلمة so-called للتشكيك في تسمية ما. ويفحص النقد الإعلامي ما إذا كانت هذه العلامات تُستخدم بأمانة.',
  'The company allegedly hid the data, according to leaked documents.',
  'The minister ___ accepted money from the company.|allegedly|alleged|allege|allegation',
  'According ___ unconfirmed reports, the CEO has resigned.|to|by|from|with'],
c2u7: ['Groups of people: the + adjective, nationalities','Referring to groups: the elderly, the Swiss, a Swiss woman','الإشارة إلى الجماعات: the elderly وthe Swiss',
  'the + adjective (plural meaning): the elderly, the poor, the young\nnationalities in -sh, -ch, -ss, -ese: the French, the Swiss, the Chinese\nan individual: a Frenchman / a French woman, a Swiss',
  'The + adjective refers to a whole group and takes a plural verb: The elderly are often lonely. Nationalities ending in -sh, -ch, -ss or -ese work the same way (the Swiss); for one person, use a noun (a Swiss, a Frenchwoman) or the adjective + man / woman / person.',
  'the + صفة تشير إلى جماعة كاملة ويأتي بعدها فعل الجمع: The elderly are often lonely. والجنسيات المنتهية بـ -sh و-ch و-ss و-ese تعمل بالطريقة نفسها (the Swiss)، وللشخص الواحد نستخدم اسماً (a Swiss) أو الصفة + man / woman / person.',
  'The young often feel freer than the elderly to mix cultures.',
  'The ___ often feel ignored by politicians.|elderly|elderlies|elderly’s|elder',
  '___ are known for their punctuality.|The Swiss|Swiss|The Swisses|Swisses'],
c2u8: ['Tentative language in negotiation','Tentative language: I was wondering …, We might be prepared to …','لغة التلطيف في التفاوض',
  'past forms for distance: I was wondering if … · We were hoping …\nmodals: We might / could be prepared to …\nsoftening: slightly, a little, perhaps · I’d have thought …',
  'Skilled negotiators sound less direct by using past or continuous forms (I was wondering), modals (might, could), and softeners (slightly, perhaps). This keeps the relationship positive while still making demands.',
  'يبدو المفاوضون المهرة أقلّ مباشرة باستخدام صيغ الماضي أو الاستمرار (I was wondering)، والأفعال المساعدة (might وcould)، والكلمات الملطِّفة (slightly وperhaps)، وبهذا يحافظون على العلاقة الإيجابية وهم يقدّمون مطالبهم.',
  'We were hoping you might be able to reconsider the deadline.',
  'I ___ wondering if you could lower the price.|was|am being|have been being|were',
  'We ___ be prepared to offer a discount if you order more.|might|mustn’t|should have|ought'],
c2u9: ['Substitution and ellipsis: so, not, one, do so','Substitution: so, not, one(s), do so','الاستبدال والحذف: so وnot وone',
  'so / not after think, hope, expect: I hope so. · I’m afraid not.\none / ones for countable nouns: the previous one, the new ones\ndo so: She was asked to translate it and did so immediately.',
  'Good translators and mediators avoid needless repetition. So and not replace whole clauses after verbs like hope and think; one / ones replace countable nouns; do so replaces a verb phrase.',
  'يتجنّب المترجمون والوسطاء الجيدون التكرار غير الضروري: تحلّ so وnot محلّ جملة كاملة بعد أفعال مثل hope وthink، وتحلّ one / ones محلّ الأسماء المعدودة، وتحلّ do so محلّ مركّب فعلي.',
  'The client asked for a faithful translation, and the agency did so.',
  'Will the interpreter be there? – I hope ___.|so|it|that|yes',
  'This translation is much better than the previous ___.|one|it|ones|that one'],
c2u10: ['Future forms: be bound to, on the verge of, be set to','Future forms: be bound to, be on the verge of, be set to, be due to','صيغ المستقبل: be bound to وon the verge of',
  'be bound to (certain): Prices are bound to rise.\nbe on the verge / point of + -ing / noun (very near)\nbe set to (planned, likely) · be due to (scheduled)',
  'Advanced English expresses the future with nuance: be bound to (it is certain), be on the verge of (it is about to happen), be set to (it is planned or very likely) and be due to (it is scheduled).',
  'تعبّر الإنجليزية المتقدّمة عن المستقبل بفروق دقيقة: be bound to (مؤكَّد)، وbe on the verge of (على وشك الحدوث)، وbe set to (مخطَّط له أو مرجَّح جداً)، وbe due to (في موعد محدّد).',
  'Automation is set to transform the labour market within a decade.',
  'Prices are bound ___ rise again next year.|to|for|on|at',
  'Scientists are on the verge ___ a major breakthrough.|of|to|for|in']
});

Object.assign(LLA.GRAMMAR.es, {
c2u1: ['Sufijos apreciativos','Evaluative suffixes: -ito, -ucho, -ón, -azo','لواحق التصغير والتكبير والتحقير',
  'diminutivo (afecto, tamaño): casa → casita · un momentito\ndespectivo: casa → casucha · pueblo → pueblucho\naumentativo: casa → casona · golpe: puerta → portazo, codo → codazo',
  'Spanish suffixes add nuance: -ito / -illo make words smaller or more affectionate, -ucho / -ajo make them contemptuous, -ón / -ona make them bigger, and -azo can mean a blow (portazo, the slam of a door).',
  'تضيف اللواحق في الإسبانية فروقاً دقيقة: -ito و-illo للتصغير أو التحبّب، و-ucho و-ajo للتحقير، و-ón و-ona للتكبير، وقد تعني -azo الضربة (portazo: صفق الباب).',
  'Vivían en una casucha al final de un pueblecito de montaña.',
  'Vivían en una casa pequeña y fea: una ___.|casucha|casita|casona|casaza',
  'Salió enfadado de la reunión y dio un ___.|portazo|portón|portita|portilla'],
c2u2: ['Formas verbales literarias: -se y futuro de subjuntivo','Literary verb forms: the -se subjunctive and the future subjunctive','صيغ فعلية أدبية',
  'imperfecto de subjuntivo en -se = -ra: si lo hubiese sabido = si lo hubiera sabido\nfuturo de subjuntivo (refranes y leyes): Adonde fueres, haz lo que vieres.\nquien infringiere esta norma … (lenguaje jurídico)',
  'Literature and law preserve two forms: the imperfect subjunctive in -se, which is interchangeable with -ra, and the future subjunctive (fuere, hubiere), which today appears only in proverbs and legal texts.',
  'يحتفظ الأدب والقانون بصيغتين: الماضي من الـ subjuntivo المنتهي بـ -se، ويمكن تبادله مع -ra، والـ futuro de subjuntivo (fuere وhubiere) الذي لا يظهر اليوم إلا في الأمثال والنصوص القانونية.',
  'Si hubiese tenido más tiempo, habría escrito una carta más corta.',
  'Adonde ___, haz lo que vieres.|fueres|fueras|irás|vayas',
  'Si lo ___ sabido, no habría venido.|hubiese|hubiere|habría|había'],
c2u3: ['El neutro lo','The neuter lo: lo esencial, lo difícil que es','أداة الحياد lo',
  'lo + adjetivo (idea abstracta): Lo esencial es invisible a los ojos.\nlo + adjetivo / adverbio + que (intensidad): No sabes lo difícil que es.\nlo de + sustantivo: lo de ayer (el asunto de ayer)',
  'Lo + adjective turns a quality into an abstract idea: lo bueno (the good thing), lo esencial (what is essential). Lo + adjective + que expresses intensity: lo difícil que es (how difficult it is).',
  'lo + صفة تحوّل الصفة إلى فكرة مجرّدة: lo bueno (الشيء الجيد)، وlo esencial (ما هو جوهري). أما lo + صفة + que فتعبّر عن الشدّة: lo difícil que es (كم هو صعب).',
  'Lo verdaderamente difícil no es encontrar respuestas, sino hacer buenas preguntas.',
  'No te imaginas ___ difícil que es definir la verdad.|lo|el|la|qué lo',
  '___ esencial es invisible a los ojos.|Lo|El|La|Los'],
c2u4: ['Exclamativas e intensificación','Exclamations and intensifiers: ¡Qué … tan …!, ¡Cuánto …!','التعجّب والتوكيد',
  '¡Qué + sustantivo + tan / más + adjetivo!: ¡Qué discurso tan brillante!\n¡Cuánto + verbo!: ¡Cuánto me alegro!\n¡Cómo + verbo!: ¡Cómo habla! · ¡Si lo sabré yo!',
  'Persuasive speech uses exclamations to involve the audience: ¡Qué + noun + tan / más + adjective!, ¡Cuánto + verb! and ¡Cómo + verb! Note the written accent on exclamatory qué, cuánto and cómo.',
  'يستخدم الخطاب الإقناعي التعجّب لإشراك الجمهور: ¡Qué + اسم + tan / más + صفة!، و¡Cuánto + فعل!، و¡Cómo + فعل!. ولاحظ علامة النبر المكتوبة على qué وcuánto وcómo في التعجّب.',
  '¡Qué argumento tan sencillo y, sin embargo, tan poderoso!',
  '¡___ discurso tan brillante!|Qué|Cuál|Cuánto|Cómo',
  '¡___ me alegro de que hayas venido!|Cuánto|Cuán|Cuántos|Cuál'],
c2u5: ['Construcciones absolutas de participio','Absolute participle constructions: Analizados los datos, …','تراكيب اسم المفعول المطلقة',
  'participio + sustantivo (concordancia): Analizados los datos, se redactó el informe.\nUna vez terminado el experimento, …\n= Cuando se analizaron los datos, …',
  'Scientific Spanish often opens a sentence with a past participle that agrees with its noun: Analizadas las muestras, … (once the samples had been analysed). Una vez + participle has the same meaning.',
  'تفتتح الإسبانية العلمية الجملة كثيراً باسم مفعول يتطابق مع الاسم الذي يليه: Analizadas las muestras, … (بعد أن حُلّلت العيّنات). وuna vez + اسم المفعول تحمل المعنى نفسه.',
  'Revisados los resultados por expertos independientes, el artículo fue aceptado.',
  '___ los datos, los investigadores redactaron el informe.|Analizados|Analizado|Analizadas|Analizando los',
  'Una vez ___ el experimento, se compararon los resultados.|terminado|terminada|terminando|terminar'],
c2u6: ['El condicional de rumor','The journalistic conditional (unconfirmed information)','الشرط للتعبير عن خبر غير مؤكّد',
  'Según fuentes no confirmadas, el ministro habría recibido sobornos.\n(= parece que recibió, pero no está confirmado)\nLa empresa estaría negociando su venta.',
  'Spanish journalism uses the conditional to report unconfirmed information: habría recibido = he allegedly received. Media criticism checks whether this conditional is used to spread rumours without evidence.',
  'تستخدم الصحافة الإسبانية الـ condicional لنقل معلومات غير مؤكّدة: habría recibido أي «يُزعم أنه تلقّى». ويفحص النقد الإعلامي ما إذا كان هذا الأسلوب يُستخدم لنشر الإشاعات دون دليل.',
  'Según el diario, la empresa estaría preparando cientos de despidos.',
  'Según fuentes no confirmadas, el ministro ___ dinero de la empresa.|habría recibido|hubo recibido|haya recibido|recibiera',
  'Según la policía, el incendio ___ causado por un cortocircuito.|habría sido|habrá|hubiera|sería sido'],
c2u7: ['Verbos que cambian de significado con se','Verbs that change meaning with se: parecer / parecerse, acordar / acordarse','أفعال يتغيّر معناها مع se',
  'parecer (seem) · parecerse a (look like)\nacordar (agree) · acordarse de (remember)\nir (go) · irse (leave) · quedar (meet, remain) · quedarse (stay)',
  'Many verbs change their meaning when they become pronominal: Parece cansada (she seems tired) but Se parece a su madre (she looks like her mother); Acordamos un precio (we agreed on a price) but No me acuerdo (I don’t remember).',
  'كثير من الأفعال يتغيّر معناها عندما تصبح ضميرية: Parece cansada (تبدو متعبة) لكن Se parece a su madre (تشبه أمها)، وAcordamos un precio (اتفقنا على سعر) لكن No me acuerdo (لا أتذكّر).',
  'Se parece mucho a su abuela, aunque no se acuerda de ella.',
  'Mi hija ___ mucho a su abuela.|se parece|parece|se aparece|aparenta',
  'No me ___ de su nombre.|acuerdo|recuerdo|acuerda|recuerda'],
c2u8: ['La atenuación en la negociación','Softening in negotiation: me gustaría que, sería conveniente que','تلطيف العبارة في التفاوض',
  'Quería / Quisiera pedirle … (cortesía)\nNos gustaría que + imperfecto de subjuntivo: … que rebajaran el precio.\nSería conveniente / deseable que + imperfecto de subjuntivo',
  'Negotiators soften demands with the imperfect (Quería pedirle), quisiera, and conditional expressions followed by the imperfect subjunctive: Nos gustaría que …, Sería conveniente que …',
  'يلطّف المفاوضون مطالبهم باستخدام الـ imperfecto (Quería pedirle) وquisiera وعبارات الـ condicional التي يليها الماضي من الـ subjuntivo: Nos gustaría que … وSería conveniente que …',
  'Sería deseable que ambas partes mostraran algo más de flexibilidad.',
  'Nos gustaría que ___ el precio un cinco por ciento.|rebajaran|rebajarán|rebajaban|rebajar',
  'Sería conveniente que ambas partes ___ a un acuerdo.|llegaran|llegarán|llegaban|llegar'],
c2u9: ['Estilo indirecto: cambios de tiempo, lugar y persona','Reported speech: changes of time, place and person','الكلام المنقول: تغيّر الزمان والمكان والشخص',
  '«Volveré mañana» → Dijo que volvería al día siguiente.\naquí → allí · hoy → aquel día · este → aquel / ese\n«Tráeme el libro» → Me pidió que le llevara el libro.',
  'When mediating what someone said at another time and place, adapt everything: tenses, time and place words, possessives, and verbs like traer → llevar and venir → ir.',
  'عند نقل ما قاله شخص في زمان ومكان آخرين يجب تكييف كل شيء: الأزمنة وظروف الزمان والمكان والملكية وأفعال مثل traer ← llevar وvenir ← ir.',
  'El delegado explicó que aquel día no podía firmar y que volvería a la semana siguiente.',
  'Hace un mes dijo que volvería ___.|al día siguiente|mañana|ayer|hoy',
  'Me pidió que le ___ el libro al día siguiente.|llevara|traería|llevaré|llevo'],
c2u10: ['Perífrasis de futuro e inminencia','Future and imminence: estar a punto de, haber de, estar por','تراكيب المستقبل والوشوك',
  'estar a punto de + infinitivo (inminente): La empresa está a punto de cambiar.\nhaber de + infinitivo (obligación o futuro, formal): Han de enfrentarse a nuevos retos.\nestar por + infinitivo (aún no hecho): La revolución digital está por llegar.',
  'Estar a punto de means something is about to happen, haber de + infinitive expresses a formal obligation or a future that is expected, and estar por + infinitive refers to something that has not yet happened.',
  'estar a punto de تعني أن الأمر على وشك الحدوث، وhaber de + المصدر تعبّر عن وجوب رسمي أو مستقبل متوقَّع، وestar por + المصدر تشير إلى شيء لم يحدث بعد.',
  'Estamos a punto de vivir cambios que han de transformar nuestra forma de trabajar.',
  'La empresa está a punto ___ lanzar un producto revolucionario.|de|a|por|en',
  'Las nuevas generaciones han ___ enfrentarse a retos inéditos.|de|que|a|por']

Object.assign(LLA.GRAMMAR.fr, {
c2u1: ['Nuances de la négation et ne explétif','Nuances of negation and the expletive ne','دقائق النفي و ne الزائدة',
  'ne … guère (hardly) · ne … point (literary) · ne … que (only)\nne explétif (sans valeur négative) : Je crains qu’il ne soit trop tard.\naprès avant que, à moins que, de peur que : avant qu’il ne parte',
  'Formal French has several shades of negation: ne … guère (hardly), ne … point (strong, literary), ne … que (only). The expletive ne, used after craindre que, avant que or à moins que, is not negative at all.',
  'للنفي في الفرنسية الرسمية درجات: ne … guère (بالكاد)، وne … point (نفي قوي أدبي)، وne … que (فقط). أما ne الزائدة بعد craindre que وavant que وà moins que فلا تحمل أي معنى نفي.',
  'Je crains qu’il ne soit trop tard pour revenir en arrière.',
  'Je crains qu’il ___ soit trop tard.|ne|n’en|pas|ne pas',
  'Il ne parle ___ : à peine trois mots par jour.|guère|point de|que|jamais rien'],
c2u2: ['Le subjonctif imparfait (style littéraire)','The imperfect subjunctive in literary style (qu’il fût, qu’il eût)','الـ Subjonctif الماضي الأدبي',
  'qu’il fût · qu’il eût · qu’il parlât · qu’il vînt\nplus-que-parfait du subjonctif : qu’elle fût partie · qu’il eût compris\nconcordance littéraire : Il fallait qu’elle partît.',
  'Classic literature uses the imperfect and pluperfect subjunctive after a main verb in the past. They are mostly found in the third person singular, with a circumflex accent: qu’il fût, qu’il eût. You need to recognise them, not use them in speech.',
  'يستخدم الأدب الكلاسيكي الـ subjonctif imparfait والـ plus-que-parfait بعد فعل رئيسي في الماضي، ويكثر في صيغة الغائب المفرد مع علامة ^: qu’il fût وqu’il eût. والمطلوب التعرّف عليهما لا استخدامهما في الكلام.',
  'Bien qu’il fût épuisé, il continua d’écrire jusqu’à l’aube.',
  'Il fallait qu’elle ___ partie avant l’aube.|fût|fut|fusse|furent',
  'Bien qu’il ___ raison, personne ne l’écouta.|eût|eut|eussent|aurait'],
c2u3: ['L’infinitif substantivé','Nominalised infinitives: l’être, le devenir, le savoir','المصدر المستعمل اسماً',
  'l’être et le paraître · le devenir · le savoir · le pouvoir\nle vivre-ensemble · le non-dit\nTout est devenir (Héraclite).',
  'Philosophical French turns infinitives into masculine nouns to name abstract ideas: l’être (being), le devenir (becoming), le savoir (knowledge). They take an article and can be qualified by adjectives.',
  'تحوّل الفرنسية الفلسفية المصادر إلى أسماء مذكّرة لتسمية الأفكار المجرّدة: l’être (الوجود / الكينونة)، وle devenir (الصيرورة)، وle savoir (المعرفة)، وتأخذ أداة التعريف ويمكن وصفها بالصفات.',
  'Pour Héraclite, tout est devenir : on ne se baigne jamais deux fois dans le même fleuve.',
  '___ et le paraître ne coïncident pas toujours.|L’être|Être|Un être|L’étant',
  'Selon Héraclite, tout est ___ et rien ne demeure.|devenir|devenu|deviendra|devient'],
c2u4: ['L’inversion du sujet en style soutenu','Subject inversion in formal style: aussi faut-il, peut-être a-t-il','تقديم الفعل على الفاعل في الأسلوب الراقي',
  'aussi (= donc) + inversion : Les preuves manquent ; aussi faut-il être prudent.\npeut-être, sans doute, à peine + inversion : Peut-être a-t-il raison.\nainsi + inversion : Ainsi parlait le sage.',
  'In formal speech and writing, certain adverbs at the start of a sentence trigger inversion: aussi (meaning “therefore”), peut-être, sans doute, à peine, ainsi. A -t- is inserted between two vowels: a-t-il.',
  'في الكلام والكتابة الرسميين تؤدّي بعض الظروف في بداية الجملة إلى تقديم الفعل على الفاعل: aussi (بمعنى «لذلك»)، وpeut-être، وsans doute، وà peine، وainsi. وتُضاف -t- بين حرفين صوتيين: a-t-il.',
  'Le débat fut long ; aussi l’orateur dut-il résumer ses arguments.',
  'Les preuves manquent ; aussi ___ prudents.|faut-il être|il faut être|faut être il|il faut-il être',
  'Peut-être ___ raison, mais il n’a pas convaincu.|a-t-il|il a-t-il|a il|a-il'],
c2u5: ['Tournures impersonnelles et modalisation','Impersonal structures and hedging: il est possible que, il convient de','التراكيب غير الشخصية والتحفّظ العلمي',
  'il est possible / probable / peu probable que + subjonctif (sauf probable : indicatif)\nil convient de + infinitif · il s’avère que + indicatif\nil semblerait que … (prudence)',
  'Scientific French presents results cautiously with impersonal structures. Il est possible que and il est peu probable que take the subjunctive; il est probable que and il s’avère que take the indicative; il convient de means “it is advisable to”.',
  'تعرض الفرنسية العلمية النتائج بحذر باستخدام التراكيب غير الشخصية: il est possible que وil est peu probable que يتبعهما الـ subjonctif، أما il est probable que وil s’avère que فيتبعهما الـ indicatif، وil convient de تعني «من المناسب أن».',
  'Il s’avère que l’effet observé est statistiquement significatif.',
  'Il est possible que ce traitement ___ efficace.|soit|est|sera|fût',
  'Il ___ de vérifier ces résultats avant toute publication.|convient|s’avère|semble|paraît'],
c2u6: ['Mettre l’information à distance','Distancing information: the journalistic conditional, présumé, prétendu','التحفّظ في نقل الأخبار',
  'conditionnel journalistique : Le ministre aurait démissionné. (non confirmé)\nle présumé coupable · le prétendu expert · un soi-disant témoin\nselon / d’après + source',
  'French journalism marks unconfirmed facts with the conditional (aurait démissionné = reportedly resigned) and with words like présumé, prétendu and soi-disant. Media criticism checks whether these precautions are respected.',
  'تُميّز الصحافة الفرنسية الوقائع غير المؤكّدة باستخدام الـ conditionnel (aurait démissionné أي «يُقال إنه استقال») وبكلمات مثل présumé وprétendu وsoi-disant. ويفحص النقد الإعلامي مدى احترام هذه الاحتياطات.',
  'D’après le quotidien, le groupe aurait dissimulé des pertes importantes.',
  'Le ___ coupable a été relâché faute de preuves.|présumé|présumant|présume|présomption',
  'Selon la police, le suspect ___ avoué les faits.|aurait|aurais|aurai|auraient'],
c2u7: ['L’accord du participe passé : cas difficiles','Past participle agreement: difficult cases','مطابقة اسم المفعول: حالات صعبة',
  'avec avoir : accord avec le COD placé avant → les traditions que j’ai héritées\nverbes pronominaux : Elles se sont lavées. / Elles se sont lavé les mains.\npas d’accord si le COD suit ou si se est COI : Ils se sont parlé.',
  'With avoir, the participle agrees with a direct object placed before the verb. With pronominal verbs it agrees with se only if se is the direct object: elles se sont lavées, but elles se sont lavé les mains (the object les mains comes after) and ils se sont parlé (se is indirect).',
  'مع avoir يتطابق اسم المفعول مع المفعول به المباشر إذا سبق الفعل. ومع الأفعال الضميرية يتطابق مع se فقط إذا كانت مفعولاً به مباشراً: elles se sont lavées، لكن elles se sont lavé les mains (المفعول les mains جاء بعده)، وils se sont parlé (se مفعول غير مباشر).',
  'Les langues que nos grands-parents ont parlées font partie de notre identité.',
  'Les traditions que j’ai ___ de mes parents sont précieuses.|héritées|hérité|héritée|hérités',
  'Elles se sont ___ la main.|serré|serrées|serrés|serrée'],
c2u8: ['La négociation : atténuer et proposer','Negotiating: softening and proposing (il serait souhaitable que, nous pourrions)','التفاوض: التلطيف وتقديم الاقتراحات',
  'il serait souhaitable / préférable que + subjonctif\nnous pourrions envisager de … · seriez-vous disposé(e) à … ?\nsi + imparfait → conditionnel : Si vous commandiez davantage, nous pourrions …',
  'Negotiators soften proposals with the conditional and impersonal expressions followed by the subjunctive: Il serait souhaitable que vous revoyiez votre offre. Hypotheses with si + imperfect make offers conditional.',
  'يلطّف المفاوضون اقتراحاتهم بالـ conditionnel وبعبارات غير شخصية يتبعها الـ subjonctif: Il serait souhaitable que vous revoyiez votre offre. وتجعل الفرضيات مع si + الـ imparfait العروضَ مشروطة.',
  'Il serait préférable que nous trouvions un terrain d’entente avant la fin du mois.',
  'Il serait souhaitable que vous ___ votre offre.|revoyiez|revoyez|reverrez|revoir',

const AR_SHAPES = [['ب','ت','ث','ن','ي'], ['ج','ح','خ'], ['د','ذ'], ['ر','ز'], ['س','ش'], ['ص','ض'], ['ط','ظ'], ['ع','غ'], ['ف','ق']];

function buildAlpha(act, lang) {

function buildActivity(uid, act, lang) {
  lang = lang || S.target;
  if (uid === ALPHA_ID) return buildAlpha(act, lang);
  const ws = W(uid, lang), xs = X(uid, lang), u = UNIT[uid], items = [];
  if (act === 'v1' || act === 'v2') {
    const mid = Math.ceil(ws.length / 2);
    const part = act === 'v1' ? ws.slice(0, mid) : ws.slice(mid);
    const pool = ws.length >= 4 ? ws : wordPool(uid, lang);
    for (let c = 0; c < part.length; c += 4) {
      const chunk = part.slice(c, c + 4);
      chunk.forEach(w => items.push(cardItem(w, lang)));
      shuffle(chunk).forEach((w, j) => items.push(quizWord(w, pool, j % 3, lang)));
    }
    pick(part.filter(w => article(w.t, lang)), 3).forEach(w => items.push(articleItem(w, lang)));
    pick(part, 3).forEach(w => items.push(typeWord(w, lang)));
    if (part.length >= 4) items.push(matchItem(pick(part, Math.min(5, part.length)), lang));
    return items;
  }
  if (act === 'gr') {
    const g = gram(lang, uid);
    items.push({k:'info', g, lang});
    g.q.forEach(q => items.push(gqItem(q, lang)));
    pick(grammarPool(uid, lang).filter(q => !g.q.includes(q)), 4).forEach(q => items.push(gqItem(q, lang)));
    pick(xs.filter(s => wc(s.t) <= 12), 2).forEach(s => { const o = orderItem(s, lang, 'grammar'); if (o) items.push(o); });
    return items;
  }
  if (act === 'li') {
    xs.forEach(s => items.push(listenMeaning(s, xs.length >= 4 ? xs : sentPool(uid, lang), lang)));
    pick(xs.slice().sort((a, b) => a.t.length - b.t.length).slice(0, 4), 3).forEach(s => items.push(dictItem(s, lang)));
    const h = heardItem(uid, lang); if (h) items.push(h);
    return items;
  }
  if (act === 're') {
    const gaps = clozeItems(uid, 3, lang).concat(contextWordItems(uid, 2, lang));
    whichItems(uid, Math.max(4, 9 - gaps.length), lang).forEach(i => items.push(i));
    gaps.forEach(i => items.push(i));
    return items;
  }
  if (act === 'sp') {
    pick(xs, 4).forEach(s => items.push({k:'speak', mode:'repeat', text:s.t, tr:s.m, lang, skill:'speak'}));
    pick(xs.filter(s => wc(s.t) <= 12), 1).forEach(s => items.push({k:'speak', mode:'say', text:s.t, tr:s.m, lang, skill:'speak'}));
    items.push({k:'speak', mode:'free', topic:uTitle(u, lang), topicN:uTitle(u), kws:pick(ws, 6).map(w => core(w.t, lang)), min:SPEAK_MIN[u.lv], model:xs.map(s => s.t), lang, skill:'speak', w:2});
    return items;
  }
  if (act === 'wr') {
    pick(xs, 3).forEach(s => { const o = orderItem(s, lang); if (o) items.push(o); });
    pick(xs, 3).forEach(s => items.push(transItem(s, lang)));
    items.push({k:'write', topic:uTitle(u, lang), topicN:uTitle(u), kws:pick(ws, 6).map(w => core(w.t, lang)), min:UNIT_WRITE_MIN[u.lv], model:xs.map(s => s.t), lang, skill:'write', w:2});
    return items;
  }
  if (act === 'te') {
    pick(ws, 3).forEach((w, j) => items.push(quizWord(w, ws, j % 3, lang)));
    gram(lang, uid).q.forEach(q => items.push(gqItem(q, lang)));
    pick(xs, 2).forEach(s => items.push(listenMeaning(s, xs, lang)));
    pick(xs, 1).forEach(s => items.push(dictItem(s, lang)));
    clozeItems(uid, 2, lang, 'read').forEach(i => items.push(i));
    pick(xs.filter(s => wc(s.t) <= 12), 1).forEach(s => { const o = orderItem(s, lang); if (o) items.push(o); });
    pick(xs, 1).forEach(s => items.push(transItem(s, lang)));

  }

}

}

/* weeks run Monday to Sunday; a week key looks like 2026-W46 */
function weekStart(d) { const x = new Date(d || Date.now()); x.setHours(0, 0, 0, 0); const wd = (x.getDay() + 6) % 7; x.setDate(x.getDate() - wd); return x; }
function weekKey(d) {
  const x = new Date(d || Date.now()); x.setHours(12, 0, 0, 0); x.setDate(x.getDate() + 3 - (x.getDay() + 6) % 7);
  const y = x.getFullYear(), j = new Date(y, 0, 4); const n = 1 + Math.round(((x - j) / DAY - 3 + (j.getDay() + 6) % 7) / 7);
  return y + '-W' + pad(n);
}
function weekXP() { const s = weekStart(); let n = 0; for (let i = 0; i < 7; i++) { const d = new Date(s.getTime() + i * DAY + 12 * 3600000); n += S.log[dstr(d)] || 0; } return n; }

};
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h; }
function quests() {
  const td = today();
  if (S.quests.date !== td) S.quests = {date:td, prog:{}, claimed:false};

  async remoteGet() {
    if (this.mode === 'firebase') {
      const base = `users/${this.user.id}/private/`, d = (await this.fsBatch([base + 'progress']))[base + 'progress'];
      if (!d) return null;
      const st = JSON.parse(fsUn(d.state) || 'null'); if (!st) return null;
      const langs = fsUn(d.srsLangs);
      if (Array.isArray(langs)) {        // word reviews live in one document per language
        st.srs = {};
        const got = langs.length ? await this.fsBatch(langs.map(l => base + 'srs_' + l)) : {};
        for (const l of langs) { const x = got[base + 'srs_' + l]; if (x) { const m = fsUn(x.map) || '{}'; st.srs[l] = JSON.parse(m); this.srsSent[l] = m; } }

    }

      if (!core.exists) return null;
      const d = core.data() || {}, st = JSON.parse(d.state || 'null'); if (!st) return null;
      st.srs = {};
      for (const l of (d.srsLangs || [])) { const s = await this.db.doc(base + '/srs_' + l).get(); if (s.exists) { const m = (s.data() || {}).map || '{}'; st.srs[l] = JSON.parse(m); this.srsSent[l] = m; } }
      return {state:st, updated:d.updated || 0};
    }
    return null;
  },
  async remotePut(st) {
    const now = Date.now();
    if (this.mode === 'firebase') {
      const base = `users/${this.user.id}/private/`, core = Object.assign({}, st); delete core.srs;
      const langs = Object.keys(st.srs || {});
      for (const l of langs) { const m = JSON.stringify(st.srs[l] || {}); if (this.srsSent[l] !== m) { await this.fs('PATCH', base + 'srs_' + l, fsFields({map:m, updated:now})); this.srsSent[l] = m; } }
      await this.fs('PATCH', base + 'progress', fsFields({state:JSON.stringify(core), srsLangs:langs, updated:now, v:3}));
      await this.fs('PATCH', `users/${this.user.id}`, fsFields({name:(S.name || this.user.name || '').slice(0, 60), native:S.native || '', target:S.target || '', courses:Object.keys(S.courses), xp:S.xp, streak:streakNow(), weekXp:weekXP(), badges:Object.keys(S.badges).length, updated:now}));
      return;
    }
    if (this.mode === 'claude') {
      // one document for the course state, one per language for the word reviews (each stays well under the store's size limit)
      const base = 'data/users/' + this.user.id, core = Object.assign({}, st); delete core.srs;
      const langs = Object.keys(st.srs || {});
      for (const l of langs) { const m = JSON.stringify(st.srs[l] || {}); if (this.srsSent[l] !== m) { await this.db.doc(base + '/srs_' + l).set({map:m, updated:now}); this.srsSent[l] = m; } }

    }
  },
  async pullMerge() {
    if (!this.user) return;

  },
  queue(delay) {

  },
  async flush() {

        const r = await this.remoteGet(); this.lastPull = Date.now();
        if (r && r.state && (r.updated || 0) > this.lastPut) { S = mergeStates(S, r.state); save(true); if (!R && !WZ && !G) render(); }
      }

  fail(e) {

  /* ----- activity record: lessons, games, exams, badges ----- */
  log(e) {

    if (this.mode === 'claude') {

    }
  },
  /* ----- weekly league ----- */
  async pushLeague() {
    if (!this.user || this.readonly) return;

    if (this.leagueSent === key) return;
    try {
      if (this.mode === 'firebase') await this.fs('PATCH', `leagues/${wk}/players/${this.user.id}`, fsFields({name:(S.name || this.user.name || '').slice(0, 40), xp, lang:S.target || '', updated:Date.now()}));
      if (this.mode === 'claude') await this.db.doc('league/' + this.user.id).set({week:wk, xp, lang:S.target || '', updated:Date.now()});
      this.leagueSent = key;
    } catch (e) {}
  },
  async loadLeague(force) {
    if (!this.user) return null;
    if (!force && this.league && Date.now() - this.leagueAt < 60000) return this.league;
    const wk = weekKey(); let rows = [];
    try {
      await this.pushLeague();
      if (this.mode === 'firebase') {
        const tok = await this.auth.currentUser.getIdToken();
        const r = await fetch(this.fsBase() + `/leagues/${wk}:runQuery`, {method:'POST', headers:{Authorization:'Bearer ' + tok, 'Content-Type':'application/json'},

        const arr = r.ok ? await r.json() : [];

      } else if (this.mode === 'claude') {
        const q = await this.db.collection('league').where('week', '==', wk).limit(300).get();
        const docs = q.docs.map(d => ({id:d.id, xp:(d.data() || {}).xp || 0})).sort((x, y) => y.xp - x.xp).slice(0, 30);
        const ids = docs.map(d => d.id), ps = ids.length ? await this.cu.profiles(ids) : {};
        rows = docs.map(d => ({id:d.id, name:(ps[d.id] && ps[d.id].name) || '', photo:(ps[d.id] && ps[d.id].avatarUrl) || '', xp:d.xp, me:d.id === this.user.id}));
      }
    } catch (e) { rows = this.league || []; }

  },
  /* ----- sign-in (public site) ----- */
  async signUp(name, email, pw) {

    if (name) { S.name = name; save(true); try { await c.user.updateProfile({displayName:name}); } catch (e) {} if (this.user) this.user.name = name; }
    try { await c.user.sendEmailVerification(); } catch (e) {}
  },
  async signIn(email, pw) { this.justSignedIn = true; await this.auth.signInWithEmailAndPassword(email, pw); },
  async google() {

  },
  async reset(email) { await this.auth.sendPasswordResetEmail(email); },
  async signOut() {

  async deleteAccount() {
    const uid = this.user.id;

    for (const l of Object.keys(S.srs || {})) await del(`users/${uid}/private/srs_${l}`);
    await del(`users/${uid}/private/progress`);

/* Learn Languages Academy — games. Every game uses the words the learner has met (topped up from their current units),
   earns points, counts for quests and streaks, and keeps a personal best per language. */
let G = null;
const GAMES = ['lightning', 'memory', 'rain', 'spell', 'swipe', 'story'];
const GAME_INIT = {};

function openGame(id) {
  const lang = S.target;
  const pool = gamePool(16, lang);
  if (pool.length < 6) { toast(t('g_need_words')); return; }
  Voice.stop();
  G = {id, lang, pool, score:0, combo:0, maxCombo:0, correct:0, wrong:0, t0:Date.now(), done:false};
  GAME_INIT[id](G);
  const el = $('#runner'); el.hidden = false; el.classList.add('is-game'); document.documentElement.style.overflow = 'hidden';
  renderGame();
  if (G.start) G.start();
}
function stopGameTimers() { if (!G) return; clearInterval(G.tick); clearTimeout(G.to); if (G.raf) cancelAnimationFrame(G.raf); G.raf = null; }
function closeGame() {
  if (!G) return;
  if (!G.done && (G.correct + G.wrong) > 0) addMinutes((Date.now() - G.t0) / 60000);
  stopGameTimers(); Voice.stop(); G = null;
  const el = $('#runner'); el.hidden = true; el.innerHTML = ''; el.classList.remove('is-game'); document.documentElement.style.overflow = '';
  save(); render();
}
const fmtClock = ms => { const s = Math.max(0, Math.round(ms / 1000)); return Math.floor(s / 60) + ':' + pad(s % 60); };
const multOf = c => c >= 10 ? 4 : c >= 6 ? 3 : c >= 3 ? 2 : 1;
function hit(g, pts) { g.correct++; g.combo++; g.maxCombo = Math.max(g.maxCombo, g.combo); g.score += pts; if (g.combo >= 3) Sound.combo(g.combo); else Sound.ok(); }
function miss(g) { g.wrong++; g.combo = 0; Sound.bad(); }

/* ---------- 1. Lightning round: 60 seconds, combos multiply points ---------- */
GAME_INIT.lightning = g => {
  g.dur = 60000; g.i = 0; lightNext(g);
  g.start = () => { g.t0 = Date.now(); g.tick = setInterval(lightTick, 100); };
};
function lightNext(g) {
  const w = g.pool[g.i++ % g.pool.length], dir = Math.random() < 0.6 ? 'tm' : 'mt';
  const opts = shuffle([w].concat(distractors(w, g.pool, 3, x => dir === 'tm' ? x.m : x.t)));
  g.q = {w, dir, opts, a:opts.indexOf(w)}; g.flash = null; g.lock = false;
}
function lightTick() {
  if (!G || G.id !== 'lightning' || G.done) return;
  const left = G.dur - (Date.now() - G.t0);
  const bar = $('#g-timebar'); if (bar) bar.style.width = Math.max(0, left / G.dur * 100) + '%';
  const s = $('#g-secs'); if (s) s.textContent = Math.max(0, Math.ceil(left / 1000));
  if (left <= 0) finishGame();
}
function lightAnswer(i) {
  const g = G; if (g.lock || g.done) return; g.lock = true;
  const ok = i === g.q.a;
  if (ok) hit(g, 10 * multOf(g.combo + 1)); else miss(g);
  g.flash = {i, ok}; renderGame();
  g.to = setTimeout(() => { if (!G || G.done) return; lightNext(G); renderGame(); }, ok ? 230 : 700);
}
function lightningHTML(g) {
  const q = g.q;
  const prompt = q.dir === 'tm' ? `<div class="g-prompt"><span class="g-word" lang="${g.lang}" dir="${META[g.lang].dir}">${esc(q.w.t)}</span><small>${esc(t('g_light_tm'))}</small></div>`
    : `<div class="g-prompt"><span class="g-word">${esc(q.w.m)}</span><small>${esc(t('g_light_mt', {lang:lname(g.lang)}))}</small></div>`;
  return `<div class="g-light">${prompt}<div class="g-opts">${q.opts.map((o, i) => {
    let cls = ''; if (g.flash) { if (i === q.a) cls = 'right'; else if (i === g.flash.i) cls = 'wrong'; }
    return `<button class="g-opt ${cls}" data-a="g-opt" data-i="${i}"><span class="k">${i + 1}</span><span>${q.dir === 'tm' ? esc(o.m) : tl(o.t, g.lang)}</span></button>`; }).join('')}</div></div>`;
}

/* ---------- 2. Memory: find the pairs (word ↔ meaning) ---------- */
GAME_INIT.memory = g => {
  const ws = g.pool.slice(0, 6);
  g.cards = shuffle(ws.flatMap((w, p) => [{p, side:'t', w}, {p, side:'m', w}]));
  g.open = []; g.matched = []; g.moves = 0; g.lock = false;
  g.start = () => { g.t0 = Date.now(); g.tick = setInterval(() => { const el = $('#g-clock'); if (el && G) el.textContent = fmtClock(Date.now() - G.t0); }, 500); };
};
function memFlip(i) {
  const g = G; if (g.lock || g.done || g.matched.includes(i) || g.open.includes(i)) return;
  g.open.push(i); Sound.flip();
  if (g.open.length === 2) {
    g.moves++;
    const [a, b] = g.open.map(k => g.cards[k]);
    if (a.p === b.p && a.side !== b.side) {
      g.matched.push(...g.open); g.open = []; hit(g, 0); Voice.speak(a.w.t, g.lang);
      if (g.matched.length === g.cards.length) { renderGame(); g.to = setTimeout(finishGame, 650); return; }
    } else { g.lock = true; miss(g); renderGame(); g.to = setTimeout(() => { if (!G) return; G.open = []; G.lock = false; renderGame(); }, 950); return; }
  }
  renderGame();
}
function memoryHTML(g) {
  return `<div class="mem-grid">${g.cards.map((c, i) => {
    const up = g.open.includes(i) || g.matched.includes(i), done = g.matched.includes(i);
    const face = c.side === 't' ? tl(c.w.t, g.lang) : `<span>${esc(c.w.m)}</span>`;
    return `<button class="mcard ${up ? 'up' : ''} ${done ? 'done' : ''} ${c.side}" data-a="g-card" data-i="${i}" aria-label="${up ? '' : esc(t('g_card'))}"><span class="mc-in"><span class="mc-back">${LOGO}</span><span class="mc-face">${face}</span></span></button>`; }).join('')}</div>`;
}

/* ---------- 3. Word rain: catch the falling word that matches ---------- */
GAME_INIT.rain = g => {
  g.lives = 3; g.drops = []; g.seq = 0; g.speed = 48; g.spawnEvery = 1450; g.lastSpawn = 0; g.goal = 15; g.since = 0;
  g.words = g.pool.slice(0, Math.min(g.pool.length, 24)); rainTarget(g);
  g.start = () => { g.last = performance.now(); g.lastSpawn = g.last - g.spawnEvery + 300; g.raf = requestAnimationFrame(rainLoop); };
};
function rainTarget(g) { let w; do { w = rnd(g.words); } while (g.words.length > 1 && g.target === w); g.target = w; g.since = 0; }
function rainLoop(now) {
  const g = G; if (!g || g.id !== 'rain' || g.done) return;
  const dt = Math.min(0.05, (now - g.last) / 1000); g.last = now;
  const field = $('#g-field');
  if (field) {
    const H = field.clientHeight;
    if (now - g.lastSpawn > g.spawnEvery) { rainSpawn(g, field); g.lastSpawn = now; }
    for (const d of g.drops.slice()) {
      d.y += g.speed * dt * d.v; d.el.style.transform = `translateY(${d.y}px)`;
      if (d.y > H - 46) {
        d.el.remove(); g.drops.splice(g.drops.indexOf(d), 1);
        if (d.w === g.target) { g.lives--; g.combo = 0; g.wrong++; Sound.bad(); field.classList.add('missed'); setTimeout(() => field.classList.remove('missed'), 300); rainHead();
          if (g.lives <= 0) { finishGame(); return; } rainTarget(g); rainPrompt(); }
      }
    }
  }
  g.raf = requestAnimationFrame(rainLoop);
}
function rainSpawn(g, field) {
  const falling = g.drops.some(d => d.w === g.target);
  let w;
  if (!falling && (g.since >= 1 || Math.random() < 0.45)) { w = g.target; g.since = 0; }
  else { const others = g.words.filter(x => x !== g.target && !g.drops.some(d => d.w === x)); w = rnd(others.length ? others : g.words.filter(x => x !== g.target)); g.since++; }
  const el = document.createElement('button');
  el.className = 'drop'; el.dataset.a = 'g-drop'; el.dataset.id = String(++g.seq); el.lang = g.lang; el.dir = META[g.lang].dir; el.textContent = w.t;
  el.style.left = (3 + Math.random() * 64) + '%';
  field.appendChild(el);
  g.drops.push({id:g.seq, w, y:-50, v:0.85 + Math.random() * 0.35, el});
}
function rainHit(id) {
  const g = G; if (!g || g.done) return;
  const d = g.drops.find(x => String(x.id) === String(id)); if (!d) return;
  if (d.w === g.target) {
    hit(g, 10 + Math.min(g.combo, 10) * 2); Voice.speak(d.w.t, g.lang);
    d.el.classList.add('pop'); const el = d.el; setTimeout(() => el.remove(), 260); g.drops.splice(g.drops.indexOf(d), 1);
    g.speed += 3; g.spawnEvery = Math.max(820, g.spawnEvery - 40);
    if (g.correct >= g.goal) { finishGame(); return; }
    rainTarget(g); rainPrompt();
  } else {
    g.lives--; miss(g); d.el.classList.add('nope'); const el = d.el; setTimeout(() => el.classList.remove('nope'), 420);
    if (g.lives <= 0) { finishGame(); return; }
  }
  rainHead();
}
const hearts = n => [0, 1, 2].map(i => `<span class="heart ${i < n ? 'on' : ''}">${IC.heart}</span>`).join('');
function rainHead() { const h = $('#g-lives'); if (h && G) h.innerHTML = hearts(G.lives); const s = $('#g-score'); if (s && G) s.textContent = G.score; const p = $('#g-prog'); if (p && G) p.style.width = (G.correct / G.goal * 100) + '%'; }
function rainPrompt() { const p = $('#g-target'); if (p && G) { p.textContent = G.target.m; p.classList.remove('flash'); void p.offsetWidth; p.classList.add('flash'); } }
function rainHTML(g) {
  return `<div class="rain"><div class="rain-field" id="g-field"><div class="rain-ground"></div></div>
    <div class="rain-ask"><small>${esc(t('g_rain_ask', {lang:lname(g.lang)}))}</small><b id="g-target">${esc(g.target.m)}</b></div></div>`;
}

/* ---------- 4. Spell it: build the word from its letters ---------- */
const spellForm = (txt, lang) => { let c = core(txt, lang); if (lang === 'ar') c = c.replace(/[ً-ْـ]/g, ''); return c.trim(); };
GAME_INIT.spell = g => {
  const fit = w => { const c = spellForm(w.t, g.lang); return [...c].length >= 3 && [...c].length <= 10 && !/[\s'’-]/.test(c); };
  g.words = g.pool.filter(fit).slice(0, 8); if (g.words.length < 4) g.words = g.pool.filter(w => [...spellForm(w.t, g.lang)].length <= 12).slice(0, 8);
  g.i = 0; spellSetup(g);
  g.start = () => Voice.speak(G.cur.word, G.lang);
};
function spellSetup(g) {
  const w = g.words[g.i], word = spellForm(w.t, g.lang), letters = [...word];
  let tiles = shuffle(letters.map((ch, k) => ({k, ch})));
  if (letters.length > 1 && tiles.every((x, j) => x.k === j)) tiles = tiles.reverse();
  g.cur = {w, word, letters, tiles, built:[], state:'ask'};
}
function spellTap(k) { const c = G.cur; if (c.state !== 'ask' || c.built.includes(k)) return; c.built.push(k); Sound.tap(); if (c.built.length === c.letters.length) spellCheck(); else renderGame(); }

function spellCheck() {
  const g = G, c = g.cur, got = c.built.map(k => c.tiles.find(x => x.k === k).ch).join('');
  const ok = norm(got, g.lang, true) === norm(c.word, g.lang, true);
  c.state = ok ? 'ok' : 'bad';
  if (ok) hit(g, 20 + c.letters.length * 2); else miss(g);
  Voice.speak(c.word, g.lang); renderGame();
  g.to = setTimeout(() => { if (!G || G.done) return; G.i++; if (G.i >= G.words.length) { finishGame(); return; } spellSetup(G); renderGame(); Voice.speak(G.cur.word, G.lang); }, ok ? 950 : 1900);
}
function spellHTML(g) {
  const c = g.cur, d = META[g.lang].dir;
  const slots = c.letters.map((_, j) => { const k = c.built[j]; const ch = k != null ? c.tiles.find(x => x.k === k).ch : ''; return `<span class="slot ${ch ? 'full' : ''}">${esc(ch)}</span>`; }).join('');
  return `<div class="spell">
    <div class="g-prompt"><small>${esc(t('g_spell_ask', {lang:lname(g.lang)}))}</small><span class="g-word">${esc(c.w.m)}</span>${playBtn(c.word, g.lang, true)}</div>
    <div class="slots ${c.state}" dir="${d}" lang="${g.lang}">${slots}</div>
    ${c.state === 'bad' ? `<p class="spell-ans">${esc(t('fb_answer'))}: ${tl(c.word, g.lang)}</p>` : ''}
    <div class="tiles" dir="${d}">${c.tiles.map(x => `<button class="tile" data-a="g-tile" data-k="${x.k}" lang="${g.lang}" ${c.built.includes(x.k) || c.state !== 'ask' ? 'disabled' : ''}>${esc(x.ch)}</button>`).join('')}</div>
    <div class="spell-act"><button class="btn ghost" data-a="g-undo" ${c.built.length && c.state === 'ask' ? '' : 'disabled'}>${IC.undo}${esc(t('g_undo'))}</button></div></div>`;
}

/* ---------- 5. True or false: swipe right if the pair is right ---------- */
GAME_INIT.swipe = g => {
  g.deck = g.pool.slice(0, 20).map(w => { const real = Math.random() < 0.5; const other = real ? w : rnd(g.pool.filter(x => x !== w && x.m !== w.m)) || w; return {w, m:other.m, ok:real || other === w}; });
  g.i = 0; g.dur = 45000; g.lock = false;
  g.start = () => { g.t0 = Date.now(); g.tick = setInterval(() => { if (!G || G.done) return; const left = G.dur - (Date.now() - G.t0); const bar = $('#g-timebar'); if (bar) bar.style.width = Math.max(0, left / G.dur * 100) + '%'; const s = $('#g-secs'); if (s) s.textContent = Math.max(0, Math.ceil(left / 1000)); if (left <= 0) finishGame(); }, 100); };
};
function swipeAnswer(yes) {
  const g = G, c = g.deck[g.i]; if (!c || g.lock || g.done) return; g.lock = true;
  const ok = yes === c.ok;
  if (ok) hit(g, 10 + Math.min(g.combo, 10)); else miss(g);
  g.fly = {dir:yes ? 1 : -1, ok}; renderGame();
  g.to = setTimeout(() => { if (!G || G.done) return; G.i++; G.fly = null; G.lock = false; if (G.i >= G.deck.length) { finishGame(); return; } renderGame(); }, 420);
}
function swipeHTML(g) {
  const c = g.deck[g.i], next = g.deck[g.i + 1];
  const card = (x, cls) => `<div class="sw-card ${cls}" ${cls === 'top' ? 'id="sw-card"' : ''}><span class="sw-word" lang="${g.lang}" dir="${META[g.lang].dir}">${esc(x.w.t)}</span><span class="sw-eq">=</span><span class="sw-mean">${esc(x.m)}</span></div>`;
  const fly = g.fly ? `fly ${g.fly.dir > 0 ? 'r' : 'l'} ${g.fly.ok ? 'ok' : 'bad'}` : '';
  return `<div class="swipe"><p class="sw-help">${esc(t('g_swipe_help'))}</p><div class="sw-stack">${next ? card(next, 'under') : ''}${card(c, 'top ' + fly)}</div>
    <div class="sw-btns"><button class="sw-btn no" data-a="g-no" aria-label="${esc(t('g_false'))}">${IC.x}<span>${esc(t('g_false'))}</span></button><button class="sw-btn yes" data-a="g-yes" aria-label="${esc(t('g_true'))}">${IC.check}<span>${esc(t('g_true'))}</span></button></div></div>`;
}
function bindSwipe() {
  const el = $('#sw-card'); if (!el || !G || G.id !== 'swipe' || G.fly) return;
  let x0 = null, dx = 0;
  el.addEventListener('pointerdown', e => { x0 = e.clientX; dx = 0; try { el.setPointerCapture(e.pointerId); } catch (err) {} el.classList.add('drag'); });
  el.addEventListener('pointermove', e => { if (x0 == null) return; dx = e.clientX - x0; el.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`; el.dataset.lean = dx > 30 ? 'r' : dx < -30 ? 'l' : ''; });
  const end = () => { if (x0 == null) return; x0 = null; el.classList.remove('drag'); if (Math.abs(dx) > 90) swipeAnswer(dx > 0); else { el.style.transform = ''; el.dataset.lean = ''; } };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}

/* ---------- 6. Story chat: complete each message of a short story ---------- */
const toks = s => s.split(/\s+/).map(w => w.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, '')).filter(Boolean);
GAME_INIT.story = g => {
  const ok = u => hasContent(u.id, g.lang) && X(u.id, g.lang).length >= 4;
  const units = studiedUnits(g.lang).filter(ok);
  g.unit = rnd(units.length ? units : unitsOf(currentLevel(g.lang)).filter(ok).slice(0, 2));
  const xs = X(g.unit.id, g.lang).slice(0, 6);
  const all = uniq(xs.flatMap(s => toks(s.t)).filter(w => [...w].length >= 3));
  g.msgs = xs.map((s, j) => {
    const cand = toks(s.t).filter(w => [...w].length >= 4); const gap = cand.length ? rnd(cand) : (toks(s.t).sort((a, b) => b.length - a.length)[0] || '');
    const wrong = shuffle(all.filter(w => norm(w, g.lang) !== norm(gap, g.lang))).slice(0, 2);
    return {s, gap, opts:shuffle([gap].concat(wrong)), who:j % 2, tries:0, done:false};
  });
  g.i = 0; g.firstTry = 0; g.bad = null;
};
function storyPick(k) {
  const g = G, m = g.msgs[g.i]; if (!m || m.done || g.lock) return;
  const w = m.opts[k];
  if (norm(w, g.lang) === norm(m.gap, g.lang)) {
    m.done = true; if (!m.tries) g.firstTry++; hit(g, m.tries ? 8 : 20); g.bad = null; g.lock = true; renderGame();
    Voice.speak(m.s.t, g.lang);
    g.to = setTimeout(() => { if (!G || G.done) return; G.lock = false; G.i++; if (G.i >= G.msgs.length) { finishGame(); return; } renderGame(); scrollChat(); }, 1100);
  } else { m.tries++; miss(g); g.bad = k; renderGame(); }
}
function scrollChat() { const c = $('#g-chat'); if (c) c.scrollTop = c.scrollHeight; }
function storyHTML(g) {
  const d = META[g.lang].dir;
  const bubble = (m, j) => {
    const text = m.done || j < g.i ? tl(m.s.t, g.lang) : `<span class="tl" lang="${g.lang}" dir="${d}">${gapHTML(esc(m.s.t.replace(m.gap, '___')))}</span>`;
    return `<div class="msg ${m.who ? 'r' : 'l'} ${j === g.i && !m.done ? 'now' : ''}"><span class="ava">${m.who ? mascot('happy', 34) : `<span class="ava-b">${esc(t('g_story_friend').slice(0, 1))}</span>`}</span>
      <div class="bub">${text}${m.done || j < g.i ? `<span class="tr">${esc(m.s.m)}</span>` : ''}</div></div>`;
  };
  const m = g.msgs[g.i];
  return `<div class="story"><p class="story-t">${esc(uTitle(g.unit))}</p><div class="chat" id="g-chat">${g.msgs.slice(0, g.i + 1).map(bubble).join('')}</div>
    ${m && !m.done ? `<div class="story-opts" dir="${d}">${m.opts.map((w, k) => `<button class="chip ${g.bad === k ? 'wrong' : ''}" data-a="g-pick" data-k="${k}" lang="${g.lang}">${esc(w)}</button>`).join('')}</div>` : '<div class="story-opts"></div>'}</div>`;
}

/* ---------- shared frame, results ---------- */
function gameHeadHTML(g) {
  const close = `<button class="icon-btn" data-a="g-close" aria-label="${esc(t('close'))}">${IC.x}</button>`;
  const score = `<span class="g-score">${IC.bolt}<b id="g-score">${g.score}</b></span>`;
  const combo = g.combo >= 3 ? `<span class="g-combo">×${multOf(g.combo)}</span>` : '';
  let mid = '';
  if (g.id === 'lightning' || g.id === 'swipe') { const left = g.t0 && g.start ? Math.max(0, g.dur - (Date.now() - g.t0)) : g.dur; mid = `<div class="bar g-time"><i id="g-timebar" style="width:${left / g.dur * 100}%"></i></div><span class="g-secs" id="g-secs">${Math.ceil(left / 1000)}</span>`; }
  else if (g.id === 'memory') mid = `<span class="g-meta">${esc(t('g_moves', {n:g.moves}))}</span><span class="g-meta" id="g-clock">${fmtClock(Date.now() - g.t0)}</span>`;
  else if (g.id === 'rain') mid = `<span class="g-lives" id="g-lives">${hearts(g.lives)}</span><div class="bar"><i id="g-prog" style="width:${g.correct / g.goal * 100}%"></i></div>`;
  else { const n = g.id === 'spell' ? g.words.length : g.msgs.length; mid = `<div class="bar"><i style="width:${g.i / n * 100}%"></i></div><span class="g-meta">${Math.min(g.i + 1, n)}/${n}</span>`; }
  return `<div class="g-head">${close}<span class="g-name">${esc(t('g_' + g.id))}</span><div class="g-mid">${mid}</div>${combo}${score}</div>`;
}
function renderGame() {
  const el = $('#runner'); if (!G) return;
  if (G.done) { el.innerHTML = gameResultHTML(G); return; }
  const body = {lightning:lightningHTML, memory:memoryHTML, rain:rainHTML, spell:spellHTML, swipe:swipeHTML, story:storyHTML}[G.id](G);
  if (G.id === 'rain' && $('#g-field')) { rainHead(); return; }      // the rain field keeps running; only the head changes
  el.innerHTML = `${gameHeadHTML(G)}<div class="g-body g-${G.id}">${body}</div>`;
  if (G.id === 'swipe') bindSwipe();
  if (G.id === 'story') scrollChat();
}
function gameXP(g) {
  return Math.max(5, Math.round({lightning:Math.min(40, g.score / 12), memory:20, rain:Math.min(40, g.correct * 2 + 5), spell:g.correct * 3 + 5, swipe:Math.min(30, g.correct * 1.5), story:g.firstTry * 4 + 5}[g.id] || 10));
}
function finishGame() {
  const g = G; if (!g || g.done) return;
  stopGameTimers(); g.done = true;
  const secs = Math.round((Date.now() - g.t0) / 1000);
  if (g.id === 'memory') g.score = Math.max(30, 320 - g.moves * 12 - secs * 2);
  const xp = gameXP(g), rec = gameRecord(g.id, g.score);
  addXP(xp); addMinutes(secs / 60);
  questEvent('game', 1); if (g.maxCombo) questEvent('combo', g.maxCombo);
  if (g.wrong === 0 && g.correct >= 5) { questEvent('perfect', 1); S.stats.perfect = (S.stats.perfect || 0) + 1; }
  S.stats.bestCombo = Math.max(S.stats.bestCombo || 0, g.maxCombo || 0);
  g.result = {xp, best:rec.best, isBest:rec.isBest, secs};
  logActivity({kind:'game', ref:g.id, score:g.score, xp});
  const fresh = checkBadges();
  save(); renderGame(); Sound.win(); confetti();
  if (fresh.length) setTimeout(() => showBadges(fresh), 1100);
}
function gameResultHTML(g) {
  const r = g.result;
  const tiles = [[IC.bolt, '+' + r.xp, t('g_r_xp')], [IC.check, g.correct, t('g_r_correct')], [IC.flame, g.maxCombo, t('g_r_combo')], [IC.clock, fmtClock(r.secs * 1000), t('g_r_time')]];
  const story = g.id === 'story' ? `<details class="fold" open><summary>${esc(t('g_story_all'))}</summary><div class="inner text-block">${g.msgs.map(m => `<div class="sent">${playBtn(m.s.t, g.lang)}<div><p>${tl(m.s.t, g.lang)}</p><p class="tr">${esc(m.s.m)}</p></div></div>`).join('')}</div></details>` : '';
  return `<div class="r-body"><div class="r-inner"><div class="g-result">${mascot('cheer', 120)}
      <p class="eyebrow">${esc(t('g_' + g.id))}</p><div class="g-big">${g.score}</div><p class="muted">${esc(t('g_points'))}</p>
      ${r.isBest ? `<span class="pill sun big">${IC.trophy}${esc(t('g_new_best'))}</span>` : `<span class="pill">${esc(t('g_best', {n:r.best}))}</span>`}
      <div class="g-tiles">${tiles.map(x => `<div class="g-tile">${x[0]}<b>${x[1]}</b><small>${esc(x[2])}</small></div>`).join('')}</div>${story}</div></div></div>
    <div class="r-foot"><div class="in"><button class="btn ghost lg" data-a="g-close">${esc(t('g_back'))}</button><button class="btn lg" data-a="g-again" data-g="${g.id}">${IC.review}${esc(t('g_again'))}</button></div></div>`;
}
function gameKey(e) {
  if (!G) return false;
  if (e.key === 'Escape') { closeGame(); return true; }
  if (G.done) return false;
  if (G.id === 'lightning' && /^[1-4]$/.test(e.key)) { lightAnswer(+e.key - 1); return true; }
  if (G.id === 'swipe' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { swipeAnswer(e.key === 'ArrowRight'); return true; }
  if (G.id === 'story' && /^[1-3]$/.test(e.key)) { storyPick(+e.key - 1); return true; }
  if (G.id === 'spell') {
    if (e.key === 'Backspace') { spellUndo(); return true; }
    if (e.key.length === 1) { const c = G.cur, tile = c.tiles.find(x => !c.built.includes(x.k) && x.ch.toLowerCase() === e.key.toLowerCase()); if (tile) { spellTap(tile.k); return true; } }
  }
  return false;
}

  save();
  const nextLv = LEVELS[LEVELS.indexOf(E.lv) + 1];
  const rows = E.parts.map(p => { const v = E.scores[p.key], ok = v >= EXAM_PASS; return `<div class="part-row"><div><div class="nm"><span>${tl(p.name, lang)}</span><span class="mono" style="color:${ok ? 'var(--ok)' : 'var(--bad)'}">${v}%</span></div><div class="bar" style="margin-top:6px"><i style="width:${v}%;background:${ok ? 'var(--ok)' : 'var(--bad)'}"></i></div></div><span>${ok ? IC.check.replace('<svg', '<svg width="22" height="22" style="color:var(--ok)"') : IC.x.replace('<svg', '<svg width="22" height="22" style="color:var(--bad)"')}</span></div>`; }).join('');
  const html = `<div class="result"><span class="eyebrow">${esc(mock ? t('mock_title', {lv:E.lv}) : t('ex_result'))} · ${esc(lname(lang))}</span><span class="big ${pass ? 'ok' : 'bad'}">${total}%</span><h2>${esc(pass ? t('ex_passed') : t('ex_failed'))}</h2>${!pass ? `<p class="lede">${esc(t('ex_failed_d'))}</p>` : ''}<div class="parts">${rows}</div>${pass && !mock ? `<span class="pill sun">${IC.bolt}${esc(t('res_xp', {n:200}))}</span><div class="delta">${trackHTML(lang)}</div>` : ''}</div>`;
  const btns = [];
  if (pass && !mock) { btns.push({a:'r-cert', label:t('ex_cert'), data:`data-lv="${E.lv}"`}); if (nextLv) btns.push({a:'r-close-course', label:t('ex_next', {lv:nextLv}), data:`data-lv="${nextLv}"`, cls:'sun lg'}); else btns.push({a:'r-close-done', label:t('done')}); }
  else btns.push({a:'r-close-course', label:t('nav_learn'), data:`data-lv="${E.lv}"`});
  return {html, buttons:btns};
}

/* ---------- events ---------- */
function onClick(e) {
  const dd = document.querySelector('details.l-ui[open]'); if (dd && !dd.contains(e.target)) dd.open = false;
  const el = e.target.closest('[data-a]'); if (!el) return;
  if (el.disabled) return;
  const a = el.dataset.a, d = el.dataset;
  if (el.tagName === 'A') e.preventDefault();
  switch (a) {
    case 'nav': if (R || WZ || G) return; closeModal(); go(d.v, d.v === 'learn' ? {lv:null} : null); break;
    case 'node': nodeSheet(d.id); break;
    case 'quests': questsModal(); break;
    case 'chest': { const n = claimChest(); if (n) { closeModal(); toast(t('q_chest_got', {n})); Sound.win(); confetti(); render(); } break; }
    case 'game': closeModal(); openGame(d.g); break;
    case 'g-close': closeGame(); break;
    case 'g-again': { const g = d.g; closeGame(); openGame(g); break; }
    case 'g-opt': lightAnswer(+d.i); break;
    case 'g-card': memFlip(+d.i); break;
    case 'g-drop': rainHit(d.id); break;
    case 'g-tile': spellTap(+d.k); break;
    case 'g-undo': spellUndo(); break;
    case 'g-yes': swipeAnswer(true); break;
    case 'g-no': swipeAnswer(false); break;
    case 'g-pick': storyPick(+d.k); break;
    case 'auth': if (Cloud.canAuth()) authModal(d.m); break;
    case 'auth-mode': AUTH.mode = d.m; AUTH.err = ''; AUTH.msg = ''; renderAuth(); break;
    case 'auth-google': authGoogle(); break;
    case 'signout': signOutFlow(); break;
    case 'delacct': deleteFlow(); break;
    case 'edit-name': nameModal(); break;
    case 'name-save': { const v = (($('#nm-in') || {}).value || '').trim().slice(0, 40); S.name = v; save(); closeModal(); render(); Cloud.pushLeague(); break; }
    case 'pf-sound': S.prefs.sound = d.v === '1'; save(); if (S.prefs.sound) Sound.ok(); render(); break;
    case 'r-sound': S.prefs.sound = S.prefs.sound === false; save(); if (R) renderRun(); break;
    case 'say': Voice.speak(d.t, d.l, d.slow ? 0.7 : 1); break;
    case 'sayall': try { Voice.speakAll(JSON.parse(d.list), d.l); } catch (err) {} break;
    case 'ui-lang': S.native = d.l; save(); render(); break;
    /* wizard */
    case 'wz-open': openWizard(d.m, false, d.t); break;
    case 'l-jump': { const sec = document.getElementById(d.t); if (sec) sec.scrollIntoView({behavior:reduceMotion() ? 'auto' : 'smooth', block:'start'}); break; }
    case 'l-top': window.scrollTo({top:0, behavior:reduceMotion() ? 'auto' : 'smooth'}); break;
    case 'wz-add': closeModal(); openWizard('place', true); break;
    case 'wz-close': closeWizard(); break;
    case 'wz-native': WZ.native = d.l; S.native = d.l; if (WZ.target === d.l) WZ.target = null; render(); renderWizard(); break;
    case 'wz-target': WZ.target = d.l; renderWizard(); break;
    case 'wz-goal': WZ.goal = d.lv; renderWizard(); break;
    case 'wz-pace': WZ.pace = d.p; renderWizard(); break;
    case 'wz-mode': WZ.mode = d.m; renderWizard(); break;
    case 'wz-next': if (wizCanNext()) { WZ.step = Math.min(WZ_STEPS - 1, WZ.step + 1); renderWizard(); } break;
    case 'wz-back': WZ.step = Math.max(0, WZ.step - 1); renderWizard(); break;
    case 'wz-go': wizardGo(); break;
    case 'langs': langModal(); break;
    case 'privacy': privacyModal(); break;
    case 'switch': closeModal(); S.target = d.l; save(); go('today'); break;
    case 'modal-close': closeModal(); break;
    case 'modal-bg': if (e.target === el) closeModal(); break;
    case 'modal-yes': { const f = modalYes; closeModal(); if (f) f(); break; }
    case 'lvtab': closeModal(); go('learn', {lv:d.lv, scrolled:true}); break;
    case 'unit': closeModal(); go('unit', {id:d.id}); break;
    case 'act': closeModal(); startActivity(d.id, d.act); break;
    case 'exam': closeModal(); startExam(d.lv, false); break;
    case 'mock': startExam(d.lv, true); break;
    case 'cert': closeModal(); go('cert', {lv:d.lv}); break;
    case 'cert-name': { const v = ($('#pf-name') || {}).value || ''; S.name = v.trim(); save(); render(); break; }
    case 'print': window.print(); break;
    case 'd-words': startWords(true); break;
    case 'd-review': startWords(false); break;
    case 'd-lesson': { const nl = nextLesson(); if (nl.u && nl.a) startActivity(nl.u.id, nl.a); else if (nl.exam && examOpen(nl.exam)) startExam(nl.exam); else go('course'); break; }
    case 'd-listen': startDrill('listen'); break;
    case 'd-speak': startDrill('speak'); break;
    case 'd-read': startDrill('read'); break;
    case 'd-write': startDrill('write'); break;
    case 'wlv': V.flv = d.lv; render(); break;
    /* runner */
    case 'r-close':
      if (R && !R.done && R.i > 0) confirmBox(t('leave_q'), t('leave_yes'), closeRunner, false); else closeRunner();
      break;
    case 'r-close-done': closeRunner(); break;
    case 'r-close-today': closeRunner(); go('today'); break;
    case 'r-close-course': closeRunner(); go('course', {lv:d.lv || null}); break;
    case 'r-next': if (R) nextItem(); break;   // single-screen sessions (intros) end through nextItem as well
    case 'r-check': checkCurrent(); break;
    case 'r-right': if (R && R.res[R.i]) { R.res[R.i].s = 1; const it = cur(); if (it.srsKey) gradeWord(it.srsKey, true, it.lang); } nextItem(); break;
    case 'r-clear': R.build = []; renderRun(); break;
    case 'r-retry': closeRunner(); startActivity(d.id, d.act); break;
    case 'r-unit': closeRunner(); go('unit', {id:d.id}); break;
    case 'r-go': closeRunner(); startActivity(d.id, d.act); break;
    case 'r-exam': closeRunner(); startExam(d.lv); break;
    case 'r-cert': closeRunner(); go('cert', {lv:d.lv}); break;
    case 'r-speakdone': if (R && R.best) { const it = cur(); answer(R.best.score, {answer:tl(it.text, it.lang)}); } break;
    case 'opt': chooseOpt(+d.i); break;
    case 'bld': if (R && R.state === 'ask' && !R.build.includes(+d.ti)) { R.build.push(+d.ti); renderRun(); } break;
    case 'unb': if (R && R.state === 'ask') { R.build.splice(+d.j, 1); renderRun(); } break;
    case 'm-l': matchTap('l', +d.i); break;
    case 'm-r': matchTap('r', +d.i); break;
    case 'mic': micToggle(); break;
    case 'self': selfRate(d.v); break;
    case 'ins': { const inp = $('#ans'); if (inp) { const s = inp.selectionStart || inp.value.length; inp.value = inp.value.slice(0, s) + d.c + inp.value.slice(inp.selectionEnd || s); inp.focus(); inp.setSelectionRange(s + 1, s + 1); R.typed = inp.value; } break; }
    case 'pl-skip': closeRunner(); course().start = 'A1'; save(); go('today'); break;
    /* prefs */
    case 'pf-native': if (d.l === S.target) { toast(t('w_same')); break; } S.native = d.l; save(); render(); break;
    case 'pf-pace': S.prefs.pace = d.g; save(); render(); break;
    case 'pf-goal-lv': course().goal = d.lv; save(); render(); break;
    case 'pf-theme': S.prefs.theme = d.th; save(); render(); break;
    case 'pf-mode': S.prefs.mode = d.m === 'dark' ? 'dark' : 'light'; save(); applyTheme(); render(); break;
    case 'mode': toggleMode(); break;
    case 'pf-copy': {
      const code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
      const ta = $('#pf-code'); if (ta) ta.value = code;
      try { navigator.clipboard.writeText(code).then(() => toast(t('pf_copied')), () => { if (ta) { ta.focus(); ta.select(); } }); } catch (err) { if (ta) { ta.focus(); ta.select(); } }
      break;
    }
    case 'pf-restore': {
      const v = (($('#pf-code') || {}).value || '').trim();
      try { const obj = JSON.parse(decodeURIComponent(escape(atob(v)))); if (!obj || typeof obj !== 'object' || !obj.courses) throw 0; S = normalizeState(obj); save(); toast(t('pf_restore_ok')); render(); }
      catch (err) { toast(t('pf_restore_bad')); }
      break;
    }
    case 'pf-reset': confirmBox(t('pf_reset_q'), t('pf_reset_yes'), () => { const nat = S.native; S = freshState(); S.native = nat; save(); V = {name:'today'}; render(); }, true); break;
  }
}
function onInput(e) {
  const el = e.target;
  if (el.id === 'wsearch') { V.q = el.value; const pos = el.selectionStart; render(); const s = $('#wsearch'); if (s) { s.focus(); try { s.setSelectionRange(pos, pos); } catch (err) {} } return; }
  if (el.id === 'pf-rate') { S.prefs.rate = Number(el.value); const o = $('#pf-rate-v'); if (o) o.textContent = Number(el.value).toFixed(2) + '×'; save(); return; }
  if (el.id === 'ans' && R) {
    R.typed = el.value;
    if (cur() && cur().k === 'write') { const w = $('#wcount'); if (w) w.textContent = t('words_n', {n:wc(el.value)}) + ' · ' + t('min_words', {n:cur().min}); }
  }
}
function onChange(e) {
  const el = e.target;
  if (el.id && el.id.startsWith('voice-')) { S.prefs.voices[el.dataset.l] = el.value; save(); return; }
  if (el.id === 'pf-name' && V.name === 'prefs') { S.name = el.value.trim(); save(); }
}
function onKey(e) {
  if (G && gameKey(e)) { e.preventDefault(); return; }
  if (e.key === 'Escape' && $('#modal').innerHTML) { closeModal(); e.preventDefault(); return; }
  if (WZ && e.key === 'Enter' && !(e.target && e.target.tagName === 'BUTTON')) { const b = $('[data-a="wz-next"]') || $('[data-a="wz-go"]'); if (b && !b.disabled) b.click(); return; }
  if (!R || R.done) return;
  const it = cur(); if (!it) return;
  const tag = e.target && e.target.tagName;
  const inField = tag === 'TEXTAREA' || tag === 'INPUT';
  if (e.key === 'Enter' && (tag === 'BUTTON' || tag === 'A' || tag === 'SUMMARY')) return;
  if (e.key === 'Enter' && tag !== 'TEXTAREA') {
    e.preventDefault();
    if (R.state === 'fb') { nextItem(); return; }
    if (['card', 'info', 'html'].includes(it.k)) { const b = $('#r-next'); if (b) b.click(); return; }
    if (['type', 'order', 'write'].includes(it.k) || (it.k === 'mcq' && it.exam)) checkCurrent();
    return;
  }
  if (!inField && it.k === 'mcq' && R.state === 'ask' && /^[1-9]$/.test(e.key)) { const i = +e.key - 1; if (i < it.opts.length) chooseOpt(i); }
}

/* ---------- boot ---------- */
function boot() {
  const root = document.getElementById('lla-root');
  root.innerHTML = '<div id="app"></div><div id="runner" class="runner" hidden></div><div id="modal"></div><div id="toast"></div>';
  Voice.init();
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('dictation').then(d => { if (d) { Rec.dict = d; if (R && cur() && cur().k === 'speak') renderRun(); } }).catch(() => {});
    window.claude.use('tts').then(x => { if (x) Voice.cap = x; }).catch(() => {});
  }
  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('change', onChange);
  document.addEventListener('keydown', onKey);
  document.addEventListener('submit', e => { if (e.target && e.target.id === 'auth-form') { e.preventDefault(); authSubmit(e.target); } });
  window.addEventListener('hashchange', () => { if (skipHash) { skipHash = false; return; } if (R || WZ) return; fromHash(); render(); });
  if (window.LLA_DEBUG) window.__lla = {get R() { return R; }, get W() { return WZ; }, get G() { return G; }, get S() { return S; }, set S(v) { S = v; }, get V() { return V; }, Rec, Voice, Cloud, go, render, renderRun, nextItem, course, buildActivity, buildExam, placementBlock, hasContent, unitsOf, UNITS, pathPct, levelPct, openGame, finishGame, quests, checkBadges, mergeStates, normalizeState, weekXP, authModal, nodeSheet, questsModal, showBadges, closeModal, BADGES};
  fromHash();
  render();
  Cloud.init();
}
boot();

})();</script>

<style>/* Learn Languages Academy — playful academy
   Chunky, pressable tiles; one friendly guide (Bubu); a colour per level, a colour per game; real letters as decoration.
   Headings in Baloo Bhaijaan 2 (rounded, Arabic + Latin), reading text in Readex Pro. */
:root{
  --bg:#F7F7FC; --surface:#FFFFFF; --surface-2:#F7F7FC; --sunken:#EEEEF6; --line:#E6E6F0; --line-2:#D8D8E6;
  --ink:#1B1D3A; --ink-2:#4A4D6C; --muted:#666A89;
  --brand:#5A48F5; --brand-edge:#3F2FCF; --on-brand:#FFFFFF; --brand-soft:#EFECFF; --brand-soft-edge:#D9D3FF; --brand-ink:#4232D8;
  --deep:#2B2182; --on-deep:#FFFFFF; --deep-muted:#CBC5FF;
  --sun:#FFC93C; --sun-edge:#E0A300; --on-sun:#3A2A00; --sun-soft:#FFF5D6; --sun-ink:#8A5B00;
  --ok:#1FA971; --ok-edge:#158657; --ok-soft:#DFF7EB; --ok-ink:#11804F;
  --bad:#F0465A; --bad-edge:#C92639; --bad-soft:#FFE6E9; --bad-ink:#C42235;
  --flame:#FF8A1F; --pink:#FF5D8F; --teal:#14B8A6; --sky:#2F9BFF; --amber:#FFB020; --grape:#A35BF0;
  --l-ar:#0B8463; --l-ar-soft:#DCF3EB; --l-en:#2563D9; --l-en-soft:#E1EAFD; --l-de:#E9A10F; --l-de-soft:#FDF1D6;
  --l-es:#D63347; --l-es-soft:#FCE3E6; --l-fr:#9440CC; --l-fr-soft:#F2E4FA; --on-lang:#FFFFFF; --on-lang-de:#352400;
  --band-sun:#FFF6DA; --band-mint:#E4F7EE; --band-sky:#E6F0FF; --band-grape:#F1EBFF; --hero-wash:#ECE9FF;
  --lg-bg:linear-gradient(120deg,#FFE68C,#FFC23D); --lg-ink:#3A2A00; --lg-muted:#694C00; --lg-edge:#E0A300; --lg-tile:#FFFFFF;
  --sh-1:0 2px 0 var(--line);
  --sh-2:0 10px 30px -14px rgba(27,29,58,.22);
  --sh-3:0 30px 60px -30px rgba(43,33,130,.45);
  --f-display:"Baloo Bhaijaan 2","Readex Pro",system-ui,-apple-system,"Segoe UI",Roboto,Tahoma,sans-serif;
  --f-body:"Readex Pro","Noto Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,Tahoma,sans-serif;
  --f-mono:var(--f-body);
  --f-naskh:"Noto Naskh Arabic","Readex Pro",serif;
  --r-xl:30px; --r:22px; --r-md:18px; --r-sm:14px;
  --side:248px; --aside:340px;
}
/* dark mode: chosen by the learner with the moon button (light is the default) */
:root[data-mode="dark"]{
  --bg:#1D2040; --surface:#272B50; --surface-2:#22264A; --sunken:#31365F; --line:#3B4072; --line-2:#4B5186;
  --ink:#F4F5FF; --ink-2:#D2D5F3; --muted:#A8ACD4;
  --brand:#7566FF; --brand-edge:#5244E0; --on-brand:#FFFFFF; --brand-soft:#353076; --brand-soft-edge:#4B4498; --brand-ink:#CDC6FF;
  --deep:#2E2785; --on-deep:#FFFFFF; --deep-muted:#CBC5FF;
  --sun:#FFC93C; --sun-edge:#C58E00; --on-sun:#3A2A00; --sun-soft:#463B19; --sun-ink:#FFD877;
  --ok:#2BC285; --ok-edge:#1A9062; --ok-soft:#1C4537; --ok-ink:#6BE4B0;
  --bad:#FF6B7D; --bad-edge:#C93347; --bad-soft:#4B2334; --bad-ink:#FF9CA8;
  --l-ar:#2EC497; --l-ar-soft:#1B453A; --l-en:#5E8FF6; --l-en-soft:#213761; --l-de:#F4B740; --l-de-soft:#47391B;
  --l-es:#F26A7B; --l-es-soft:#4B2731; --l-fr:#BA7CEB; --l-fr-soft:#3B2653; --on-lang:#0B0E20; --on-lang-de:#0B0E20;
  --band-sun:#2F2D42; --band-mint:#1F3443; --band-sky:#222C55; --band-grape:#2C2757; --hero-wash:#2A2D5C;
  --lg-bg:linear-gradient(120deg,#5E4A16,#4C3913); --lg-ink:#FFEAB0; --lg-muted:#F1D27E; --lg-edge:#2D2209; --lg-tile:#2C2511;
  --sh-2:0 12px 30px -14px rgba(0,0,0,.5); --sh-3:0 30px 60px -30px rgba(0,0,0,.6);
  color-scheme:dark;
}
/* one colour per CEFR level: bright for shapes, deep for text panels */
[data-lv="A1"]{--c:#2BBF7F;--cd:#0E8553;--ce:#1E9563}
[data-lv="A2"]{--c:#18B5CF;--cd:#0A7F96;--ce:#0E8DA3}
[data-lv="B1"]{--c:#4B8BFF;--cd:#2F67E0;--ce:#2E6BDB}
[data-lv="B2"]{--c:#6A5BFF;--cd:#4E3DE6;--ce:#4637D6}
[data-lv="C1"]{--c:#A35BF0;--cd:#8A3FD6;--ce:#7E3CC4}
[data-lv="C2"]{--c:#F0568E;--cd:#C93468;--ce:#C73A6E}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:88px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.62 var(--f-body);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand-ink)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:800;line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
h3,h4{font-weight:700}
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3,[dir="rtl"] h4{letter-spacing:0;line-height:1.35}
p{margin:0}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 55%,transparent);outline-offset:2px;border-radius:12px}
[hidden]{display:none!important}
.mono,.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.center{text-align:center}
.tl{font-family:var(--f-body);unicode-bidi:isolate}
.tl[lang="ar"]{font-family:var(--f-naskh);font-size:1.12em;line-height:1.8}
.eyebrow{font:600 .86rem/1.35 var(--f-body);color:var(--muted)}
.flip-rtl{display:inline-block}
[dir="rtl"] .flip-rtl{transform:scaleX(-1)}

/* ---------- brand & mascot ---------- */
.brand{display:inline-flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);direction:ltr}
.brand-mark{width:42px;height:42px;flex:none;display:block}
.wordmark{display:flex;flex-direction:column;gap:2px;line-height:1;text-align:left}
.wordmark b{font:800 1.18rem/1 var(--f-display);letter-spacing:-.01em;white-space:nowrap}
.wordmark small{font:700 .6rem/1 var(--f-body);letter-spacing:.42em;text-transform:uppercase;color:var(--brand-ink);white-space:nowrap}
.mascot{display:block;flex:none;overflow:visible}
.mascot .m-eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.mascot .m-wave{transform-box:fill-box;transform-origin:20% 90%;animation:wave 1.6s ease-in-out infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-16deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.say{display:flex;align-items:flex-end;gap:12px}
.say-b{position:relative;padding:12px 16px;border-radius:18px;border:2px solid var(--line);background:var(--surface);font-weight:600}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:24px;padding-block:24px 18px;padding-inline:16px;border-inline-end:2px solid var(--line);background:var(--surface);overflow-y:auto}
.side .brand{padding-inline:8px}
.snav{display:flex;flex-direction:column;gap:6px}
.snav a,.snav-more a{display:flex;align-items:center;gap:14px;padding:9px 12px;border-radius:16px;border:2px solid transparent;color:var(--ink-2);text-decoration:none;font:700 1.06rem var(--f-display);transition:background .12s,border-color .12s}
.snav a:hover{background:var(--sunken)}
.sn-ic{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:var(--sunken);color:var(--muted);flex:none;transition:background .12s,color .12s}
.sn-ic svg{width:23px;height:23px}
.snav a[aria-current="page"]{background:var(--brand-soft);border-color:var(--brand-soft-edge);color:var(--brand-ink)}
.sn-learn .sn-ic{--nc:var(--brand)} .sn-play .sn-ic{--nc:var(--amber)} .sn-words .sn-ic{--nc:var(--ok)} .sn-league .sn-ic{--nc:var(--flame)} .sn-profile .sn-ic{--nc:var(--pink)}
.snav a .sn-ic{color:var(--nc)}
.snav a[aria-current="page"] .sn-ic{background:var(--nc);color:#fff}
.snav-more{margin-top:auto;display:flex;flex-direction:column;gap:2px;border-top:2px solid var(--line);padding-top:12px}
.snav-more a{font:600 .95rem var(--f-body);padding:8px 12px}
.snav-more a svg{width:20px;height:20px;color:var(--muted)}
.snav-more a:hover{background:var(--sunken)}
.snav-more a[aria-current="page"]{background:var(--sunken);color:var(--ink)}
.snav-more a[aria-current="page"] svg{color:var(--brand)}
.stage{min-width:0}
.main{min-width:0;padding-block:26px 90px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.cols{max-width:1060px;margin-inline:auto;display:grid;grid-template-columns:minmax(0,1fr) var(--aside);gap:36px;align-items:start}
.cols.wide{grid-template-columns:minmax(0,1fr);max-width:980px}
.col-main{min-width:0;display:flex;flex-direction:column;gap:22px}
.aside{position:sticky;top:20px;display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 40px);overflow-y:auto;scrollbar-width:none;padding-bottom:6px}
.aside::-webkit-scrollbar{display:none}
.aside-foot{font-size:.84rem;color:var(--muted);text-align:center}
.aside-foot .link-btn{color:var(--muted);font-weight:500;text-decoration:none}
.topbar,.tabbar,.m-only{display:none}
.stat-row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.st-course{display:inline-flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font:800 1rem var(--f-display);color:var(--ink-2)}
[dir="rtl"] .st-course{padding:4px 4px 4px 10px}
.st-pill{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:14px;border:0;background:transparent;font:800 1.08rem var(--f-display);color:var(--muted)}
.st-pill svg{width:24px;height:24px}
.st-pill:hover{background:var(--sunken)}
.st-pill.streak{color:var(--muted)} .st-pill.streak svg{color:color-mix(in srgb,var(--flame) 40%,var(--line-2))}
.st-pill.streak.lit{color:var(--flame)} .st-pill.streak.lit svg{color:var(--flame)}
.st-pill.xp{color:var(--sun-ink)} .st-pill.xp svg{color:var(--sun)}
.st-pill.quest{color:var(--brand-ink)} .st-pill.quest svg{color:var(--brand)}
.st-pill.quest.ready{background:var(--sun-soft);animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:none}10%{transform:rotate(-6deg)}20%{transform:rotate(6deg)}30%{transform:none}}
.ava{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);font:800 1.2rem var(--f-display);overflow:hidden;flex:none;border:2px solid var(--line)}
.ava img{width:100%;height:100%;object-fit:cover}
.ava.initial{background:hsl(var(--h,250) 75% 62%);color:#fff;border-color:transparent}
.ava.bubu{background:var(--brand-soft)}
.ava.bubu .mascot{width:34px;height:auto;margin-top:6px}
.ava.sm{width:38px;height:38px;font-size:1rem}
.ava.xl{width:96px;height:96px;font-size:2.4rem;border-width:3px}
.ava.xl.bubu .mascot{width:70px}
@media (max-width:1180px){.cols{grid-template-columns:minmax(0,1fr) 300px;gap:24px}:root{--aside:300px}}
@media (max-width:1020px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side,.aside{display:none}
  .cols{grid-template-columns:minmax(0,1fr);max-width:680px}
  .m-only{display:block}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;align-items:center;gap:10px;padding-block:8px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:2px solid var(--line)}
  .topbar .stat-row{flex:1;min-width:0}
  .tb-me{border:0;background:none;padding:0;flex:none}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .main{padding-block:18px calc(110px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .col-main{gap:18px}
  .tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;inset:auto 0 0 0;z-index:30;background:color-mix(in srgb,var(--surface) 96%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:2px solid var(--line);padding-block:6px calc(6px + env(safe-area-inset-bottom,0px));padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 2px;font:700 .72rem var(--f-display);color:var(--muted);text-decoration:none;min-width:0}
  .tabbar a span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tabbar a svg{width:26px;height:26px;padding:5px 14px;box-sizing:content-box;border-radius:14px;border:2px solid transparent}
  .tabbar a[aria-current="page"]{color:var(--brand-ink)}
  .tabbar a[aria-current="page"] svg{background:var(--brand-soft);border-color:var(--brand-soft-edge);color:var(--brand)}
}
@media (max-width:440px){.topbar{gap:6px}.st-pill{padding:5px 5px;font-size:1rem;gap:3px}.st-pill svg{width:21px;height:21px}.st-course{padding:3px 8px 3px 3px;gap:6px}[dir="rtl"] .st-course{padding:3px 3px 3px 8px}}
.topbar .mode-btn{width:38px;height:38px;border-radius:12px;box-shadow:none;border-width:2px}
@media (max-width:420px){.topbar .st-course>span:not(.lang-glyph){display:none}.topbar .st-course,[dir="rtl"] .topbar .st-course{padding:3px}}
@media (max-width:370px){.topbar .st-pill.quest{display:none}}
.l-actions .mode-btn{width:40px;height:40px;border-radius:13px;border-color:var(--line-2);box-shadow:0 2px 0 var(--line-2)}
.mode-btn svg{width:22px;height:22px}
.mode-btn[aria-pressed="true"]{color:var(--sun-edge)}
.snav-more button{display:flex;align-items:center;gap:14px;padding:8px 12px;border-radius:16px;border:2px solid transparent;background:none;color:var(--ink-2);font:600 .95rem var(--f-body);text-align:start;width:100%}
.snav-more button svg{width:20px;height:20px;color:var(--muted)}
.snav-more button:hover{background:var(--sunken)}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--muted);flex:none;box-shadow:0 3px 0 var(--line);text-decoration:none}
.icon-btn svg{width:21px;height:21px}
.icon-btn:hover{color:var(--ink)}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}

/* ---------- primitives ---------- */
.btn{--edge:var(--brand-edge);display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:50px;padding:12px 22px 8px;border-radius:16px;border:0;background:var(--brand);color:var(--on-brand);font:800 1.05rem/1.15 var(--f-display);letter-spacing:.01em;text-decoration:none;white-space:nowrap;box-shadow:0 4px 0 var(--edge);transition:transform .08s ease,box-shadow .08s ease,filter .15s ease;position:relative}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:grayscale(.4);transform:none}
.btn svg{width:21px;height:21px;flex:none;margin-top:-4px}
.btn.lg{min-height:56px;padding:14px 26px 10px;font-size:1.12rem;border-radius:18px}
.btn.xl{min-height:62px;padding:16px 32px 12px;font-size:1.2rem;border-radius:20px;box-shadow:0 5px 0 var(--edge)}
.btn.xl:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.btn.sm{min-height:40px;padding:9px 16px 5px;font-size:.95rem;border-radius:13px;box-shadow:0 3px 0 var(--edge)}
.btn.sm:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.btn.block{width:100%}
.btn.sun{--edge:var(--sun-edge);background:var(--sun);color:var(--on-sun)}
.btn.ghost{--edge:var(--line-2);background:var(--surface);color:var(--ink-2);box-shadow:inset 0 0 0 2px var(--line-2),0 4px 0 var(--edge)}
.btn.ghost:hover{filter:none;color:var(--brand-ink);background:var(--surface-2)}
.btn.ghost:active{box-shadow:inset 0 0 0 2px var(--line-2),0 1px 0 var(--edge)}
.btn.ghost.sm{box-shadow:inset 0 0 0 2px var(--line-2),0 3px 0 var(--edge)}
.btn.soft{--edge:var(--brand-soft-edge);background:var(--brand-soft);color:var(--brand-ink)}
.btn.danger{--edge:var(--bad-edge);background:var(--bad);color:#fff}
.btn.ghost.danger-t{color:var(--bad-ink)}
.link-btn{background:none;border:0;padding:0;color:var(--brand-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:22px}
.card h2{font-size:1.4rem}
.center-card{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:30px}
.row-c{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.page-h h1{font-size:clamp(1.9rem,3.4vw,2.5rem)}
.page-h .lede{margin-top:4px}
.sub-h{font-size:1.05rem;margin-top:18px;margin-bottom:10px}
.sec-t{font-size:1.4rem;margin-bottom:12px}
.lede{color:var(--ink-2);max-width:62ch}
.lv{--c:var(--brand);--cd:var(--brand-ink);display:inline-flex;align-items:center;justify-content:center;min-width:2.8em;height:1.95em;padding:0 .55em;border-radius:10px;font:800 .92rem/1 var(--f-display);background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--cd);white-space:nowrap}
:root[data-mode="dark"] .lv{color:var(--c)}
.lv.xl{font-size:1.7rem;height:2.2em;border-radius:18px;min-width:2.5em;background:var(--c);color:#fff;box-shadow:0 5px 0 var(--ce)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;font-size:.82rem;font-weight:600;background:var(--sunken);color:var(--ink-2);white-space:nowrap}
.pill svg{width:15px;height:15px}
.pill.ok{background:var(--ok-soft);color:var(--ok-ink)}

.lang-mark[data-l="de"]{--lc:var(--l-de);color:var(--on-lang-de)} .lang-mark[data-l="es"]{--lc:var(--l-es)} .lang-mark[data-l="fr"]{--lc:var(--l-fr)}
.lang-glyph{--lc:var(--brand);display:inline-grid;place-items:center;width:52px;height:52px;border-radius:16px;background:var(--lc);color:var(--on-lang);font:800 1.6rem/1 var(--f-display);letter-spacing:-.02em;box-shadow:0 4px 0 color-mix(in srgb,var(--lc) 62%,#000);flex:none}
.lang-glyph[data-l="ar"]{--lc:var(--l-ar);font:700 1.85rem/1 var(--f-naskh);padding-bottom:6px}
.lang-glyph[data-l="en"]{--lc:var(--l-en)} .lang-glyph[data-l="es"]{--lc:var(--l-es)} .lang-glyph[data-l="fr"]{--lc:var(--l-fr)}
.lang-glyph[data-l="de"]{--lc:var(--l-de);color:var(--on-lang-de)}

/* ---------- track (A1 → C2) ---------- */
.track{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.seg{display:flex;flex-direction:column;gap:8px;background:none;border:0;padding:0;text-align:start;color:inherit;min-width:0}
.seg .rail-bar{position:relative;height:12px;border-radius:99px;background:var(--sunken)}

.seg .code{font:800 1rem var(--f-display);color:var(--cd)}
.seg.locked .code{color:var(--muted)}

button.seg{cursor:pointer;border-radius:10px}
.on-dark .seg .rail-bar{background:rgba(255,255,255,.16)}
.on-dark .seg .rail-bar>i{background:#fff}
.on-dark .seg.passed .rail-bar>i{background:var(--sun)}
.on-dark .seg .gate{background:var(--deep);border-color:rgba(255,255,255,.55)}
.on-dark .seg .code{color:#fff} .on-dark .seg.locked .code,.on-dark .seg .st{color:var(--deep-muted)}
@media (max-width:560px){.seg .st{display:none}.track{gap:4px}.seg .code{font-size:.88rem}.seg .flag{font-size:0;padding:3px}.seg .flag svg{width:12px;height:12px}}

/* ---------- side widgets ---------- */
.wcard{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}

.acct.me .t{display:flex;flex-direction:column;gap:2px;min-width:0}

.sync{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;color:var(--ok-ink)}
.sync svg{width:16px;height:16px}
.sync.s-saving,.sync.s-pending{color:var(--muted)} .sync.s-saving svg,.sync.s-pending svg{animation:pulseo 1s ease-in-out infinite}
.sync.s-offline,.sync.s-local,.sync.s-idle{color:var(--muted)} .sync.s-error{color:var(--bad-ink)}
@keyframes pulseo{50%{opacity:.35}}

.flame-big svg{width:46px;height:46px;color:color-mix(in srgb,var(--flame) 35%,var(--line-2))}

.sc-n{display:block;font:800 2rem/1 var(--f-display)}

.sc-msg{font-size:.9rem;color:var(--ink-2)}
.wdots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px}
.wd i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--sunken);color:#fff}

.wd small{font-size:.7rem;color:var(--muted);font-weight:600}
.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.q{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center}

.q-xp .q-ic{background:var(--sun-soft);color:var(--sun-edge)} .q-game .q-ic{background:color-mix(in srgb,var(--amber) 16%,var(--surface));color:var(--amber)}
.q-combo .q-ic{background:color-mix(in srgb,var(--flame) 16%,var(--surface));color:var(--flame)} .q-perfect .q-ic{background:color-mix(in srgb,var(--pink) 15%,var(--surface));color:var(--pink)}
.q-words .q-ic{background:var(--ok-soft);color:var(--ok)} .q-practice .q-ic{background:color-mix(in srgb,var(--sky) 15%,var(--surface));color:var(--sky)}

.q-t b{display:block;font-size:.92rem;font-weight:600;line-height:1.3}
.qbar{position:relative;display:block;height:18px;border-radius:99px;background:var(--sunken);margin-top:6px;overflow:hidden}

/* ---------- learn: banner, level chips, map ---------- */
.learn{--c:var(--brand);--cd:var(--brand-ink);--ce:var(--brand-edge);display:flex;flex-direction:column;gap:18px}
.ubanner{position:sticky;top:12px;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 18px;border-radius:var(--r);background:color-mix(in srgb,var(--c) 15%,var(--surface));color:var(--cd);border:2px solid color-mix(in srgb,var(--c) 45%,var(--surface));box-shadow:0 5px 0 color-mix(in srgb,var(--c) 55%,var(--surface))}
:root[data-mode="dark"] .ubanner{color:var(--c);background:color-mix(in srgb,var(--c) 20%,var(--surface))}

.ub-t{display:flex;flex-direction:column;gap:2px;min-width:0}

.lv-chip[aria-selected="true"]{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 3px 0 var(--ce)}
@media (max-width:520px){.lv-chips{gap:6px;flex-wrap:nowrap}.lv-chip{padding:4px 10px;font-size:.88rem}.lv-chip svg{display:none}}
.map{list-style:none;margin:0;padding:52px 0 24px;display:flex;flex-direction:column;align-items:center;gap:18px}
.mnode{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;transform:translateX(calc(var(--x) * 54px));width:150px}
[dir="rtl"] .mnode{transform:translateX(calc(var(--x) * -54px))}
.node{position:relative;display:grid;place-items:center;width:80px;height:76px;border-radius:50%;border:0;background:var(--c);color:#fff;box-shadow:0 8px 0 var(--ce);transition:transform .08s,box-shadow .08s}

.node:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ce)}
.node .un{font:800 1.6rem var(--f-display)}

.mnode.open .node::after,.mnode.current .node::after{content:"";position:absolute;inset:-9px -9px -15px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1turn),var(--sunken) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));z-index:-1}
.mnode.done .node{background:var(--sun);color:#fff;box-shadow:0 8px 0 var(--sun-edge)}

@keyframes hop{0%,70%,100%{transform:none}80%{transform:translateY(-6px)}90%{transform:translateY(0)}}

.node-tip{position:absolute;bottom:calc(100% + 6px);padding:8px 14px;border-radius:14px;background:var(--surface);border:2px solid var(--line);font:800 .95rem var(--f-display);color:var(--cd);white-space:nowrap;animation:tipbob 1.8s ease-in-out infinite;z-index:2}
.node-tip::after{content:"";position:absolute;top:100%;left:50%;width:12px;height:12px;margin:-6px 0 0 -6px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
@keyframes tipbob{50%{transform:translateY(-4px)}}
.node-lbl{font:700 .86rem/1.25 var(--f-body);color:var(--ink-2);text-align:center;max-width:150px;overflow-wrap:anywhere}

.buddy{position:absolute;top:-4px}

/* ---------- sheets & modals ---------- */

@media (max-width:620px){.modal.m-sheet,.modal.m-qbox{place-items:end center;padding:0}.modal.m-sheet .box,.modal.m-qbox .box{border-radius:28px 28px 0 0;max-width:none;padding-bottom:calc(26px + env(safe-area-inset-bottom,0px));animation:sheetup .3s cubic-bezier(.2,.9,.3,1) both}}

.sheet-in{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}

.gc-lightning{--gc:var(--amber)} .gc-memory{--gc:var(--grape)} .gc-rain{--gc:var(--sky)} .gc-spell{--gc:var(--ok)} .gc-swipe{--gc:var(--pink)} .gc-story{--gc:var(--teal)}

.pr-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 10px;border-radius:18px;border:2px solid var(--line);background:var(--surface);box-shadow:0 3px 0 var(--line);font:700 .95rem var(--f-display);text-align:center}

.pr-ic{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--brand-soft);color:var(--brand)}

.p-li .pr-ic{background:color-mix(in srgb,var(--sky) 15%,var(--surface));color:var(--sky)} .p-sp .pr-ic{background:color-mix(in srgb,var(--pink) 15%,var(--surface));color:var(--pink)}
.p-re .pr-ic{background:color-mix(in srgb,var(--grape) 15%,var(--surface));color:var(--grape)} .p-wr .pr-ic{background:color-mix(in srgb,var(--teal) 15%,var(--surface));color:var(--teal)}
.p-review .pr-ic{background:var(--sun-soft);color:var(--sun-edge)} .p-v1 .pr-ic{background:var(--ok-soft);color:var(--ok)}
.pr-n{position:absolute;top:8px;inset-inline-end:8px;min-width:24px;height:24px;padding:0 6px;border-radius:99px;background:var(--bad);color:#fff;font:800 .8rem/24px var(--f-display)}
.sec{display:flex;flex-direction:column}

/* ---------- league ---------- */
.league-hero{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:20px;border-radius:var(--r);background:var(--lg-bg);color:var(--lg-ink);box-shadow:0 5px 0 var(--lg-edge)}

.mcard{aspect-ratio:3/3.6;max-width:100%;padding:0;border:0;background:none;perspective:700px}

.rain{display:flex;flex-direction:column;gap:14px;height:calc(100vh - 150px);max-height:720px}

.drop{position:absolute;top:0;padding:10px 16px;border-radius:16px;border:0;background:var(--sky);color:#fff;font:700 1.08rem var(--f-body);box-shadow:0 4px 0 color-mix(in srgb,var(--sky) 65%,#000);white-space:nowrap;will-change:transform;touch-action:manipulation}

.drop.pop{animation:poppy .26s ease forwards}

.spell{display:flex;flex-direction:column;align-items:center;gap:18px}

.slot.full{border-style:solid;border-color:var(--brand-soft-edge);background:var(--brand-soft)}
.slots[lang="ar"] .slot{font-family:var(--f-naskh)}
.slots.ok .slot{border-color:var(--ok);background:var(--ok-soft);color:var(--ok-ink)}
.slots.bad .slot{border-color:var(--bad);background:var(--bad-soft);color:var(--bad-ink);animation:shake .35s ease}
.spell-ans{font-weight:600}
.tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tile{min-width:54px;height:58px;padding:0 10px;border-radius:16px;border:2px solid var(--line);background:var(--surface);box-shadow:0 4px 0 var(--line);font:800 1.6rem var(--f-body)}

.tile:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}

.spell-act{display:flex;gap:10px}
.swipe{display:flex;flex-direction:column;align-items:center;gap:18px}

.sw-stack{position:relative;width:100%;max-width:380px;height:300px}

.sw-card.fly.r{transform:translateX(130%) rotate(18deg);opacity:0} .sw-card.fly.l{transform:translateX(-130%) rotate(-18deg);opacity:0}
.sw-card.fly.ok{border-color:var(--ok);background:var(--ok-soft)} .sw-card.fly.bad{border-color:var(--bad);background:var(--bad-soft)}

.sw-btns{display:flex;gap:18px}

.sw-btn.no svg{background:var(--bad);box-shadow:0 5px 0 var(--bad-edge)} .sw-btn.yes svg{background:var(--ok);box-shadow:0 5px 0 var(--ok-edge)}

.story{display:flex;flex-direction:column;gap:14px;height:calc(100vh - 150px);max-height:760px}

.msg.now .bub{border-color:var(--sun);box-shadow:0 0 0 3px color-mix(in srgb,var(--sun) 30%,transparent)}
.bub .tl{font-size:1.06rem}

.story-opts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-height:56px}
.g-result{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.g-big{font:800 5rem/1 var(--f-display);color:var(--brand-ink);font-variant-numeric:tabular-nums}
.g-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%;margin-top:10px}

.g-tile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 8px;border-radius:18px;border:2px solid var(--line);background:var(--surface)}
.g-tile svg{width:22px;height:22px;color:var(--brand)}
.g-tile:nth-child(1) svg{color:var(--sun)} .g-tile:nth-child(2) svg{color:var(--ok)} .g-tile:nth-child(3) svg{color:var(--flame)}

/* ---------- unit guide ---------- */
.crumbs{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.92rem;flex-wrap:wrap}
.crumbs button{background:none;border:0;padding:2px 0;color:var(--brand-ink);font-weight:700}

.scard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:13px 16px;border-radius:18px;border:2px solid var(--line);background:var(--surface);text-align:start;width:100%;box-shadow:0 3px 0 var(--line)}
button.scard:active:not([disabled]){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.scard[disabled]{cursor:not-allowed;opacity:.6;box-shadow:none}
.scard b{display:block;font:700 1.05rem var(--f-display)}

.score{font:800 1rem var(--f-display);color:var(--muted);font-variant-numeric:tabular-nums}

details.fold{border:2px solid var(--line);border-radius:var(--r);background:var(--surface)}

@media print{.side,.aside,.topbar,.tabbar,.no-print{display:none!important}.shell{display:block}.main{padding:0}body{background:#fff}}

a1u6: [
  ['أستيقظ كل يوم في الساعة السادسة.','I wake up every day at six o’clock.','Ich wache jeden Tag um sechs Uhr auf.','Me despierto todos los días a las seis.','Je me réveille tous les jours à six heures.'],
  ['أستحمّ وأشرب الشاي، ثم أذهب إلى العمل.','I shower and drink tea, then I go to work.','Ich dusche und trinke Tee, dann gehe ich zur Arbeit.','Me ducho y bebo té, luego voy al trabajo.','Je me douche et je bois du thé, puis je vais au travail.'],

  ['في المساء أطبخ وأدرس قليلاً.','In the evening I cook and study a little.','Am Abend koche ich und lerne ein bisschen.','Por la tarde cocino y estudio un poco.','Le soir, je cuisine et j’étudie un peu.'],
  ['أحياناً أشاهد فيلماً مع صديقي.','Sometimes I watch a film with my friend.','Manchmal sehe ich einen Film mit meinem Freund.','A veces veo una película con mi amigo.','Parfois, je regarde un film avec mon ami.'],

b1u8: [
  ['منذ شهرين أسكن في شقة مفروشة في حيّ هادئ.','For two months I have been living in a furnished flat in a quiet neighbourhood.','Seit zwei Monaten wohne ich in einer möblierten Wohnung in einem ruhigen Viertel.','Desde hace dos meses vivo en un piso amueblado en un barrio tranquilo.','Depuis deux mois, j’habite dans un appartement meublé dans un quartier calme.'],
  ['الشقة جميلة ولها شرفة كبيرة، لكن التدفئة لا تعمل جيداً.','The flat is nice and has a big balcony, but the heating does not work well.','Die Wohnung ist schön und hat einen großen Balkon, aber die Heizung funktioniert nicht gut.','El piso es bonito y tiene un balcón grande, pero la calefacción no funciona bien.','L’appartement est beau et il a un grand balcon, mais le chauffage ne marche pas bien.'],

  ['غداً سأتكلّم معه بلطف، فأنا لا أريد مشكلة مع جاري.','Tomorrow I will talk to him politely, because I do not want a problem with my neighbour.','Morgen spreche ich freundlich mit ihm, denn ich möchte keinen Ärger mit meinem Nachbarn.','Mañana hablaré con él amablemente, porque no quiero problemas con mi vecino.','Demain, je vais lui parler gentiment, car je ne veux pas de problème avec mon voisin.']

b1u9: [
  ['في نهاية الأسبوع الماضي ذهبتُ مع أخي إلى مباراة كرة قدم في الملعب.','Last weekend I went with my brother to a football match at the stadium.','Letztes Wochenende bin ich mit meinem Bruder zu einem Fußballspiel ins Stadion gegangen.','El fin de semana pasado fui con mi hermano a un partido de fútbol en el estadio.','Le week-end dernier, je suis allé voir un match de football au stade avec mon frère.'],

  ['منذ الجائحة أصبح العمل عن بُعد أمراً عادياً في كثير من المهن.','Since the pandemic, remote work has become normal in many professions.','Seit der Pandemie ist die Telearbeit in vielen Berufen normal geworden.','Desde la pandemia, el teletrabajo se ha vuelto normal en muchas profesiones.','Depuis la pandémie, le télétravail est devenu normal dans de nombreux métiers.'],
  ['يرى كثير من الموظفين أن المرونة أهم من راتب أعلى.','Many employees believe that flexibility is more important than a higher salary.','Viele Beschäftigte finden die Flexibilität wichtiger als ein höheres Gehalt.','Muchos empleados consideran que la flexibilidad es más importante que un sueldo más alto.','Beaucoup de salariés estiment que la flexibilité compte plus qu’un salaire plus élevé.'],
  ['ومع ذلك، ما زالت المؤهّلات الجيدة والتعلّم المستمر مفتاح النجاح المهني.','Nevertheless, good qualifications and lifelong learning are still the key to professional success.','Trotzdem bleiben gute Qualifikationen und das lebenslange Lernen der Schlüssel zum beruflichen Erfolg.','Sin embargo, las buenas cualificaciones y la formación continua siguen siendo la clave del éxito profesional.','Néanmoins, de bonnes qualifications et la formation continue restent la clé de la réussite professionnelle.']
],
b2u2: [
  ['لقد غيّر الذكاء الاصطناعي طريقة عملنا وتعلّمنا وتواصلنا خلال سنوات قليلة.','Artificial intelligence has changed the way we work, learn and communicate in just a few years.','Künstliche Intelligenz hat in wenigen Jahren verändert, wie wir arbeiten, lernen und kommunizieren.','La inteligencia artificial ha cambiado nuestra forma de trabajar, aprender y comunicarnos en pocos años.','L’intelligence artificielle a changé notre façon de travailler, d’apprendre et de communiquer en quelques années.'],
  ['تستطيع الخوارزميات اليوم تحليل كميات هائلة من البيانات في ثوانٍ.','Today algorithms can analyse huge amounts of data in seconds.','Algorithmen können heute riesige Mengen an Daten in Sekunden analysieren.','Hoy los algoritmos pueden analizar enormes cantidades de datos en segundos.','Aujourd’hui, les algorithmes peuvent analyser d’énormes quantités de données en quelques secondes.'],
  ['في الطب مثلاً تساعد هذه التقنية الأطباء على اكتشاف الأمراض في وقت مبكر.','In medicine, for example, this technology helps doctors detect diseases early.','In der Medizin zum Beispiel hilft diese Technik Ärzten, Krankheiten früh zu erkennen.','En medicina, por ejemplo, esta tecnología ayuda a los médicos a detectar enfermedades a tiempo.','En médecine, par exemple, cette technologie aide les médecins à détecter les maladies plus tôt.'],
  ['لكن هذا التقدّم يحمل أيضاً مخاطر، خاصة فيما يتعلّق بالخصوصية.','But this progress also brings risks, especially regarding privacy.','Doch dieser Fortschritt bringt auch Risiken mit sich, vor allem für die Privatsphäre.','Pero este progreso también conlleva riesgos, sobre todo para la privacidad.','Mais ce progrès comporte aussi des risques, notamment pour la vie privée.'],
  ['يطالب كثير من العلماء بقواعد واضحة لاستخدام هذه التقنيات بشكل مسؤول.','Many scientists call for clear rules so that these technologies are used responsibly.','Viele Wissenschaftler fordern klare Regeln für einen verantwortungsvollen Einsatz dieser Technologien.','Muchos científicos piden normas claras para usar estas tecnologías de forma responsable.','De nombreux scientifiques réclament des règles claires pour utiliser ces technologies de manière responsable.'],
  ['فالسؤال لم يعد هل سنستخدم الذكاء الاصطناعي، بل كيف سنستخدمه.','The question is no longer whether we will use artificial intelligence, but how we will use it.','Die Frage ist nicht mehr, ob wir künstliche Intelligenz nutzen, sondern wie.','La pregunta ya no es si usaremos la inteligencia artificial, sino cómo la usaremos.','La question n’est plus de savoir si nous utiliserons l’intelligence artificielle, mais comment.']
],
b2u3: [
  ['تواجه مجتمعاتنا اليوم تحديات كبيرة، من الفقر إلى الوحدة.','Our societies today face major challenges, from poverty to loneliness.','Unsere Gesellschaften stehen heute vor großen Herausforderungen, von der Armut bis zur Einsamkeit.','Nuestras sociedades se enfrentan hoy a grandes retos, desde la pobreza hasta la soledad.','Nos sociétés font face aujourd’hui à de grands défis, de la pauvreté à la solitude.'],
  ['يعيش كثير من كبار السن وحدهم، ونادراً ما يزورهم أحد.','Many elderly people live alone and rarely have visitors.','Viele Senioren leben allein und bekommen selten Besuch.','Muchas personas mayores viven solas y casi nunca reciben visitas.','Beaucoup de personnes âgées vivent seules et reçoivent rarement de la visite.'],
  ['لهذا السبب أسّست مجموعة من الطلاب مشروعاً تطوّعياً في حيّنا.','That is why a group of students set up a volunteering project in our neighbourhood.','Deshalb hat eine Gruppe von Studierenden in unserem Viertel ein Projekt für das Ehrenamt gegründet.','Por eso un grupo de estudiantes creó un proyecto de voluntariado en nuestro barrio.','C’est pourquoi un groupe d’étudiants a créé un projet de bénévolat dans notre quartier.'],
  ['يزور الشباب كبار السن مرة في الأسبوع ويساعدونهم في التسوق واستخدام الهاتف.','The young people visit the elderly once a week and help them with shopping and using their phones.','Die jungen Leute besuchen die Senioren einmal pro Woche und helfen ihnen beim Einkaufen und mit dem Handy.','Los jóvenes visitan a las personas mayores una vez por semana y les ayudan a hacer la compra y a usar el móvil.','Les jeunes rendent visite aux personnes âgées une fois par semaine et les aident à faire les courses et à utiliser leur téléphone.'],
  ['يتعلّم الجيلان من بعضهما، ويشعر الجميع بوحدة أقل.','The two generations learn from each other, and everyone feels less lonely.','Beide Generationen lernen voneinander, und alle fühlen sich weniger einsam.','Las dos generaciones aprenden la una de la otra y todos se sienten menos solos.','Les deux générations apprennent l’une de l’autre et tout le monde se sent moins seul.'],
  ['يُظهر هذا المثال أن التضامن يبدأ بخطوات صغيرة في الحياة اليومية.','This example shows that solidarity begins with small steps in everyday life.','Dieses Beispiel zeigt, dass Solidarität mit kleinen Schritten im Alltag beginnt.','Este ejemplo demuestra que la solidaridad empieza con pequeños pasos en la vida diaria.','Cet exemple montre que la solidarité commence par de petits gestes au quotidien.']
],
b2u4: [
  ['في السنوات الأخيرة ارتفعت تكاليف المعيشة في كثير من البلدان بشكل واضح.','In recent years the cost of living has risen significantly in many countries.','In den letzten Jahren sind die Lebenshaltungskosten in vielen Ländern deutlich gestiegen.','En los últimos años el coste de la vida ha subido mucho en muchos países.','Ces dernières années, le coût de la vie a nettement augmenté dans de nombreux pays.'],
  ['بسبب التضخّم أصبح الطعام والطاقة والسكن أغلى بكثير.','Because of inflation, food, energy and housing have become much more expensive.','Wegen der Inflation sind Lebensmittel, Energie und Wohnen viel teurer geworden.','Debido a la inflación, la comida, la energía y la vivienda se han encarecido mucho.','À cause de l’inflation, la nourriture, l’énergie et le logement sont devenus beaucoup plus chers.'],
  ['لكن الدخل لم يرتفع بالسرعة نفسها، لذلك يجد كثيرون صعوبة في الادّخار.','But incomes have not risen at the same speed, so many people find it hard to save.','Das Einkommen ist aber nicht im gleichen Tempo gestiegen, deshalb fällt es vielen schwer zu sparen.','Pero los ingresos no han subido al mismo ritmo, así que a muchas personas les cuesta ahorrar.','Mais le revenu n’a pas augmenté au même rythme, donc beaucoup de gens ont du mal à épargner.'],
  ['ينصح الخبراء بوضع ميزانية شهرية وتجنّب القروض غير الضرورية.','Experts advise making a monthly budget and avoiding unnecessary loans.','Experten empfehlen, ein monatliches Budget zu planen und unnötige Kredite zu vermeiden.','Los expertos aconsejan hacer un presupuesto mensual y evitar préstamos innecesarios.','Les experts conseillent d’établir un budget mensuel et d’éviter les prêts inutiles.'],
  ['ويرى بعضهم أن الاستثمار على المدى الطويل أفضل من ترك المال في الحساب.','Some of them believe that long-term investing is better than leaving money in the account.','Einige meinen, dass es besser ist, langfristig zu investieren, als das Geld auf dem Konto zu lassen.','Algunos opinan que invertir a largo plazo es mejor que dejar el dinero en la cuenta.','Certains estiment qu’investir sur le long terme vaut mieux que de laisser l’argent sur un compte.'],
  ['على أي حال، فهم أساسيات الاقتصاد يساعدنا على اتخاذ قرارات أفضل.','In any case, understanding the basics of the economy helps us make better decisions.','Auf jeden Fall hilft es, die Grundlagen der Wirtschaft zu verstehen, um bessere Entscheidungen zu treffen.','En cualquier caso, entender los fundamentos de la economía nos ayuda a tomar mejores decisiones.','Dans tous les cas, comprendre les bases de l’économie nous aide à prendre de meilleures décisions.']
],
b2u5: [
  ['المشاركة في الحياة العامة لا تقتصر على التصويت في الانتخابات.','Taking part in public life is not limited to voting in elections.','Die Beteiligung am öffentlichen Leben beschränkt sich nicht auf das Wählen.','La participación en la vida pública no se limita a votar en las elecciones.','La participation à la vie publique ne se limite pas au vote.'],
  ['يمكن للمواطنين أن يلتزموا في جمعيات أو أن يتطوّعوا في مدينتهم.','Citizens can get involved in associations or volunteer in their town.','Bürgerinnen und Bürger können sich in einem Verein engagieren oder ehrenamtlich in ihrer Stadt helfen.','Los ciudadanos pueden comprometerse en una asociación o hacer voluntariado en su ciudad.','Les citoyens peuvent s’engager dans une association ou faire du bénévolat dans leur ville.'],
  ['في مدينتنا جمع السكان ألف توقيع على عريضة من أجل حديقة جديدة.','In our town, residents collected a thousand signatures on a petition for a new park.','In unserer Stadt haben die Einwohner tausend Unterschriften für eine Petition für einen neuen Park gesammelt.','En nuestra ciudad, los vecinos reunieron mil firmas en una petición para un parque nuevo.','Dans notre ville, les habitants ont recueilli mille signatures pour une pétition en faveur d’un nouveau parc.'],
  ['ناقش المجلس البلدي الاقتراح ووافق عليه بعد عدة أشهر.','The local council discussed the proposal and approved it after several months.','Der Gemeinderat hat den Vorschlag diskutiert und ihn nach einigen Monaten angenommen.','El ayuntamiento debatió la propuesta y la aprobó al cabo de varios meses.','Le conseil municipal a débattu de la proposition et l’a adoptée au bout de plusieurs mois.'],
  ['يُظهر هذا المثال أن صوت المواطنين يمكن أن يغيّر شيئاً حقيقياً.','This example shows that citizens’ voices can bring about real change.','Dieses Beispiel zeigt, dass die Stimme der Bürger wirklich etwas verändern kann.','Este ejemplo demuestra que la voz de los ciudadanos puede cambiar las cosas.','Cet exemple montre que la voix des citoyens peut faire bouger les choses.'],
  ['الديمقراطية تحتاج إلى مواطنين مطّلعين ومستعدّين للنقاش باحترام.','Democracy needs well-informed citizens who are ready to debate respectfully.','Die Demokratie braucht informierte Bürger, die bereit sind, respektvoll zu diskutieren.','La democracia necesita ciudadanos informados y dispuestos a debatir con respeto.','La démocratie a besoin de citoyens informés et prêts à débattre avec respect.']
],
b2u6: [
  ['قرأتُ مؤخراً رواية لكاتبة شابة تُرجمت إلى أكثر من عشرين لغة.','I recently read a novel by a young author that has been translated into more than twenty languages.','Ich habe vor Kurzem einen Roman einer jungen Autorin gelesen, der in mehr als zwanzig Sprachen übersetzt wurde.','Hace poco leí una novela de una autora joven que se ha traducido a más de veinte idiomas.','J’ai lu récemment le roman d’une jeune autrice qui a été traduit dans plus de vingt langues.'],
  ['تحكي القصة عن عائلة تهاجر من قرية صغيرة إلى مدينة كبيرة.','The story is about a family that moves from a small village to a big city.','Die Handlung erzählt von einer Familie, die aus einem kleinen Dorf in eine Großstadt zieht.','La historia trata de una familia que se muda de un pueblo pequeño a una gran ciudad.','Le roman raconte l’histoire d’une famille qui quitte un petit village pour une grande ville.'],
  ['الشخصيات حقيقية جداً، وأسلوب الكاتبة بسيط ومؤثّر في الوقت نفسه.','The characters are very real, and the author’s style is simple and moving at the same time.','Die Figuren wirken sehr echt, und der Stil der Autorin ist zugleich einfach und bewegend.','Los personajes son muy reales y el estilo de la autora es sencillo y conmovedor a la vez.','Les personnages sont très réalistes et le style de l’autrice est à la fois simple et émouvant.'],
  ['العام الماضي حوّل مخرج معروف الرواية إلى فيلم.','Last year a well-known director turned the novel into a film.','Letztes Jahr hat ein bekannter Regisseur den Roman verfilmt.','El año pasado un director conocido llevó la novela al cine.','L’année dernière, un réalisateur connu a adapté le roman au cinéma.'],
  ['برأيي الفيلم جيد، لكنه لا يصل إلى عمق الكتاب.','In my opinion the film is good, but it does not reach the depth of the book.','Meiner Meinung nach ist der Film gut, aber er erreicht nicht die Tiefe des Buches.','En mi opinión, la película es buena, pero no alcanza la profundidad del libro.','À mon avis, le film est bon, mais il n’atteint pas la profondeur du livre.'],
  ['خاصة النهاية، فهي في الكتاب أكثر غموضاً وإثارة للتفكير.','Especially the ending, which is more mysterious and thought-provoking in the book.','Vor allem das Ende ist im Buch geheimnisvoller und regt mehr zum Nachdenken an.','Sobre todo el final, que en el libro es más misterioso y da más que pensar.','Surtout la fin, qui est plus mystérieuse et donne davantage à réfléchir dans le livre.']
],
b2u7: [
  ['العولمة تعني أن البلدان أصبحت مترابطة اقتصادياً وثقافياً أكثر من أي وقت مضى.','Globalisation means that countries are more connected economically and culturally than ever before.','Globalisierung bedeutet, dass die Länder wirtschaftlich und kulturell so eng verbunden sind wie nie zuvor.','La globalización significa que los países están más conectados económica y culturalmente que nunca.','La mondialisation signifie que les pays sont plus liés que jamais sur le plan économique et culturel.'],
  ['الهاتف الذي في جيبك صُمّم في بلد وصُنع في بلد آخر.','The phone in your pocket was designed in one country and made in another.','Das Handy in deiner Tasche wurde in einem Land entwickelt und in einem anderen hergestellt.','El móvil que llevas en el bolsillo se diseñó en un país y se fabricó en otro.','Le téléphone dans ta poche a été conçu dans un pays et fabriqué dans un autre.'],
  ['هذا التبادل يخلق فرص عمل، لكنه يخلق أيضاً اعتماداً خطيراً على الإنتاج في الخارج.','This exchange creates jobs, but it also creates a dangerous dependence on production abroad.','Dieser Austausch schafft Arbeitsplätze, aber auch eine gefährliche Abhängigkeit von der Produktion im Ausland.','Este intercambio crea empleo, pero también una peligrosa dependencia de la producción en el extranjero.','Cet échange crée des emplois, mais aussi une dépendance dangereuse à la production à l’étranger.'],
  ['وفي الوقت نفسه يهاجر الملايين بحثاً عن عمل أو هرباً من الحرب.','At the same time, millions of people migrate in search of work or to flee war.','Gleichzeitig wandern Millionen Menschen aus, um Arbeit zu finden oder vor dem Krieg zu fliehen.','Al mismo tiempo, millones de personas emigran en busca de trabajo o para huir de la guerra.','En même temps, des millions de personnes migrent pour trouver du travail ou fuir la guerre.'],
  ['تصبح المدن الكبيرة بذلك أكثر تنوّعاً، وهذا يطرح أسئلة حول الهوية والاندماج.','Big cities are therefore becoming more diverse, which raises questions about identity and integration.','Die Großstädte werden dadurch vielfältiger, was Fragen nach der Identität und der Integration aufwirft.','Así, las grandes ciudades se vuelven más diversas, lo que plantea preguntas sobre la identidad y la integración.','Les grandes villes deviennent ainsi plus diverses, ce qui soulève des questions sur l’identité et l’intégration.'],
  ['التحدي هو الاستفادة من التنوّع دون أن نفقد التماسك الاجتماعي.','The challenge is to benefit from diversity without losing social cohesion.','Die Herausforderung besteht darin, von der Vielfalt zu profitieren, ohne den gesellschaftlichen Zusammenhalt zu verlieren.','El reto es aprovechar la diversidad sin perder la cohesión social.','Le défi est de tirer profit de la diversité sans perdre la cohésion sociale.']
],
b2u8: [
  ['يتساءل كثير من الخبراء هل تُعِدّ مدارسنا الطلاب فعلاً لعالم الغد.','Many experts wonder whether our schools really prepare students for the world of tomorrow.','Viele Experten fragen sich, ob unsere Schulen die Schüler wirklich auf die Welt von morgen vorbereiten.','Muchos expertos se preguntan si nuestras escuelas preparan realmente a los alumnos para el mundo de mañana.','Beaucoup d’experts se demandent si nos écoles préparent vraiment les élèves au monde de demain.'],
  ['في الماضي كان الطلاب يحفظون المعلومات عن ظهر قلب.','In the past, students learned information by heart.','Früher haben die Schüler Informationen auswendig gelernt.','Antes los alumnos aprendían la información de memoria.','Autrefois, les élèves apprenaient les informations par cœur.'],
  ['أما اليوم فالتفكير النقدي والمهارات الرقمية والعمل الجماعي أكثر أهمية.','Today, however, critical thinking, digital skills and teamwork are more important.','Heute sind dagegen das kritische Denken, die digitalen Kompetenzen und die Teamarbeit wichtiger.','Hoy, en cambio, el pensamiento crítico, las competencias digitales y el trabajo en equipo son más importantes.','Aujourd’hui, en revanche, l’esprit critique, les compétences numériques et le travail en équipe sont plus importants.'],
  ['كما أن تكافؤ الفرص ما زال مشكلة، لأن النجاح الدراسي يعتمد كثيراً على دخل الأسرة.','Equal opportunities are also still a problem, because success at school depends a lot on family income.','Auch die Chancengleichheit ist noch ein Problem, denn der Schulerfolg hängt stark vom Einkommen der Familie ab.','Además, la igualdad de oportunidades sigue siendo un problema, porque el éxito escolar depende mucho de los ingresos familiares.','L’égalité des chances reste aussi un problème, car la réussite scolaire dépend beaucoup des revenus de la famille.'],
  ['لذلك تقدّم بعض الجامعات منحاً للطلاب الموهوبين من أسر فقيرة.','That is why some universities offer scholarships to talented students from poor families.','Deshalb vergeben einige Universitäten ein Stipendium an begabte Studierende aus armen Familien.','Por eso algunas universidades ofrecen una beca a estudiantes con talento de familias pobres.','C’est pourquoi certaines universités proposent une bourse aux étudiants talentueux issus de familles modestes.'],
  ['في النهاية، أفضل نظام تعليمي هو الذي يحفّز الطلاب على التعلّم مدى الحياة.','In the end, the best education system is the one that motivates students to keep learning all their lives.','Letztlich ist das beste Bildungssystem dasjenige, das die Schüler zum lebenslangen Lernen motiviert.','Al fin y al cabo, el mejor sistema educativo es el que motiva a los alumnos a aprender durante toda la vida.','Finalement, le meilleur système éducatif est celui qui donne envie d’apprendre tout au long de la vie.']
],
b2u9: [
  ['نظام الرعاية الصحية في كثير من البلدان يعاني من نقص في الأطباء والممرّضين.','In many countries the healthcare system suffers from a shortage of doctors and nurses.','In vielen Ländern leidet das Gesundheitswesen unter einem Mangel an Ärzten und Pflegekräften.','En muchos países la sanidad sufre una falta de médicos y enfermeros.','Dans de nombreux pays, le système de santé souffre d’un manque de médecins et d’infirmiers.'],
  ['ينتظر المرضى أحياناً أشهراً للحصول على موعد عند طبيب مختص.','Patients sometimes wait months for an appointment with a specialist.','Patienten warten manchmal monatelang auf einen Termin beim Facharzt.','Los pacientes esperan a veces meses para conseguir cita con un especialista.','Les patients attendent parfois des mois pour obtenir un rendez-vous chez un spécialiste.'],
  ['الطب عن بُعد قد يكون جزءاً من الحل، خاصة للأمراض المزمنة.','Telemedicine could be part of the solution, especially for chronic illnesses.','Die Telemedizin könnte ein Teil der Lösung sein, vor allem bei chronischen Krankheiten.','La telemedicina podría ser parte de la solución, sobre todo para las enfermedades crónicas.','La télémédecine pourrait être une partie de la solution, surtout pour les maladies chroniques.'],
  ['يستطيع الطبيب أن يتابع الأعراض عبر الفيديو ويعدّل العلاج دون أن يأتي المريض إلى العيادة.','The doctor can follow the symptoms by video and adjust the treatment without the patient coming to the practice.','Der Arzt kann die Symptome per Video verfolgen und die Behandlung anpassen, ohne dass der Patient in die Praxis kommen muss.','El médico puede seguir los síntomas por vídeo y ajustar el tratamiento sin que el paciente vaya a la consulta.','Le médecin peut suivre les symptômes par vidéo et adapter le traitement sans que le patient se déplace au cabinet.'],
  ['ومع ذلك يبقى الفحص المباشر ضرورياً لتشخيص كثير من الأمراض.','Nevertheless, a face-to-face examination remains necessary to diagnose many illnesses.','Trotzdem bleibt eine persönliche Untersuchung notwendig, um viele Krankheiten zu diagnostizieren.','Aun así, la consulta presencial sigue siendo necesaria para diagnosticar muchas enfermedades.','Pourtant, un examen en personne reste nécessaire pour diagnostiquer de nombreuses maladies.'],
  ['ويؤكّد الخبراء أن الوقاية، مثل اللقاحات ونمط الحياة الصحي، أرخص من العلاج.','Experts stress that prevention, such as vaccines and a healthy lifestyle, is cheaper than treatment.','Experten betonen, dass die Vorbeugung, etwa durch Impfungen und einen gesunden Lebensstil, günstiger ist als die Behandlung.','Los expertos subrayan que la prevención, como las vacunas y un estilo de vida sano, es más barata que el tratamiento.','Les experts soulignent que la prévention, comme les vaccins et un mode de vie sain, coûte moins cher que le traitement.']
],
b2u10: [
  ['السيدات والسادة المحترمون،','Dear Sir or Madam,','Sehr geehrte Damen und Herren,','Estimados señores:','Madame, Monsieur,'],
  ['أكتب إليكم بخصوص قرار إغلاق المكتبة العامة في حيّنا.','I am writing to you regarding the decision to close the public library in our neighbourhood.','ich schreibe Ihnen wegen der Entscheidung, die öffentliche Bibliothek in unserem Viertel zu schließen.','Les escribo en relación con la decisión de cerrar la biblioteca pública de nuestro barrio.','Je vous écris au sujet de la décision de fermer la bibliothèque municipale de notre quartier.'],

  ['وكثيراً ما ينشأ سوء الفهم عندما تكون الرسالة ضمنية لا مباشرة.','A misunderstanding often arises when the message is implicit rather than direct.','Ein Missverständnis entsteht oft, wenn die Botschaft implizit statt direkt ist.','Un malentendido surge a menudo cuando el mensaje es implícito y no directo.','Un malentendu naît souvent quand le message est implicite plutôt que direct.'],
  ['لذلك تعني الكفاءة اللغوية الحقيقية أن نفهم ما يُقال وما لا يُقال.','True language proficiency therefore means understanding both what is said and what is left unsaid.','Echte Sprachkompetenz bedeutet daher, zu verstehen, was gesagt wird und was ungesagt bleibt.','Por eso, la verdadera competencia lingüística consiste en entender lo que se dice y lo que se calla.','La vraie compétence linguistique consiste donc à comprendre ce qui est dit et ce qui ne l’est pas.']

  ['وفي كل الأحوال يبقى الضمير بوصلتنا الداخلية.','In any case, our conscience remains our inner compass.','In jedem Fall bleibt das Gewissen unser innerer Kompass.','En cualquier caso, la conciencia sigue siendo nuestra brújula interior.','Quoi qu’il en soit, la conscience reste notre boussole intérieure.'],
  ['وتحمُّل المسؤولية عن قراراتنا علامة على النزاهة.','Taking responsibility for our decisions is a sign of integrity.','Verantwortung für die eigenen Entscheidungen zu übernehmen, ist ein Zeichen von Integrität.','Asumir la responsabilidad de nuestras decisiones es una señal de integridad.','Assumer la responsabilité de ses décisions est un signe d’intégrité.']

c1u4: [
  ['الاستدامة تعني أن نلبّي احتياجاتنا دون أن نعرّض الأجيال القادمة للخطر.','Sustainability means meeting our needs without putting future generations at risk.','Nachhaltigkeit bedeutet, unsere Bedürfnisse zu erfüllen, ohne künftige Generationen zu gefährden.','La sostenibilidad consiste en satisfacer nuestras necesidades sin poner en peligro a las generaciones futuras.','La durabilité consiste à répondre à nos besoins sans mettre en danger les générations futures.'],

c1u5: [
  ['في عالم الأعمال اليوم، لم يعد الربح وحده مقياس النجاح.','In today’s business world, profit alone is no longer the measure of success.','In der heutigen Geschäftswelt ist der Gewinn allein nicht mehr der Maßstab für Erfolg.','En el mundo empresarial actual, el beneficio ya no es la única medida del éxito.','Dans le monde des affaires d’aujourd’hui, le bénéfice n’est plus la seule mesure du succès.'],
  ['تحتاج الشركات إلى استراتيجية واضحة وقدرة دائمة على الابتكار.','Companies need a clear strategy and a constant capacity for innovation.','Unternehmen brauchen eine klare Strategie und eine ständige Fähigkeit zur Innovation.','Las empresas necesitan una estrategia clara y una capacidad constante de innovación.','Les entreprises ont besoin d’une stratégie claire et d’une capacité permanente d’innovation.'],
  ['فالمنافسة شديدة، وقد تخسر شركة كبيرة حصتها السوقية خلال أشهر.','Competition is fierce, and a large company can lose its market share within months.','Der Wettbewerb ist hart, und ein großes Unternehmen kann seinen Marktanteil innerhalb weniger Monate verlieren.','La competencia es feroz y una gran empresa puede perder su cuota de mercado en pocos meses.','La concurrence est rude, et une grande entreprise peut perdre sa part de marché en quelques mois.'],
  ['لذلك تراهن الشركات الناشئة على المرونة والسرعة.','That is why start-ups bet on flexibility and speed.','Deshalb setzen Start-ups auf Flexibilität und Schnelligkeit.','Por eso, las empresas emergentes apuestan por la flexibilidad y la rapidez.','C’est pourquoi les start-up misent sur la flexibilité et la rapidité.'],
  ['والقيادة الجيدة تعني أيضاً أن يعرف المدير متى يفوّض المهام.','Good leadership also means knowing when to delegate tasks.','Gute Führung bedeutet auch zu wissen, wann man Aufgaben delegieren sollte.','Un buen liderazgo también implica saber cuándo delegar tareas.','Un bon leadership consiste aussi à savoir quand déléguer des tâches.'],
  ['فالفريق الذي يحظى بالثقة يعمل بكفاءة أكبر.','A team that is trusted works with greater efficiency.','Ein Team, dem man vertraut, arbeitet mit größerer Effizienz.','Un equipo que goza de confianza trabaja con mayor eficiencia.','Une équipe à qui l’on fait confiance travaille avec plus d’efficacité.']
],
c1u6: [
  ['يتّخذ الإنسان كثيراً من قراراته دون أن يفكّر فيها بوعي.','People make many of their decisions without thinking about them consciously.','Der Mensch trifft viele Entscheidungen, ohne bewusst darüber nachzudenken.','Las personas toman muchas decisiones sin pensarlas de forma consciente.','L’être humain prend beaucoup de décisions sans y réfléchir consciemment.'],
  ['فالعادات والعواطف تؤثّر في سلوكنا أكثر مما نعتقد.','Habits and emotions influence our behaviour more than we think.','Gewohnheiten und Emotionen beeinflussen unser Verhalten stärker, als wir glauben.','Los hábitos y las emociones influyen en nuestra conducta más de lo que creemos.','Les habitudes et les émotions influencent notre comportement plus que nous ne le croyons.'],
  ['ويُظهر علم النفس أن إدراكنا للواقع كثيراً ما يكون مشوَّهاً.','Psychology shows that our perception of reality is often distorted.','Die Psychologie zeigt, dass unsere Wahrnehmung der Wirklichkeit oft verzerrt ist.','La psicología demuestra que nuestra percepción de la realidad a menudo está distorsionada.','La psychologie montre que notre perception de la réalité est souvent déformée.'],
  ['فنحن نصدّق بسهولة المعلومات التي تؤكّد آراءنا.','We readily believe information that confirms our opinions.','Wir glauben bereitwillig Informationen, die unsere Meinung bestätigen.','Creemos con facilidad la información que confirma nuestras opiniones.','Nous croyons facilement les informations qui confirment nos opinions.'],
  ['والمكافأة السريعة تحفّز الدماغ أكثر من الهدف البعيد.','A quick reward motivates the brain more than a distant goal.','Eine schnelle Belohnung motiviert das Gehirn stärker als ein fernes Ziel.','Una recompensa rápida motiva al cerebro más que un objetivo lejano.','Une récompense rapide motive davantage le cerveau qu’un objectif lointain.'],
  ['لكن المرونة النفسية والثقة بالنفس يمكن تدريبهما مثل أي عضلة.','But resilience and self-confidence can be trained like any muscle.','Doch Resilienz und Selbstvertrauen lassen sich wie ein Muskel trainieren.','Pero la resiliencia y la confianza en uno mismo se pueden entrenar como un músculo.','Mais la résilience et la confiance en soi peuvent s’entraîner comme un muscle.']
],
c1u7: [
  ['في دولة القانون، كل شخص بريء حتى تثبت إدانته.','Under the rule of law, everyone is innocent until proven guilty.','Im Rechtsstaat gilt jeder als unschuldig, bis seine Schuld bewiesen ist.','En un Estado de derecho, toda persona es inocente hasta que se demuestre lo contrario.','Dans un État de droit, toute personne est innocente jusqu’à preuve du contraire.'],
  ['ويحقّ للمتّهم أن يدافع عن نفسه بمساعدة محامٍ.','The accused has the right to defend themselves with the help of a lawyer.','Der Angeklagte hat das Recht, sich mit Hilfe eines Anwalts zu verteidigen.','El acusado tiene derecho a defenderse con la ayuda de un abogado.','L’accusé a le droit de se défendre avec l’aide d’un avocat.'],
  ['يستمع القاضي إلى الشهود ويفحص الأدلة بعناية.','The judge listens to the witnesses and examines the evidence carefully.','Der Richter hört die Zeugen an und prüft die Beweise sorgfältig.','El juez escucha a los testigos y examina las pruebas con atención.','Le juge écoute les témoins et examine attentivement les preuves.'],
  ['ولا يجوز أن يصدر الحكم إلا على أساس أدلة واضحة.','A verdict may only be reached on the basis of clear evidence.','Ein Urteil darf nur auf der Grundlage eindeutiger Beweise gefällt werden.','Una sentencia solo puede dictarse sobre la base de pruebas claras.','Un verdict ne peut être rendu que sur la base de preuves claires.'],
  ['وإذا شعر أحد الطرفين بالظلم، يمكنه أن يقدّم استئنافاً.','If either party feels unfairly treated, it can lodge an appeal.','Fühlt sich eine Partei ungerecht behandelt, kann sie Berufung einlegen.','Si una de las partes se siente perjudicada, puede presentar una apelación.','Si l’une des parties se sent lésée, elle peut faire appel.'],
  ['فالعدالة لا تعني العقوبة فقط، بل حماية الحقوق أيضاً.','Justice does not only mean punishment, but also the protection of rights.','Gerechtigkeit bedeutet nicht nur Strafe, sondern auch den Schutz der Rechte.','La justicia no significa solo castigo, sino también protección de los derechos.','La justice ne signifie pas seulement la peine, mais aussi la protection des droits.']
],
c1u8: [
  ['لا يقتصر التاريخ على التواريخ والمعارك، بل يشمل حياة الناس العاديين أيضاً.','History is not limited to dates and battles; it also includes the lives of ordinary people.','Geschichte beschränkt sich nicht auf Jahreszahlen und Schlachten, sondern umfasst auch das Leben gewöhnlicher Menschen.','La historia no se limita a fechas y batallas, sino que también abarca la vida de la gente corriente.','L’histoire ne se limite pas aux dates et aux batailles, elle englobe aussi la vie des gens ordinaires.'],
  ['يدرس المؤرّخون الوثائق في الأرشيف لفهم الماضي بشكل أفضل.','Historians study documents in archives to understand the past better.','Historiker untersuchen Dokumente im Archiv, um die Vergangenheit besser zu verstehen.','Los historiadores estudian documentos en el archivo para comprender mejor el pasado.','Les historiens étudient les archives pour mieux comprendre le passé.'],
  ['لكن الذاكرة الجماعية لا تتطابق دائماً مع الحقائق التاريخية.','But collective memory does not always match the historical facts.','Doch das kollektive Gedächtnis stimmt nicht immer mit den historischen Fakten überein.','Pero la memoria colectiva no siempre coincide con los hechos históricos.','Mais la mémoire collective ne correspond pas toujours aux faits historiques.'],
  ['فكل شعب يروي قصة استقلاله أو ثورته من وجهة نظره.','Every nation tells the story of its independence or revolution from its own point of view.','Jedes Volk erzählt die Geschichte seiner Unabhängigkeit oder seiner Revolution aus der eigenen Sicht.','Cada pueblo cuenta la historia de su independencia o de su revolución desde su propio punto de vista.','Chaque peuple raconte l’histoire de son indépendance ou de sa révolution de son propre point de vue.'],
  ['ولهذا تثير بعض النُّصُب التذكارية اليوم جدلاً حادّاً.','That is why some monuments spark heated debate today.','Deshalb lösen manche Denkmäler heute heftige Debatten aus.','Por eso algunos monumentos provocan hoy un intenso debate.','C’est pourquoi certains monuments suscitent aujourd’hui de vifs débats.'],
  ['فأن نُحيي ذكرى الماضي يعني أن نتعلّم منه، لا أن نجمّله.','Commemorating the past means learning from it, not glossing over it.','Der Vergangenheit zu gedenken bedeutet, aus ihr zu lernen, nicht sie zu beschönigen.','Conmemorar el pasado significa aprender de él, no embellecerlo.','Commémorer le passé, c’est en tirer des leçons, et non l’embellir.']
],
c1u9: [
  ['أصبح الإنترنت جزءاً لا يتجزّأ من حياتنا اليومية.','The internet has become an integral part of our daily lives.','Das Internet ist zu einem festen Bestandteil unseres Alltags geworden.','Internet se ha convertido en una parte esencial de nuestra vida diaria.','Internet est devenu une partie intégrante de notre quotidien.'],
  ['تعرض علينا المنصّات ما يوافق آراءنا، فنعيش داخل فقاعة ترشيح.','Platforms show us what matches our opinions, so we live inside a filter bubble.','Plattformen zeigen uns, was zu unseren Meinungen passt, und so leben wir in einer Filterblase.','Las plataformas nos muestran lo que coincide con nuestras opiniones, y así vivimos dentro de una burbuja de filtros.','Les plateformes nous montrent ce qui correspond à nos opinions, et nous vivons ainsi dans une bulle de filtres.'],
  ['وهذا يسهّل انتشار التضليل الإعلامي والتلاعب بالرأي العام.','This makes it easier to spread disinformation and to manipulate public opinion.','Das erleichtert die Verbreitung von Desinformation und macht es leichter, die öffentliche Meinung zu manipulieren.','Esto facilita la difusión de la desinformación y permite manipular más fácilmente la opinión pública.','Cela favorise la diffusion de la désinformation et permet de manipuler plus facilement l’opinion publique.'],
  ['وفي الوقت نفسه تجمع الشركات كميات هائلة من بياناتنا الشخصية.','At the same time, companies collect vast amounts of our personal data.','Gleichzeitig sammeln Unternehmen riesige Mengen unserer persönlichen Daten.','Al mismo tiempo, las empresas recopilan enormes cantidades de nuestros datos personales.','En même temps, les entreprises collectent d’énormes quantités de nos données personnelles.'],
  ['لذلك أصبح الأمن السيبراني والتشفير ضرورة لا رفاهية.','That is why cybersecurity and encryption have become a necessity, not a luxury.','Deshalb sind Cybersicherheit und Verschlüsselung zu einer Notwendigkeit geworden, nicht zu einem Luxus.','Por eso la ciberseguridad y el cifrado se han convertido en una necesidad, no en un lujo.','C’est pourquoi la cybersécurité et le chiffrement sont devenus une nécessité, et non un luxe.'],
  ['ويبقى التحدّي الأكبر هو سدّ الفجوة الرقمية بين الأجيال والطبقات الاجتماعية.','The biggest challenge remains closing the digital divide between generations and social classes.','Die größte Herausforderung bleibt, die digitale Kluft zwischen Generationen und sozialen Schichten zu schließen.','El mayor reto sigue siendo cerrar la brecha digital entre generaciones y clases sociales.','Le plus grand défi reste de réduire la fracture numérique entre les générations et les classes sociales.']
],
c1u10: [
  ['العرض الجيد لا يعتمد على الشرائح، بل على ما يقوله المتحدّث.','A good talk depends not on the slides but on what the speaker says.','Ein guter Vortrag hängt nicht von den Folien ab, sondern davon, was der Redner sagt.','Una buena ponencia no depende de las diapositivas, sino de lo que dice el ponente.','Un bon exposé ne dépend pas des diapositives, mais de ce que dit l’orateur.'],
  ['يشعر كثيرون برهبة المسرح قبل أن يتكلّموا أمام الجمهور.','Many people suffer from stage fright before speaking in front of an audience.','Viele Menschen haben Lampenfieber, bevor sie vor Publikum sprechen.','Muchas personas sienten miedo escénico antes de hablar ante el público.','Beaucoup de gens ont le trac avant de parler devant un public.'],
  ['والحلّ هو التحضير الجيد وبنية واضحة: مقدّمة وعرض وخاتمة.','The solution is good preparation and a clear structure: introduction, main part and conclusion.','Die Lösung ist eine gute Vorbereitung und eine klare Struktur: Einleitung, Hauptteil und Schluss.','La solución es una buena preparación y una estructura clara: introducción, desarrollo y conclusión.','La solution passe par une bonne préparation et un plan clair, avec une introduction, un développement et une conclusion.'],
  ['في المناظرة يجب أن نعرض موقفنا بوضوح وأن نتوقّع الحجج المضادّة.','In a debate we must present our position clearly and anticipate counter-arguments.','In einer Debatte muss man seine Position klar darlegen und Gegenargumente vorhersehen.','En un debate hay que exponer la propia postura con claridad y anticipar los contraargumentos.','Dans un débat, il faut présenter sa position clairement et anticiper les contre-arguments.'],
  ['فالمتحدّث المقنع لا يكتفي بإبداء رأيه، بل يدحض حجج الطرف الآخر بالأدلة.','A convincing speaker does not just give an opinion but refutes the other side’s arguments with evidence.','Ein überzeugender Redner äußert nicht nur seine Meinung, sondern widerlegt die Argumente der Gegenseite mit Belegen.','Un orador convincente no se limita a opinar, sino que refuta los argumentos del otro con pruebas.','Un orateur convaincant ne se contente pas de donner son avis, il réfute les arguments adverses avec des preuves.'],
  ['وفي النهاية يلخّص مدير النقاش أهمّ النقاط.','At the end, the moderator sums up the main points.','Am Ende fasst der Moderator die wichtigsten Punkte zusammen.','Al final, el moderador resume los puntos principales.','À la fin, le modérateur résume les points essentiels.']
]
});

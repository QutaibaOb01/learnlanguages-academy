c2u1: [
  ['لا يمكن ترجمة التعابير الاصطلاحية حرفياً، لأن معناها لا يُستنتج من كلماتها.','Idioms cannot be translated literally, because their meaning cannot be deduced from their words.','Redewendungen lassen sich nicht wörtlich übersetzen, weil sich ihre Bedeutung nicht aus den einzelnen Wörtern ergibt.','Los modismos no pueden traducirse literalmente, porque su significado no se deduce de sus palabras.','Les expressions idiomatiques ne peuvent pas être traduites littéralement, car leur sens ne se déduit pas des mots qui les composent.'],
  ['في أول يوم عمل، حاولتُ أن أكسر الجليد بنكتة صغيرة.','On my first day at work, I tried to break the ice with a little joke.','An meinem ersten Arbeitstag versuchte ich, mit einem kleinen Witz das Eis zu brechen.','En mi primer día de trabajo, intenté romper el hielo con un pequeño chiste.','Le premier jour de travail, j’ai essayé de briser la glace avec une petite blague.'],
  ['لكن زميلي لم يفهم أنها كانت ساخرة، فأخذها على محمل الجدّ.','But my colleague did not realise it was ironic and took it seriously.','Aber mein Kollege verstand nicht, dass er ironisch gemeint war, und nahm ihn ernst.','Pero mi compañero no se dio cuenta de que era irónico y se lo tomó en serio.','Mais mon collègue n’a pas compris qu’elle était ironique et l’a prise au sérieux.'],
  ['يُظهر هذا الموقف أن لكل كلمة دلالة إيحائية تتجاوز معناها في القاموس.','This situation shows that every word carries a connotation that goes beyond its dictionary meaning.','Diese Situation zeigt, dass jedes Wort eine Konnotation hat, die über seine Bedeutung im Wörterbuch hinausgeht.','Esta situación demuestra que cada palabra tiene una connotación que va más allá de su significado en el diccionario.','Cette situation montre que chaque mot porte une connotation qui dépasse son sens dans le dictionnaire.'],
  ['إتقان لغة ما يعني إدراك كل فارق دقيق في المعنى والنبرة.','Mastering a language means noticing every nuance of meaning and tone.','Eine Sprache zu beherrschen bedeutet, jede Nuance in Bedeutung und Ton wahrzunehmen.','Dominar un idioma significa percibir cada matiz de significado y de tono.','Maîtriser une langue, c’est percevoir la moindre nuance de sens et de ton.'],
  ['عندها يصبح فهم النكتة أسهل من شربة الماء.','Then understanding a joke becomes a piece of cake.','Dann ist es ein Kinderspiel, einen Witz zu verstehen.','Entonces, entender un chiste es pan comido.','Alors, comprendre une blague, c’est du gâteau.']
],
c2u2: [
  ['يتميّز الأدب الجيد بأسلوب لا يشبه غيره.','Good literature is distinguished by a style unlike any other.','Gute Literatur zeichnet sich durch einen unverwechselbaren Stil aus.','La buena literatura se distingue por un estilo inconfundible.','La bonne littérature se distingue par un style inimitable.'],
  ['في هذه الرواية، يروي الراوي الأحداث بعد ثلاثين عاماً من وقوعها.','In this novel, the narrator recounts the events thirty years after they happened.','In diesem Roman erzählt der Erzähler die Ereignisse dreißig Jahre, nachdem sie geschehen sind.','En esta novela, el narrador cuenta los hechos treinta años después de que ocurrieran.','Dans ce roman, le narrateur raconte les événements trente ans après les faits.'],
  ['ولذلك يغلب على السرد شعور عميق بالحنين.','That is why the narrative is dominated by a deep sense of nostalgia.','Deshalb ist die Erzählung von einer tiefen Nostalgie geprägt.','Por eso la narración está impregnada de una profunda nostalgia.','C’est pourquoi le récit est empreint d’une profonde nostalgie.'],
  ['تستحضر الكاتبة رائحة البحر وأصوات السوق بجمل قصيرة ذات إيقاع موسيقي.','The author evokes the smell of the sea and the sounds of the market in short sentences with a musical rhythm.','Die Autorin beschwört den Geruch des Meeres und die Geräusche des Marktes in kurzen Sätzen mit musikalischem Rhythmus herauf.','La autora evoca el olor del mar y los sonidos del mercado con frases cortas de ritmo musical.','L’autrice évoque l’odeur de la mer et les bruits du marché par des phrases courtes au rythme musical.'],
  ['فالبحر في النص ليس مكاناً فقط، بل رمز للحرية.','In the text, the sea is not just a place but a symbol of freedom.','Das Meer ist im Text nicht nur ein Ort, sondern ein Symbol der Freiheit.','En el texto, el mar no es solo un lugar, sino un símbolo de la libertad.','Dans le texte, la mer n’est pas seulement un lieu, mais un symbole de liberté.'],
  ['وبهذا تمحو الكاتبة الحدود بين النثر والشعر.','In this way, the author blurs the line between prose and poetry.','So verwischt die Autorin die Grenze zwischen Prosa und Lyrik.','Así, la autora difumina la frontera entre la prosa y la poesía.','L’autrice efface ainsi la frontière entre la prose et la poésie.']
],
c2u3: [
  ['منذ آلاف السنين يتساءل الفلاسفة عن معنى الوجود.','For thousands of years, philosophers have wondered about the meaning of existence.','Seit Jahrtausenden fragen sich Philosophen nach dem Sinn der Existenz.','Desde hace miles de años, los filósofos se preguntan por el sentido de la existencia.','Depuis des millénaires, les philosophes s’interrogent sur le sens de l’existence.'],
  ['والسؤال الكبير: هل نملك إرادة حرّة، أم أن كل أفعالنا محدّدة مسبقاً؟','The great question is whether we have free will or whether all our actions are determined in advance.','Die große Frage ist, ob wir einen freien Willen haben oder ob alle unsere Handlungen vorherbestimmt sind.','La gran pregunta es si tenemos libre albedrío o si todas nuestras acciones están determinadas de antemano.','La grande question est de savoir si nous avons un libre arbitre ou si toutes nos actions sont déterminées à l’avance.'],
  ['يرى أنصار الحتمية أن الحرية مجرّد وهم.','Supporters of determinism see freedom as a mere illusion.','Anhänger des Determinismus halten die Freiheit für eine bloße Illusion.','Los defensores del determinismo consideran que la libertad es una mera ilusión.','Les partisans du déterminisme considèrent la liberté comme une simple illusion.'],
  ['أما ديكارت فجعل الشكّ طريقاً إلى المعرفة اليقينية.','Descartes, by contrast, made doubt a path to certain knowledge.','Descartes hingegen machte den Zweifel zum Weg zu sicherer Erkenntnis.','Descartes, en cambio, hizo de la duda un camino hacia el conocimiento seguro.','Descartes, en revanche, a fait du doute un chemin vers la connaissance certaine.'],
  ['ويرى بعض المفكرين المعاصرين أن الحقيقة نسبية دائماً.','Some contemporary thinkers argue that truth is always relative.','Einige zeitgenössische Denker meinen, die Wahrheit sei immer relativ.','Algunos pensadores contemporáneos sostienen que la verdad es siempre relativa.','Certains penseurs contemporains affirment que la vérité est toujours relative.'],
  ['لكن إذا لم يكن هناك شيء مطلق، يصعب الدفاع عن أي مفهوم للعدالة.','But if nothing is absolute, it becomes difficult to defend any concept of justice.','Doch wenn nichts absolut ist, wird es schwierig, irgendeinen Begriff von Gerechtigkeit zu verteidigen.','Pero si nada es absoluto, resulta difícil defender cualquier concepto de justicia.','Mais si rien n’est absolu, il devient difficile de défendre un quelconque concept de justice.']
],
c2u4: [
  ['عرّف أرسطو البلاغة بأنها القدرة على اكتشاف وسائل الإقناع في كل موقف.','Aristotle defined rhetoric as the ability to discover the means of persuasion in every situation.','Aristoteles definierte die Rhetorik als die Fähigkeit, in jeder Situation die Mittel der Überzeugung zu erkennen.','Aristóteles definió la retórica como la capacidad de descubrir los medios de persuasión en cada situación.','Aristote définissait la rhétorique comme la capacité de découvrir les moyens de persuasion dans chaque situation.'],
  ['ويعتمد الخطيب الناجح على المصداقية والمنطق ومخاطبة العواطف.','A successful orator relies on credibility, logic and appeals to emotion.','Ein erfolgreicher Redner setzt auf Glaubwürdigkeit, Logik und den Appell an die Gefühle.','Un orador eficaz se apoya en la credibilidad, la lógica y la apelación a las emociones.','Un bon orateur s’appuie sur la crédibilité, la logique et l’appel aux émotions.'],
  ['التكرار والسؤال البلاغي من أكثر الأدوات تأثيراً في الخطابات السياسية.','Repetition and rhetorical questions are among the most effective devices in political speeches.','Wiederholung und rhetorische Fragen gehören zu den wirkungsvollsten Mitteln politischer Reden.','La repetición y la pregunta retórica son de los recursos más eficaces en los discursos políticos.','La répétition et la question rhétorique comptent parmi les procédés les plus efficaces des discours politiques.'],
  ['لكن الحدّ الفاصل بين الإقناع والتلاعب رفيع جداً.','But the line between persuasion and manipulation is very thin.','Doch die Grenze zwischen Überzeugung und Manipulation ist sehr schmal.','Pero la frontera entre la persuasión y la manipulación es muy delgada.','Mais la frontière entre persuasion et manipulation est très mince.'],
  ['فالدعاية تستخدم الشعارات البسيطة والمبالغة لإخفاء ضعف الحجج.','Propaganda uses simple slogans and exaggeration to hide the weakness of its arguments.','Propaganda nutzt einfache Slogans und Übertreibung, um die Schwäche ihrer Argumente zu verbergen.','La propaganda utiliza eslóganes simples y la exageración para ocultar la debilidad de sus argumentos.','La propagande utilise des slogans simples et l’exagération pour masquer la faiblesse de ses arguments.'],
  ['لذلك يجب أن نتعلّم كشف المغالطات قبل أن نقتنع.','That is why we must learn to spot fallacies before we let ourselves be convinced.','Deshalb müssen wir lernen, Fehlschlüsse zu erkennen, bevor wir uns überzeugen lassen.','Por eso debemos aprender a detectar las falacias antes de dejarnos convencer.','C’est pourquoi nous devons apprendre à repérer les sophismes avant de nous laisser convaincre.']
],
c2u5: [
  ['ليس كل ارتباط بين ظاهرتين دليلاً على علاقة سببية.','Not every correlation between two phenomena is evidence of causality.','Nicht jede Korrelation zwischen zwei Phänomenen ist ein Beleg für Kausalität.','No toda correlación entre dos fenómenos es una prueba de causalidad.','Toute corrélation entre deux phénomènes n’est pas une preuve de causalité.'],
  ['لهذا يقارن الباحثون في التجربة السريرية بين مجموعة تتلقّى الدواء ومجموعة ضابطة تتلقّى دواءً وهمياً.','That is why, in a clinical trial, researchers compare a group that receives the drug with a control group that receives a placebo.','Deshalb vergleichen Forscher in einer klinischen Studie eine Gruppe, die das Medikament erhält, mit einer Kontrollgruppe, die ein Placebo bekommt.','Por eso, en un ensayo clínico, los investigadores comparan un grupo que recibe el fármaco con un grupo de control que recibe un placebo.','C’est pourquoi, dans un essai clinique, les chercheurs comparent un groupe qui reçoit le médicament à un groupe témoin qui reçoit un placebo.'],
  ['ولا تُعدّ النتيجة دالّة إحصائياً إلا إذا كان احتمال الصدفة ضئيلاً.','A result is only considered statistically significant if the probability of chance is small.','Ein Ergebnis gilt nur dann als statistisch signifikant, wenn die Wahrscheinlichkeit eines Zufalls gering ist.','Un resultado solo se considera estadísticamente significativo si la probabilidad de azar es pequeña.','Un résultat n’est considéré comme statistiquement significatif que si la probabilité du hasard est faible.'],
  ['ويجب أن تكون التجربة قابلة للتكرار في مختبرات أخرى.','The experiment must also be reproducible in other laboratories.','Außerdem muss das Experiment in anderen Laboren reproduzierbar sein.','Además, el experimento debe ser reproducible en otros laboratorios.','De plus, l’expérience doit être reproductible dans d’autres laboratoires.'],
  ['ولا تُنشر الدراسة في مجلة علمية إلا بعد مراجعة الأقران.','Only after peer review is the study published in a scientific journal.','Erst nach dem Peer-Review wird die Studie in einer Fachzeitschrift veröffentlicht.','Solo después de la revisión por pares se publica el estudio en una revista científica.','Ce n’est qu’après l’évaluation par les pairs que l’étude est publiée dans une revue scientifique.'],
  ['هكذا يتشكّل الإجماع العلمي ببطء، لكن على أسس متينة.','This is how scientific consensus forms: slowly, but on solid foundations.','So entsteht der wissenschaftliche Konsens langsam, aber auf einem soliden Fundament.','Así se forma el consenso científico: despacio, pero sobre bases sólidas.','C’est ainsi que se forme le consensus scientifique, lentement, mais sur des bases solides.']
],
c2u6: [
  ['في عصر الأخبار العاجلة، كثيراً ما تتغلّب الإثارة على الموضوعية.','In the age of breaking news, sensationalism often wins over objectivity.','Im Zeitalter der Eilmeldungen siegt die Sensationsgier oft über die Objektivität.','En la era de las noticias de última hora, el sensacionalismo se impone a menudo a la objetividad.','À l’ère de l’information en continu, le sensationnalisme l’emporte souvent sur l’objectivité.'],
  ['تُكتب العناوين لجذب النقرات، حتى لو شوّهت مضمون المقال.','Headlines are written to attract clicks, even if they distort the content of the article.','Schlagzeilen werden geschrieben, um Klicks zu erzeugen, selbst wenn sie den Inhalt des Artikels verzerren.','Los titulares se escriben para atraer clics, aunque distorsionen el contenido del artículo.','Les titres sont rédigés pour attirer les clics, même s’ils déforment le contenu de l’article.'],
  ['كما أن طريقة التأطير تؤثّر في فهمنا أكثر من الحدث نفسه.','Moreover, the way a story is framed influences our understanding more than the event itself.','Zudem beeinflusst das Framing unser Verständnis oft stärker als das Ereignis selbst.','Además, el encuadre de una noticia influye en nuestra comprensión más que el propio hecho.','De plus, le cadrage d’une information influence notre compréhension davantage que l’événement lui-même.'],
  ['وفي غرف الصدى الرقمية لا نسمع إلا ما يؤكّد قناعاتنا.','And in digital echo chambers we only hear what confirms our beliefs.','Und in digitalen Echokammern hören wir nur, was unsere Überzeugungen bestätigt.','Y en las cámaras de eco digitales solo oímos lo que confirma nuestras convicciones.','Et dans les chambres d’écho numériques, nous n’entendons que ce qui confirme nos convictions.'],
  ['لهذا تزداد أهمية التحقّق من الحقائق والصحافة الاستقصائية.','That is why fact-checking and investigative journalism are becoming more important.','Deshalb gewinnen der Faktencheck und der investigative Journalismus an Bedeutung.','Por eso cobran cada vez más importancia la verificación de datos y el periodismo de investigación.','C’est pourquoi la vérification des faits et le journalisme d’investigation deviennent essentiels.'],
  ['لكن الصحافة الجيدة تحتاج إلى تمويل مستقل، وإلّا وقعت في فخّ الرقابة أو المصالح.','But good journalism needs independent funding; otherwise it falls into the trap of censorship or vested interests.','Doch guter Journalismus braucht eine unabhängige Finanzierung, sonst gerät er in die Falle der Zensur oder der Interessen.','Pero el buen periodismo necesita una financiación independiente; de lo contrario, cae en la trampa de la censura o de los intereses.','Mais un bon journalisme a besoin d’un financement indépendant, sinon il tombe dans le piège de la censure ou des intérêts privés.']
],
c2u7: [
  ['الهوية ليست شيئاً ثابتاً نرثه، بل عملية تتشكّل طوال الحياة.','Identity is not something fixed that we inherit, but a process that takes shape throughout our lives.','Identität ist nichts Festes, das wir erben, sondern ein Prozess, der sich ein Leben lang entwickelt.','La identidad no es algo fijo que heredamos, sino un proceso que se forma a lo largo de la vida.','L’identité n’est pas une chose figée dont on hérite, mais un processus qui se construit tout au long de la vie.'],
  ['كثير من أبناء المهاجرين يعيشون بهوية مزدوجة.','Many children of immigrants live with a dual identity.','Viele Kinder von Einwanderern leben mit einer doppelten Identität.','Muchos hijos de inmigrantes viven con una doble identidad.','Beaucoup d’enfants d’immigrés vivent avec une double identité.'],
  ['فجذورهم في ثقافة والديهم، لكنهم ينتمون أيضاً إلى المجتمع الذي وُلدوا فيه.','Their roots are in their parents’ culture, but they also belong to the society in which they were born.','Sie haben ihre Wurzeln in der Kultur ihrer Eltern, gehören aber auch zu der Gesellschaft, in der sie geboren wurden.','Tienen sus raíces en la cultura de sus padres, pero también pertenecen a la sociedad en la que nacieron.','Ils ont leurs racines dans la culture de leurs parents, mais appartiennent aussi à la société où ils sont nés.'],
  ['وعندما يُطلب منهم أن يختاروا، قد يشعرون بالاغتراب في المكانين.','When they are asked to choose, they may feel a sense of alienation in both places.','Wenn man von ihnen verlangt, sich zu entscheiden, empfinden sie womöglich an beiden Orten Entfremdung.','Cuando se les pide que elijan, pueden sentir alienación en ambos lugares.','Quand on leur demande de choisir, ils peuvent ressentir une forme d’aliénation dans les deux pays.'],
  ['والأحكام المسبقة والصور النمطية تزيد هذا الشعور سوءاً.','Prejudice and stereotypes make this feeling worse.','Vorurteile und Stereotype verstärken dieses Gefühl noch.','Los prejuicios y los estereotipos agravan este sentimiento.','Les préjugés et les stéréotypes aggravent ce sentiment.'],
  ['أما الاندماج الحقيقي فلا يعني الذوبان، بل الشعور بالانتماء مع الاحتفاظ بالجذور.','True integration does not mean assimilation, but a sense of belonging that keeps one’s roots.','Echte Integration bedeutet nicht Assimilation, sondern Zugehörigkeit, ohne die eigenen Wurzeln aufzugeben.','La verdadera integración no significa asimilación, sino un sentimiento de pertenencia sin renunciar a las propias raíces.','La véritable intégration ne signifie pas l’assimilation, mais un sentiment d’appartenance qui n’efface pas les racines.']
],
c2u8: [
  ['التفاوض الناجح لا يعني أن يربح طرف ويخسر الآخر.','Successful negotiation does not mean that one side wins and the other loses.','Eine erfolgreiche Verhandlung bedeutet nicht, dass eine Seite gewinnt und die andere verliert.','Una negociación exitosa no significa que una parte gane y la otra pierda.','Une négociation réussie ne signifie pas qu’une partie gagne et que l’autre perde.'],
  ['بل يعني البحث عن المصلحة المشتركة وراء المواقف المعلنة.','Rather, it means looking for the common interest behind the stated positions.','Vielmehr geht es darum, hinter den erklärten Positionen das gemeinsame Interesse zu finden.','Se trata más bien de buscar el interés común detrás de las posiciones declaradas.','Il s’agit plutôt de chercher l’intérêt commun derrière les positions affichées.'],
  ['قبل الجلسة، يحدّد المفاوض الجيد خطوطه الحمراء وهامش المناورة لديه.','Before the meeting, a good negotiator defines their red lines and their room for manoeuvre.','Vor dem Treffen legt ein guter Verhandler seine roten Linien und seinen Spielraum fest.','Antes de la reunión, un buen negociador define sus líneas rojas y su margen de maniobra.','Avant la réunion, un bon négociateur définit ses lignes rouges et sa marge de manœuvre.'],
  ['فإذا وصلت المحادثات إلى طريق مسدود، قد يساعد وسيط محايد على تحريكها من جديد.','If the talks reach a deadlock, a neutral mediator can help get them moving again.','Geraten die Gespräche in eine Sackgasse, kann ein neutraler Vermittler helfen, sie wieder in Gang zu bringen.','Si las conversaciones llegan a un punto muerto, un mediador neutral puede ayudar a desbloquearlas.','Si les discussions aboutissent à une impasse, un médiateur neutre peut aider à les débloquer.'],
  ['وغالباً ما يتطلّب الحلّ الوسط تنازلات مؤلمة من الجانبين.','A compromise often requires painful concessions from both sides.','Ein Kompromiss erfordert oft schmerzhafte Zugeständnisse von beiden Seiten.','Un compromiso suele exigir concesiones dolorosas por ambas partes.','Un compromis exige souvent des concessions douloureuses des deux côtés.'],
  ['لكن من يرفض أن يتنازل في أي نقطة يخاطر بأن يخسر كل شيء.','But anyone who refuses to give in on any point risks losing everything.','Doch wer in keinem Punkt nachgeben will, riskiert, alles zu verlieren.','Pero quien se niega a ceder en cualquier punto corre el riesgo de perderlo todo.','Mais celui qui refuse de céder sur quoi que ce soit risque de tout perdre.']
],
c2u9: [
  ['الترجمة ليست نقل كلمات من لغة إلى أخرى، بل نقل المعنى.','Translation is not about moving words from one language to another, but about conveying meaning.','Übersetzen heißt nicht, Wörter von einer Sprache in eine andere zu übertragen, sondern Bedeutung zu vermitteln.','Traducir no consiste en trasladar palabras de una lengua a otra, sino en transmitir significado.','Traduire, ce n’est pas transposer des mots d’une langue à une autre, c’est transmettre du sens.'],
  ['فبعض الكلمات غير قابلة للترجمة، لأنها مرتبطة بثقافة معيّنة.','Some words are untranslatable because they are tied to a particular culture.','Manche Wörter sind unübersetzbar, weil sie an eine bestimmte Kultur gebunden sind.','Algunas palabras son intraducibles porque están ligadas a una cultura concreta.','Certains mots sont intraduisibles, car ils sont liés à une culture particulière.'],
  ['وعندها يبحث المترجم عن معادل وظيفي يناسب السياق.','In that case, the translator looks for a functional equivalent that suits the context.','Dann sucht der Übersetzer nach einer funktionalen Entsprechung, die zum Kontext passt.','En ese caso, el traductor busca un equivalente funcional que se adapte al contexto.','Le traducteur cherche alors un équivalent fonctionnel adapté au contexte.'],
  ['أما المترجم الفوري فلا يملك وقتاً للتفكير، وعليه أن يعيد الصياغة في ثوانٍ.','The interpreter, however, has no time to think and must paraphrase within seconds.','Der Dolmetscher dagegen hat keine Zeit zum Nachdenken und muss in Sekunden paraphrasieren.','El intérprete, en cambio, no tiene tiempo para pensar y debe parafrasear en segundos.','L’interprète, en revanche, n’a pas le temps de réfléchir et doit paraphraser en quelques secondes.'],
  ['ويبقى التوازن بين الأمانة للنص المصدر وسلاسة النص الهدف تحدّياً دائماً.','Balancing faithfulness to the source text with fluency in the target text remains a constant challenge.','Das Gleichgewicht zwischen der Treue zum Ausgangstext und der Lesbarkeit des Zieltextes bleibt eine ständige Herausforderung.','El equilibrio entre la fidelidad al texto de origen y la fluidez del texto meta sigue siendo un reto constante.','L’équilibre entre la fidélité au texte source et la fluidité du texte cible reste un défi permanent.'],
  ['وفي الامتحانات الحديثة، تقيس مهام الوساطة اللغوية هذه القدرة بالذات.','In modern exams, language mediation tasks measure precisely this ability.','In modernen Prüfungen messen Aufgaben zur Sprachmittlung genau diese Fähigkeit.','En los exámenes actuales, las tareas de mediación lingüística miden precisamente esta capacidad.','Dans les examens actuels, les tâches de médiation linguistique évaluent précisément cette compétence.']
],
c2u10: [
  ['نعيش في زمن تحوّلات جذرية تحدث بسرعة غير مسبوقة.','We live in a time of radical upheaval that is happening at an unprecedented pace.','Wir leben in einer Zeit des Umbruchs, der sich in beispiellosem Tempo vollzieht.','Vivimos en una época de cambios radicales que se producen a un ritmo sin precedentes.','Nous vivons une époque de bouleversements qui se produisent à un rythme sans précédent.'],
  ['فالأتمتة والشيخوخة السكانية وتغيّر المناخ ستعيد تشكيل مجتمعاتنا.','Automation, population ageing and climate change will reshape our societies.','Automatisierung, Überalterung und Klimawandel werden unsere Gesellschaften neu gestalten.','La automatización, el envejecimiento de la población y el cambio climático transformarán nuestras sociedades.','L’automatisation, le vieillissement de la population et le changement climatique vont transformer nos sociétés.'],
  ['لا أحد يستطيع التنبّؤ بالمستقبل بدقّة، لكن يمكننا رسم سيناريوهات مختلفة.','No one can predict the future precisely, but we can sketch out different scenarios.','Niemand kann die Zukunft genau vorhersagen, aber wir können verschiedene Szenarien entwerfen.','Nadie puede predecir el futuro con exactitud, pero podemos trazar distintos escenarios.','Personne ne peut prédire l’avenir avec précision, mais nous pouvons esquisser différents scénarios.'],
  ['وهذا ما يفعله علم الاستشراف: الاستعداد لعدم اليقين بدلاً من إنكاره.','This is what foresight does: it prepares for uncertainty instead of denying it.','Genau das tut die Zukunftsforschung: Sie bereitet auf die Ungewissheit vor, statt sie zu leugnen.','Eso es lo que hace la prospectiva: prepararse para la incertidumbre en lugar de negarla.','C’est ce que fait la prospective, qui prépare à l’incertitude au lieu de la nier.'],
  ['فبعض التغييرات لا رجعة فيها، ولا يبقى أمامنا إلا التكيّف معها.','Some changes are irreversible, and all we can do is adapt to them.','Manche Veränderungen sind unumkehrbar, und uns bleibt nur die Anpassung.','Algunos cambios son irreversibles y solo nos queda la adaptación.','Certains changements sont irréversibles, et il ne nous reste que l’adaptation.'],
  ['وقد تكون هذه اللحظة نقطة تحوّل، إذا أحسنّا استغلالها.','This moment could be a turning point, if we make good use of it.','Dieser Moment könnte ein Wendepunkt sein, wenn wir ihn gut nutzen.','Este momento podría ser un punto de inflexión, si sabemos aprovecharlo.','Ce moment pourrait être un tournant, si nous savons en tirer parti.']
]

b2u2: ['The passive: modals, perfect and “It is said that …”','Advanced passive: modals, perfect tenses and impersonal passive','المبني للمجهول المتقدّم',
  'modal + be + past participle: Data can be analysed in seconds.\nhave been + past participle: A new vaccine has been developed.\nIt is believed that … · AI is said to be …',
  'The passive works with all tenses and modals: can be done, has been done, will be done. In reports, use It is said / believed / expected that … or subject + is said to … to present ideas without naming the source.',
  'يعمل المبني للمجهول مع كل الأزمنة والأفعال المساعدة: can be done وhas been done وwill be done. وفي التقارير نستخدم It is said / believed / expected that … أو الفاعل + is said to … لعرض الأفكار دون ذكر مصدرها.',
  'It is expected that new rules will be introduced next year.',
  'Personal data must ___ more carefully.|be protected|protect|been protected|be protecting',
  'A new treatment ___ by scientists in Sweden.|has been developed|has developed|has been developing|was developing'],
b2u3: ['wish and if only','Wishes and regrets: wish / if only','التعبير عن الأمنيات والندم: wish وif only',
  'wish + past simple (present): I wish I had more time.\nwish + past perfect (past): I wish I had visited her more often.\nwish + would (annoyance): I wish people would help more.',
  'After wish and if only, move one tense back: past simple for wishes about the present, past perfect for regrets about the past. Use would to complain about other people’s behaviour.',
  'بعد wish وif only نرجع زمناً واحداً إلى الوراء: الماضي البسيط لأمنيات عن الحاضر، والماضي التام للندم على الماضي. ونستخدم would للتذمّر من تصرّفات الآخرين.',
  'Many elderly people wish their families visited them more often.',
  'I wish I ___ more time to volunteer, but I work every weekend.|had|have|will have|would have had',
  'If only I ___ my grandmother more often before she moved away.|had visited|visited|would visit|have visited'],
b2u4: ['Third and mixed conditionals','Third and mixed conditionals','الشرط الثالث والشرط المختلط',
  'If + past perfect, would have + past participle\nIf I had saved more, I would have bought a flat.\nMixed: If I had saved more, I would be richer now.',
  'The third conditional imagines a different past and its result in the past. A mixed conditional links an unreal past to a result in the present: If I had studied economics, I would understand this now.',
  'الشرط الثالث يتخيّل ماضياً مختلفاً ونتيجته في الماضي، أما الشرط المختلط فيربط ماضياً غير حقيقي بنتيجة في الحاضر: If I had studied economics, I would understand this now.',
  'If I had saved more last year, I would not be worried now.',
  'If they had invested earlier, they ___ more money last year.|would have made|would make|will make|had made',
  'If I had studied economics, I ___ this article now.|would understand|would have understood|understood|will understand'],
b2u5: ['Reported questions and reporting verbs','Reported questions, requests and reporting verbs','نقل الأسئلة والطلبات وأفعال النقل',
  '“Will you vote?” → She asked me if / whether I would vote.\n“Sign the petition.” → He urged us to sign the petition.\npromise to · refuse to · deny + -ing · suggest + -ing',
  'Reported questions use statement word order (no do / does) with if, whether or the question word. Requests and orders use ask / tell / urge + object + to-infinitive. Learn the pattern that follows each reporting verb.',
  'في نقل الأسئلة نستخدم ترتيب الجملة الخبرية (بدون do / does) مع if أو whether أو أداة الاستفهام. وفي نقل الطلبات والأوامر نستخدم ask / tell / urge + المفعول + to + المصدر. ويجب حفظ التركيب الذي يأتي بعد كل فعل نقل.',
  'The mayor promised to build a new park within two years.',
  'She asked me where ___.|I lived|did I live|do I live|I do live',
  'The minister denied ___ the money.|taking|to take|take|that take'],
b2u6: ['Participle clauses','Participle clauses (-ing, -ed, having + participle)','جمل اسم الفاعل واسم المفعول',
  '-ing (active): Living in a small village, the family felt isolated.\n-ed (passive): Written in 2015, the novel became a bestseller.\nhaving + past participle (earlier action): Having read the book, I watched the film.',
  'Participle clauses make writing shorter and more formal. Use -ing for an active meaning, the past participle for a passive meaning, and having + past participle when one action happened before another. Both parts must have the same subject.',
  'تجعل هذه الجمل الكتابة أقصر وأكثر رسمية: نستخدم ing- للمعنى المبني للمعلوم، والتصريف الثالث للمعنى المبني للمجهول، وhaving + التصريف الثالث عندما يسبق حدثٌ حدثاً آخر. ويجب أن يكون الفاعل واحداً في الجزأين.',
  'Translated into twenty languages, the novel has reached millions of readers.',
  '___ by a famous director, the film won several prizes.|Directed|Directing|Having directed|To direct',
  '___ the book, I found the film disappointing.|Having read|Read|Been reading|Having been read'],
b2u7: ['Non-defining relative clauses','Non-defining relative clauses','الجمل الموصولة غير المحدِّدة',
  'The phone, which was made in Asia, was designed in the USA.\nMy neighbour, whose parents are refugees, speaks four languages.\n…, which means that … (refers to the whole sentence)',
  'Non-defining clauses add extra information between commas. You cannot use that, and you cannot leave out the pronoun. Which can refer to the whole previous sentence.',
  'الجمل غير المحدِّدة تضيف معلومة إضافية بين فاصلتين، ولا نستخدم فيها that ولا يجوز حذف الضمير. ويمكن لـ which أن تشير إلى الجملة السابقة كلها.',
  'Big cities are becoming more diverse, which raises questions about identity.',
  'My colleague, ___ family fled the war, now works as a nurse.|whose|who|which|that',
  'Many factories moved abroad, ___ led to job losses at home.|which|that|what|who'],
b2u8: ['used to, be used to, get used to','be used to / get used to + -ing','used to وbe used to وget used to',
  'used to + verb (past habit): We used to learn by heart.\nbe used to + -ing (familiar): I’m used to studying online.\nget used to + -ing (becoming familiar): I’m getting used to working in teams.',
  'Used to + infinitive is a past habit. Be used to and get used to mean being or becoming familiar with something; they are followed by a noun or an -ing form.',
  'used to + المصدر تعني عادة في الماضي، أما be used to وget used to فتعنيان أن تكون معتاداً على شيء أو أن تعتاد عليه، ويتبعهما اسم أو صيغة ing-.',
  'At first it was hard, but the students soon got used to learning online.',
  'After a few weeks, the students got used to ___ in groups.|working|work|worked|have worked',
  'When I was at school, we ___ learn everything by heart.|used to|were used to|got used to|use to'],
b2u9: ['Modals of deduction','Modals of deduction: must, might, can’t (+ have done)','أفعال الاستنتاج: must وmight وcan’t',
  'present: She must be ill. · It might be a virus. · It can’t be serious.\npast: He must have caught a cold. · She can’t have taken the pills.',
  'Use must when you are almost sure, might / could / may when something is possible, and can’t when you are sure it is not true. For the past, add have + past participle.',
  'نستخدم must عندما نكون شبه متأكدين، وmight / could / may للاحتمال، وcan’t عندما نكون متأكدين أن الأمر غير صحيح. وللماضي نضيف have + التصريف الثالث.',
  'He has a high fever; he must have caught the flu.',
  'She looks very pale. She ___ be ill.|must|can’t|mustn’t|shouldn’t',
  'The symptoms have gone. The treatment ___ worked.|must have|can’t have|must|might'],
b2u10: ['Formal linking: furthermore, consequently, nevertheless','Formal linking words for essays and letters','أدوات الربط الرسمية للمقالات والرسائل',
  'adding: Furthermore, … · Moreover, … · In addition to + noun / -ing\nresult: Consequently, … · Therefore, … · As a result, …\ncontrast: Nevertheless, … · On the other hand, … · whereas …',
  'In formal writing, linking adverbials usually start a sentence and are followed by a comma. In addition to is followed by a noun or an -ing form; whereas joins two contrasting clauses in one sentence.',
  'في الكتابة الرسمية تأتي أدوات الربط عادة في بداية الجملة وتتبعها فاصلة. ويتبع In addition to اسمٌ أو صيغة ing-، أما whereas فتربط جملتين متعارضتين في جملة واحدة.',
  'The library is very popular. Furthermore, it offers free courses.',
  'The plan is expensive. ___, it will not solve the problem.|Furthermore|Whereas|Despite|Although',
  'In addition to ___ free courses, the library is a meeting place.|offering|offer|offers|offered']
});

Object.assign(LLA.GRAMMAR.es, {
b2u1: ['Subjuntivo en oraciones temporales','Subjunctive in time clauses about the future','الـ Subjuntivo في جمل الزمن المستقبلي',
  'cuando / en cuanto / hasta que + subjuntivo (futuro)\nCuando termine la carrera, buscaré trabajo.\nantes de que + subjuntivo (siempre) · cuando + indicativo (hábito o pasado)',
  'When a time clause refers to the future, the verb after cuando, en cuanto, hasta que or mientras is in the subjunctive. For habits and past events use the indicative. Antes de que always takes the subjunctive.',
  'عندما تشير جملة الزمن إلى المستقبل يأتي الفعل بعد cuando وen cuanto وhasta que وmientras بصيغة الـ subjuntivo، أما للعادات والأحداث الماضية فنستخدم الـ indicativo. وantes de que يتبعها الـ subjuntivo دائماً.',
  'En cuanto tenga más experiencia, pediré un ascenso.',
  'Cuando ___ la carrera, buscaré trabajo en el extranjero.|termine|termino|terminaré|terminaba',
  'Te llamaré en cuanto ___ la respuesta de la empresa.|reciba|recibo|recibiré|recibí'],
b2u2: ['Subjuntivo en oraciones de relativo','Subjunctive in relative clauses (unknown or non-existent antecedent)','الـ Subjuntivo في الجمل الموصولة',
  'conocido → indicativo: Tengo un programa que traduce bien.\ndesconocido → subjuntivo: Busco un programa que traduzca bien.\nno hay nadie que … / no existe ningún … que + subjuntivo',
  'If the noun is something specific that exists, use the indicative in the relative clause. If it is unknown, hypothetical or does not exist, use the subjunctive: Necesitamos normas que protejan la privacidad.',
  'إذا كان الاسم شيئاً محدداً موجوداً نستخدم الـ indicativo في الجملة الموصولة، أما إذا كان مجهولاً أو افتراضياً أو غير موجود فنستخدم الـ subjuntivo: Necesitamos normas que protejan la privacidad.',
  'Los científicos buscan una tecnología que sea segura y barata.',
  'Necesitamos un algoritmo que ___ detectar errores rápidamente.|pueda|puede|podrá|podía',
  'No hay ningún científico que ___ todas las respuestas.|tenga|tiene|tendrá|tuvo'],
b2u3: ['El imperfecto de subjuntivo','The imperfect subjunctive','الماضي من صيغة الـ Subjuntivo',
  'forma ellos del pretérito − ron + ra: hablaron → hablara · tuvieron → tuviera\nQuerían que los jóvenes visitaran a los mayores.\nverbo en pasado o condicional + que + imperfecto de subjuntivo',
  'Form the imperfect subjunctive from the ellos form of the preterite: remove -ron and add -ra, -ras, -ra, -ramos, -rais, -ran. Use it when the main verb is in the past or the conditional and requires the subjunctive.',
  'نصوغ الماضي من الـ subjuntivo من صيغة ellos في الـ pretérito: نحذف -ron ونضيف -ra و-ras و-ra و-ramos و-rais و-ran، ونستخدمه عندما يكون الفعل الرئيسي في الماضي أو في الـ condicional ويتطلب الـ subjuntivo.',
  'Los estudiantes querían que nadie se sintiera solo.',
  'El año pasado la asociación nos pidió que ___ a las personas mayores.|ayudáramos|ayudemos|ayudábamos|ayudaremos',
  'Mis padres querían que yo ___ medicina.|estudiara|estudie|estudiaba|estudiaré'],
b2u4: ['Condiciones irreales: si + imperfecto de subjuntivo','Unreal conditions: si + imperfect subjunctive','الشرط غير الواقعي: si + الماضي من الـ Subjuntivo',
  'si + imperfecto de subjuntivo, condicional\nSi ganara más, ahorraría cada mes.\nnunca: si + condicional ✗',
  'To talk about unreal or unlikely situations in the present or future, use si + imperfect subjunctive and the conditional in the other part. Never use the conditional directly after si.',
  'للحديث عن مواقف غير حقيقية أو غير محتملة في الحاضر أو المستقبل نستخدم si + الماضي من الـ subjuntivo، والـ condicional في الجزء الآخر. ولا نستخدم الـ condicional مباشرة بعد si أبداً.',
  'Si los precios bajaran, la gente consumiría más.',
  'Si ___ más dinero, invertiría en una casa.|tuviera|tendría|tengo|tenía',
  'Si el gobierno bajara los impuestos, la gente ___ más.|consumiría|consuma|consumirá|consumiera'],
b2u5: ['Finalidad: para que + subjuntivo','Purpose: para + infinitive / para que + subjunctive','الغاية: para + المصدر وpara que + الـ Subjuntivo',
  'mismo sujeto: para + infinitivo → Firmamos para cambiar la ley.\nsujeto distinto: para que + subjuntivo → Firmamos para que el ayuntamiento cambie la ley.\npasado: para que + imperfecto de subjuntivo',
  'If both parts have the same subject, use para + infinitive. If the subjects are different, use para que + subjunctive (present after a present verb, imperfect after a past verb). A fin de que works the same way in formal texts.',
  'إذا كان الفاعل واحداً في الجزأين نستخدم para + المصدر، وإذا اختلف الفاعل نستخدم para que + الـ subjuntivo (المضارع بعد فعل في الحاضر، والماضي بعد فعل في الماضي). وتعمل a fin de que بالطريقة نفسها في النصوص الرسمية.',
  'Los vecinos reunieron firmas para que el ayuntamiento construyera un parque.',
  'Escribimos al alcalde para que ___ la propuesta.|apruebe|aprueba|aprobar|aprobará',
  'Vamos a votar ___ cambiar las cosas.|para|para que|porque|a fin de que'],
b2u6: ['Oraciones concesivas con aunque','Concession with aunque (indicative or subjunctive)','جمل التنازل مع aunque',
  'hecho → indicativo: Aunque la película es buena, prefiero el libro.\nposibilidad → subjuntivo: Aunque sea cara, iré a verla.\nhipótesis → imperfecto de subjuntivo: Aunque me pagaran un millón, no lo vendería.',
  'Aunque + indicative presents a fact (“although it is”). Aunque + subjunctive presents a possibility or something the speaker considers unimportant (“even if”). For a hypothesis, use the imperfect subjunctive with the conditional.',
  'aunque + الـ indicativo تقدّم حقيقة (رغم أنّ)، أما aunque + الـ subjuntivo فتقدّم احتمالاً أو أمراً لا يهمّ المتكلم (حتى لو). وللفرضية نستخدم الماضي من الـ subjuntivo مع الـ condicional.',
  'Aunque la novela es larga, se lee en pocos días.',
  '___ la crítica fue negativa, la película tuvo mucho éxito.|Aunque|Porque|Como|Si',
  'Aunque me ___ un millón, no vendería este cuadro.|pagaran|pagan|pagarán|pagaron'],
b2u7: ['Perífrasis verbales','Verbal periphrases: seguir, llevar, dejar de, volver a, acabar de','التراكيب الفعلية (Perífrasis)',
  'seguir + gerundio: Millones de personas siguen emigrando.\nllevar + tiempo + gerundio: Llevan diez años viviendo aquí.\ndejar de + infinitivo · volver a + infinitivo · acabar de + infinitivo',
  'Periphrases add a nuance to the verb: seguir + gerund (to keep doing), llevar + time + gerund (to have been doing for), dejar de (to stop), volver a (to do again), acabar de (to have just done).',
  'تضيف هذه التراكيب معنى خاصاً إلى الفعل: seguir + الجيرونديو (يستمر في)، وllevar + مدة + الجيرونديو (منذ مدة وهو يفعل)، وdejar de (يتوقف عن)، وvolver a (يفعل من جديد)، وacabar de (فعل للتوّ).',
  'Mi vecino lleva cinco años trabajando en una multinacional.',
  'Mis abuelos llevan cuarenta años ___ en Alemania.|viviendo|vivir|vivido|viven',
  'Muchas empresas han dejado ___ producir en el extranjero.|de|a|en|por'],
b2u8: ['Lo que y las oraciones enfáticas','lo que and emphatic sentences','lo que والجمل التوكيدية',
  'Lo que más importa es el pensamiento crítico.\nEl pensamiento crítico es lo que más importa.\n…, lo que / lo cual demuestra que … (se refiere a toda la frase)',
  'Lo que means “what / the thing that” and is used to emphasise information. Lo que and lo cual can also refer back to a whole idea: Muchos dejan los estudios, lo cual es un problema.',
  'lo que تعني «ما / الشيء الذي» وتُستخدم لتأكيد المعلومة، ويمكن لـ lo que وlo cual أن تشيرا إلى فكرة كاملة سابقة: Muchos dejan los estudios, lo cual es un problema.',
  'Lo que necesitan los alumnos es más motivación.',
  '___ más me gusta de esta escuela es el trabajo en equipo.|Lo que|Que|La que|Cual',
  'Muchos estudiantes abandonan la universidad, ___ preocupa al gobierno.|lo cual|el cual|cual|los cuales'],
b2u9: ['Condiciones irreales en el pasado','Unreal past conditions: si hubiera + participle','الشرط غير الواقعي في الماضي',
  'si + pluscuamperfecto de subjuntivo, condicional compuesto\nSi hubiera ido al médico antes, me habría curado más rápido.\nhubiera = hubiese · en la otra parte: habría (o hubiera) + participio',
  'To imagine a different past, use si + hubiera + participle, and habría + participle in the result. In the result part, hubiera can also replace habría.',
  'لتخيّل ماضٍ مختلف نستخدم si + hubiera + اسم المفعول، وhabría + اسم المفعول في جواب الشرط، ويمكن أن تحلّ hubiera محلّ habría في الجواب.',
  'Si me hubieran diagnosticado antes, el tratamiento habría sido más fácil.',
  'Si ___ la vacuna, no habrías estado tan enfermo.|te hubieras puesto|te pusieras|te habrías puesto|te pones',
  'El médico dijo que, si ___ antes, la operación no habría sido necesaria.|hubiéramos venido|vinimos|habríamos venido|venimos'],
b2u10: ['Conectores formales: causa, finalidad y consecuencia','Formal connectors: cause, purpose and consequence','أدوات الربط الرسمية: السبب والغاية والنتيجة',
  'causa: dado que · puesto que · debido a (+ sustantivo)\nfinalidad: con el fin de (+ infinitivo) · a fin de que (+ subjuntivo)\nconsecuencia: por consiguiente · por lo tanto · de modo que',
  'Formal letters and essays use these connectors instead of porque or para. Dado que and puesto que take a clause in the indicative, debido a takes a noun, and a fin de que takes the subjunctive.',
  'تستخدم الرسائل والمقالات الرسمية هذه الأدوات بدلاً من porque وpara: dado que وpuesto que تتبعهما جملة بالـ indicativo، وdebido a يتبعها اسم، وa fin de que يتبعها الـ subjuntivo.',
  'Dado que la biblioteca es muy utilizada, les pedimos que reconsideren su decisión.',
  '___ la falta de presupuesto, la biblioteca cerrará en junio.|Debido a|Dado que|Puesto que|A fin de que',
  'Les escribimos a fin de que ___ su decisión.|reconsideren|reconsideran|reconsiderar|reconsiderarán']
});

Object.assign(LLA.GRAMMAR.fr, {
b2u1: ['Le subjonctif après pour que, avant que, sans que…','The subjunctive after conjunctions (pour que, avant que…)','الـ Subjonctif بعد أدوات الربط',
  'pour que / afin que + subjonctif : L’entreprise forme ses salariés pour qu’ils restent.\navant que · sans que · à condition que · jusqu’à ce que\nmême sujet : pour / avant de / sans + infinitif',
  'Some conjunctions always take the subjunctive: pour que, afin que, avant que, sans que, à condition que, jusqu’à ce que. If both parts have the same subject, use pour, avant de or sans + infinitive instead.',
  'بعض أدوات الربط يتبعها الـ subjonctif دائماً: pour que وafin que وavant que وsans que وà condition que وjusqu’à ce que. وإذا كان الفاعل واحداً في الجزأين نستخدم بدلاً منها pour وavant de وsans + المصدر.',
  'L’entreprise propose le télétravail pour que ses salariés soient plus flexibles.',
  'Je t’envoie l’offre pour que tu ___ ta candidature.|prépares|prépareras|préparais|préparer',
  'Il faut terminer le projet avant que le directeur ne ___.|parte|part|partira|partait'],
b2u2: ['Les pronoms relatifs composés','Compound relative pronouns: lequel, auquel, duquel','ضمائر الوصل المركّبة',
  'préposition + lequel / laquelle / lesquels / lesquelles\nl’algorithme grâce auquel … · la méthode avec laquelle …\nà + lequel = auquel · de + lequel = duquel (près duquel, à côté duquel)',
  'After a preposition, use lequel, laquelle, lesquels or lesquelles, agreeing with the noun. À combines into auquel / auxquels / auxquelles, and de into duquel / desquels / desquelles after phrases like près de or à côté de.',
  'بعد حرف الجر نستخدم lequel وlaquelle وlesquels وlesquelles بحسب جنس الاسم وعدده. ويندمج à معها فتصبح auquel وauxquels وauxquelles، ويندمج de فتصبح duquel وdesquels وdesquelles بعد عبارات مثل près de وà côté de.',
  'C’est une technologie grâce à laquelle on peut détecter les maladies plus tôt.',
  'Voici le laboratoire dans ___ les chercheurs travaillent.|lequel|laquelle|lesquels|duquel',
  'Ce sont des questions ___ les scientifiques réfléchissent depuis longtemps.|auxquelles|auxquels|desquelles|lesquelles'],
b2u3: ['Le subjonctif après les sentiments et le doute','The subjunctive after feelings, doubt and negative opinions','الـ Subjonctif بعد المشاعر والشك',
  'sentiments : je suis content(e) que · je regrette que · j’ai peur que\ndoute : je doute que · je ne pense pas que · il est possible que\nmais : je pense que / je suis sûr(e) que + indicatif',
  'Use the subjunctive after expressions of feeling, doubt and possibility, and after penser or croire in the negative. Expressions of certainty and positive opinion (je pense que, je suis sûr que) take the indicative.',
  'نستخدم الـ subjonctif بعد التعبير عن المشاعر والشك والاحتمال، وبعد penser وcroire في النفي. أما التعبير عن اليقين والرأي المثبت (je pense que وje suis sûr que) فيتبعه الـ indicatif.',
  'Je regrette que tant de personnes âgées vivent seules.',
  'Je suis contente que tu ___ du bénévolat.|fasses|fais|feras|faire',
  'Je ne pense pas que la solidarité ___ suffisante aujourd’hui.|soit|est|sera|être'],
b2u4: ['L’hypothèse : si + imparfait','Unreal conditions: si + imperfect → present conditional','الشرط غير الواقعي: si + الـ Imparfait',
  'si + imparfait, conditionnel présent\nSi je gagnais plus, j’épargnerais chaque mois.\njamais : si + conditionnel ✗',
  'To imagine an unreal or unlikely situation in the present or future, use si + imperfect and the present conditional in the result. Never put the conditional right after si.',
  'لتخيّل موقف غير حقيقي أو غير محتمل في الحاضر أو المستقبل نستخدم si + الـ imparfait، والـ conditionnel présent في جواب الشرط. ولا نضع الـ conditionnel مباشرة بعد si أبداً.',
  'Si les prix baissaient, les familles consommeraient davantage.',

c1u5: ['Formelle Präpositionen mit Genitiv','Formal prepositions with the genitive','حروف الجر الرسمية مع Genitiv',
  'angesichts (in view of) · hinsichtlich / bezüglich (regarding)\ninfolge (as a result of) · mithilfe (with the help of) · zwecks (for the purpose of)\nAngesichts der Konkurrenz muss das Unternehmen sparen.',
  'Business and official German uses prepositions with the genitive instead of simpler phrases: angesichts der Lage (in view of the situation), hinsichtlich des Budgets (regarding the budget), infolge der Krise (as a result of the crisis).',
  'تستخدم الألمانية في الأعمال والمراسلات الرسمية حروف جر مع Genitiv بدلاً من العبارات البسيطة: angesichts der Lage (نظراً للوضع)، وhinsichtlich des Budgets (فيما يتعلق بالميزانية)، وinfolge der Krise (نتيجةً للأزمة).',
  'Infolge der Krise sank der Umsatz um zehn Prozent.',
  'Hinsichtlich ___ Budgets müssen wir noch einmal sprechen.|des|dem|den|der',
  '___ der starken Konkurrenz senkt die Firma ihre Preise.|Angesichts|Bezüglich|Zwecks|Mithilfe'],
c1u6: ['Konsekutivsätze: so … dass, zu …, als dass','Consequence clauses: so … dass, zu … als dass','جمل النتيجة: so … dass وzu … als dass',
  'so + Adjektiv + dass: Er war so nervös, dass er nichts sagte.\nzu + Adjektiv, als dass + Konjunktiv II:\nDie Aufgabe ist zu schwer, als dass man sie allein lösen könnte.',
  'So … dass expresses a consequence. Zu …, als dass + Konjunktiv II expresses a consequence that does not happen because something is too much: Das Risiko ist zu groß, als dass wir es eingehen könnten.',
  'so … dass تعبّر عن النتيجة. أما zu …, als dass + Konjunktiv II فتعبّر عن نتيجة لا تحدث لأن الأمر زائد عن الحدّ: Das Risiko ist zu groß, als dass wir es eingehen könnten (الخطر أكبر من أن نتحمّله).',
  'Die Angst war zu groß, als dass sie vor Publikum hätte sprechen können.',
  'Er war ___ müde, dass er sofort einschlief.|so|zu|sehr|als',
  'Das Thema ist zu komplex, ___ man es in fünf Minuten erklären könnte.|als dass|dass|sodass|damit'],
c1u7: ['Modalsätze: indem, dadurch dass, ohne dass, (an)statt dass','Clauses of manner: indem, dadurch dass, ohne dass, anstatt dass','جمل الطريقة: indem وohne dass وanstatt dass',
  'indem / dadurch, dass (by …ing): Man schützt Rechte, indem man Gesetze durchsetzt.\nohne dass / ohne … zu (without): Er wurde verurteilt, ohne dass es Beweise gab.\n(an)statt dass / (an)statt … zu (instead of)',
  'Indem and dadurch, dass explain how something is achieved (“by …ing”). Ohne dass / ohne … zu means “without”, and anstatt dass / anstatt … zu means “instead of”. Use the zu-infinitive when both parts have the same subject.',
  'indem وdadurch, dass توضّحان كيف يتحقّق الشيء (عن طريق …)، وohne dass / ohne … zu تعني «دون أن»، وanstatt dass / anstatt … zu تعني «بدلاً من أن». ونستخدم zu + المصدر عندما يكون الفاعل واحداً في الجزأين.',
  'Der Richter wurde kritisiert, ohne dass jemand seine Gründe kannte.',
  'Er verließ den Gerichtssaal, ohne ein Wort ___ sagen.|zu|dass|um|indem',
  'Die Anwältin gewann den Fall dadurch, ___ sie einen neuen Zeugen fand.|dass|indem|weil|ob'],
c1u8: ['Temporalsätze: seitdem, sobald, solange, bis, ehe','Time clauses: seitdem, sobald, solange, bis, ehe','جمل الزمن: seitdem وsobald وsolange وbis',
  'seit(dem): Seitdem das Archiv geöffnet ist, …\nsobald (as soon as) · solange (as long as) · bis (until)\nehe = bevor (gehoben): Ehe das Reich zerfiel, …',
  'Seitdem describes something that began in the past and continues; sobald means “as soon as”, solange “as long as” (same duration) and bis “until”. Ehe is a formal synonym of bevor.',
  'seitdem تصف شيئاً بدأ في الماضي ولا يزال مستمراً، وsobald تعني «حالما»، وsolange تعني «طالما» (المدة نفسها)، وbis تعني «حتى». أما ehe فمرادف رسمي لـ bevor.',
  'Seitdem die Akten zugänglich sind, wird die Geschichte neu geschrieben.',
  '___ die Mauer gefallen ist, ist die Stadt nicht mehr geteilt.|Seitdem|Bis|Ehe|Solange',
  'Die Historiker warten, ___ das Archiv geöffnet wird.|bis|seitdem|solange|sobald'],
c1u9: ['Infinitivsätze im Perfekt und im Passiv','Perfect and passive infinitives (… gehackt worden zu sein)','المصدر التام والمصدر المبني للمجهول',
  'Perfekt: Er behauptet, die Daten gelöscht zu haben.\nPassiv: Sie fürchtet, überwacht zu werden.\nPassiv Perfekt: Das Unternehmen gibt an, gehackt worden zu sein.',
  'A zu-infinitive can refer to an earlier action (participle + zu haben / zu sein) or have a passive meaning (participle + zu werden). Both combine in the perfect passive: gehackt worden zu sein.',
  'يمكن أن يشير المصدر مع zu إلى حدث سابق (اسم المفعول + zu haben / zu sein) أو أن يحمل معنى المبني للمجهول (اسم المفعول + zu werden)، ويجتمعان في المبني للمجهول التام: gehackt worden zu sein (أنه تعرّض للاختراق).',
  'Viele Nutzer haben Angst, im Netz überwacht zu werden.',
  'Die Firma gibt an, Opfer eines Cyberangriffs geworden zu ___.|sein|haben|werden|worden',
  'Niemand möchte im Internet ständig beobachtet zu ___.|werden|sein|haben|worden'],
c1u10: ['Korrelate: es und da(r)- vor Nebensätzen','Correlates: es and da(r)- before clauses','الكلمات الممهِّدة es وdarauf قبل الجمل التابعة',
  'Ich möchte darauf hinweisen, dass …\nWir gehen davon aus, dass … · Es kommt darauf an, ob …\nIch halte es für wichtig, dass …',
  'Verbs with a fixed preposition use da(r)- + preposition to point forward to a clause: darauf hinweisen, dass …; davon ausgehen, dass … . Some verbs use es as a placeholder: Ich finde es wichtig, dass …',
  'الأفعال المرتبطة بحرف جر ثابت تستخدم da(r) + حرف الجر للإشارة إلى جملة لاحقة: darauf hinweisen, dass … وdavon ausgehen, dass … . وبعض الأفعال تستخدم es كضمير يمهّد للجملة: Ich finde es wichtig, dass …',
  'Zum Schluss möchte ich darauf hinweisen, dass die Zahlen vorläufig sind.',
  'Ich möchte ___ hinweisen, dass die Daten vorläufig sind.|darauf|davon|daran|dafür',
  'Wir gehen ___ aus, dass die Kosten steigen werden.|davon|darauf|daraus|damit']
});

Object.assign(LLA.GRAMMAR.en, {
c1u1: ['Hedging in academic writing','Hedging: suggest, tend to, appear to, may','لغة التحفّظ في الكتابة الأكاديمية',
  'The results suggest that … · This may indicate …\nStudents tend to / appear to …\nIt seems / It is likely that … · arguably · to some extent',
  'Academic writers avoid absolute claims. They soften statements with verbs like suggest, appear and tend, modals like may and might, and phrases like it is likely that or to some extent.',
  'يتجنّب الكتّاب الأكاديميون الأحكام المطلقة، فيلطّفون عباراتهم بأفعال مثل suggest وappear وtend، وأفعال مساعدة مثل may وmight، وعبارات مثل it is likely that وto some extent.',
  'The findings suggest that sleep may have a stronger effect than expected.',
  'The results ___ that the method is effective, but more research is needed.|suggest|prove|show clearly|confirm absolutely',
  'Younger participants ___ to remember new words more easily.|tended|tended for|had tendency|tendency'],
c1u2: ['Cleft sentences for emphasis','Cleft sentences: It is … that / What … is','الجمل المشقوقة للتوكيد',
  'It is tone, not words, that causes most misunderstandings.\nWhat matters is what is left unsaid.\nAll I want is … · The reason why … is that …',
  'Cleft sentences divide one idea into two parts to put the focus on one element: It was the tone that upset her. What we need is clearer communication.',
  'الجمل المشقوقة تقسم الفكرة إلى جزأين لتسليط الضوء على عنصر واحد: It was the tone that upset her (النبرة هي التي أزعجتها)، وWhat we need is clearer communication (ما نحتاجه هو تواصل أوضح).',
  'It is not what you say but how you say it that matters.',
  '___ upset her was not the message but the tone.|What|That|Which|It',
  'It was her tone ___ caused the misunderstanding.|that|what|which it|who'],
c1u3: ['Inversion after negative adverbials','Inversion: Never have I …, Not only …, Under no circumstances …','التقديم بعد ظروف النفي والتقييد',
  'Never have I faced such a dilemma.\nNot only did he lie, but he also blamed others.\nUnder no circumstances should we … · Rarely / Seldom / Only then …',
  'When a negative or limiting adverbial starts the sentence, the auxiliary comes before the subject, as in a question: Rarely do people admit their mistakes. This makes formal speech and writing more emphatic.',
  'عندما تبدأ الجملة بظرف نفي أو تقييد يأتي الفعل المساعد قبل الفاعل كما في السؤال: Rarely do people admit their mistakes. وهذا يجعل الكلام والكتابة الرسميين أكثر تأكيداً.',
  'Never before had the company faced such a serious ethical question.',
  'Never ___ such an honest answer from a politician.|have I heard|I have heard|I heard|heard I',
  'Not only ___ the truth, but she also apologised.|did she tell|she told|she did tell|told she'],
c1u4: ['Conditionals without if','Conditionals without if: unless, provided that, inversion','الشرط بدون if',
  'unless = if not · provided / providing that · as long as\nShould prices rise, … (= If prices should rise)\nWere we to act now, … · Had we acted earlier, …',
  'Formal English can replace if with unless, provided that or as long as, or use inversion: Should …, Were … to …, Had … + past participle. Inverted conditionals never use if.',
  'يمكن للإنجليزية الرسمية أن تستبدل if بـ unless أو provided that أو as long as، أو أن تستخدم التقديم: Should … وWere … to … وHad … + التصريف الثالث. ولا تُستخدم if أبداً مع التقديم.',
  'Had governments acted earlier, the damage would have been smaller.',
  '___ we acted earlier, many species would have survived.|Had|If|Should|Were',
  'The plan will work ___ everyone takes part.|provided that|unless|in case of|despite'],
c1u5: ['Causative: have / get something done','Causative: have / get something done; get someone to do','صيغة السببية: have / get something done',
  'have + object + past participle: We had the logo redesigned.\nget + object + past participle (informal): I need to get my contract checked.\nhave someone do / get someone to do: The manager had an expert review the plan.',
  'Use the causative when someone else does a job for you: The company had its website redesigned. To mention the person, use have someone do or get someone to do.',
  'نستخدم صيغة السببية عندما يقوم شخص آخر بالعمل لصالحنا: The company had its website redesigned. ولذكر الشخص نستخدم have someone do أو get someone to do.',
  'The start-up had its business plan checked by an external expert.',
  'The company is having its offices ___ next month.|renovated|renovate|renovating|to renovate',
  'The manager got an expert ___ the contract.|to check|checked|check|checks'],
c1u6: ['Unreal past: it’s time, would rather, as if','Unreal past after it’s time, would rather, as if','الماضي غير الواقعي بعد it’s time وwould rather',
  'It’s (high) time we talked about mental health.\nI’d rather you didn’t tell anyone.\nHe acts as if he knew everything.',
  'After it’s (high) time, would rather (+ another person) and as if, a past form can refer to the present. This shows that the situation is not real or not yet true.',
  'بعد it’s (high) time وwould rather (مع شخص آخر) وas if يمكن أن تشير صيغة الماضي إلى الحاضر، وهذا يدلّ على أن الموقف غير حقيقي أو لم يتحقّق بعد.',
  'It’s high time we took stress at work seriously.',
  'It’s high time we ___ more attention to mental health.|paid|pay|will pay|have paid',
  'I’d rather you ___ my results with anyone.|didn’t share|don’t share|won’t share|not share'],
c1u7: ['The subjunctive after order, demand, essential','The formal subjunctive: demand / order / it is essential that + base form','صيغة الالتزام بعد أفعال الطلب والضرورة',
  'The court ordered that the documents be destroyed.\nThe law requires that every citizen vote.\nIt is essential that he not leave the country.',
  'After verbs and adjectives of demand and necessity (demand, order, recommend, require, it is essential), formal English uses the base form of the verb for all persons: that he be, that she pay, that they not leave.',
  'بعد أفعال وصفات الطلب والضرورة (demand وorder وrecommend وrequire وit is essential) تستخدم الإنجليزية الرسمية الفعل في صيغته الأساسية مع كل الضمائر: that he be وthat she pay وthat they not leave.',
  'The court demanded that the company pay compensation.',
  'The court ordered that the documents ___ destroyed.|be|are|being|been',
  'It is essential that every witness ___ the truth.|tell|to tell|told|telling'],
c1u8: ['The future in the past','Future in the past: was going to, would, was to, was about to','المستقبل في الماضي',
  'was / were going to (plan): They were going to sign the treaty, but …\nwould (prediction): Nobody knew that the empire would collapse.\nwas to (destiny): He was to become the first president. · was about to (very near)',
  'To talk about the future from a point in the past, use was going to for plans, would for predictions, was to for what was destined to happen and was about to for something very near.',
  'للحديث عن المستقبل من نقطة في الماضي نستخدم was going to للخطط، وwould للتوقّعات، وwas to لما كان مقدّراً أن يحدث، وwas about to لشيء وشيك جداً.',
  'Nobody could have guessed that the small kingdom would become an empire.',
  'In 1914, nobody knew that the war ___ four years.|would last|will last|lasts|has lasted',
  'Years later, the young officer ___ become the first president of the new republic.|was to|is to|was about|would to'],
c1u9: ['Relative clauses with prepositions and quantifiers','Relative clauses: on which, most of which, some of whom','الجمل الموصولة مع حروف الجر وألفاظ الكمية',
  'the platform on which the data is stored\nmillions of users, most of whom are teenagers\nthree cyberattacks, none of which was reported',
  'In formal English the preposition goes before which or whom: the system on which we depend. After quantifiers (some, most, none, all, both) use of which for things and of whom for people.',
  'في الإنجليزية الرسمية يأتي حرف الجر قبل which أو whom: the system on which we depend. وبعد ألفاظ الكمية (some وmost وnone وall وboth) نستخدم of which للأشياء وof whom للأشخاص.',
  'The app has millions of users, most of whom are under twenty-five.',
  'The company was hacked three times, none of ___ was reported to the police.|which|whom|them|that',
  'This is the platform on ___ millions of people depend.|which|that|what|it'],
c1u10: ['Nominalisation in formal English','Nominalisation: turning verbs into nouns','تحويل الأفعال إلى أسماء في الأسلوب الرسمي',
  'The government decided … → The government’s decision …\nPrices increased sharply. → There was a sharp increase in prices.\nWe analysed the data. → Analysis of the data showed …',
  'Formal presentations and essays often turn verbs and adjectives into nouns. This makes the text more objective and packs more information into one sentence. Adverbs then become adjectives: increased sharply → a sharp increase.',
  'تحوّل العروض والمقالات الرسمية كثيراً الأفعالَ والصفات إلى أسماء، فيصبح النص أكثر موضوعية ويحمل معلومات أكثر في جملة واحدة، وتتحوّل الظروف إلى صفات: increased sharply ← a sharp increase.',
  'The introduction of the new policy led to a significant reduction in costs.',
  'There has been a ___ increase in online shopping.|significant|significantly|signify|significance',
  'The ___ of the new law surprised many experts.|introduction|introduce|introduced|introductory']
});

Object.assign(LLA.GRAMMAR.es, {
c1u1: ['Construcciones impersonales en el registro académico','Impersonal structures in academic Spanish','التراكيب غير الشخصية في الأسلوب الأكاديمي',
  'se + verbo: Se analizaron cien muestras. · Se observa que …\ncabe + infinitivo: Cabe destacar que … · Cabe señalar que …\nes necesario / conviene que + subjuntivo',
  'Academic Spanish avoids yo and nosotros. It uses se + verb (the verb agrees with the noun: se analizaron los datos), cabe + infinitive (it should be noted that) and es necesario / conviene que + subjunctive.',
  'تتجنّب الإسبانية الأكاديمية ضميري yo وnosotros، فتستخدم se + الفعل (ويتطابق الفعل مع الاسم: se analizaron los datos)، وcabe + المصدر (تجدر الإشارة إلى أنّ)، وes necesario / conviene que + الـ subjuntivo.',
  'Cabe destacar que se analizaron más de mil muestras.',
  'En el estudio se ___ doscientas muestras.|analizaron|analizó|analizaba|analizado',
  'Cabe ___ que los resultados son provisionales.|señalar|señale|señalado|que señalar'],
c1u2: ['Ser y estar: adjetivos que cambian de significado','ser and estar: adjectives that change meaning','ser وestar: صفات يتغيّر معناها',
  'ser listo (clever) · estar listo (ready)\nser abierto (open-minded) · estar abierto (open)\nser rico (rich) · estar rico (tasty) · ser aburrido (boring) · estar aburrido (bored)',
  'Some adjectives change their meaning with ser and estar. Ser describes a characteristic of the person or thing; estar describes a state or a temporary situation.',
  'بعض الصفات يتغيّر معناها مع ser وestar: ser تصف صفة ثابتة في الشخص أو الشيء، وestar تصف حالة أو وضعاً مؤقتاً.',
  'Es una persona muy abierta, pero hoy la tienda no está abierta.',
  'Mi hermana ___ muy lista: habla cinco idiomas.|es|está|estaba|esté',
  'La conferencia era tan monótona que todos ___ aburridos.|estaban|eran|son|sean'],
c1u3: ['Concesivas: por mucho que, por más que, por muy … que','Advanced concession: por mucho que, por muy … que','تراكيب التنازل المتقدّمة: مهما',
  'por mucho que / por más que + subjuntivo: Por mucho que insistas, no cambiaré de opinión.\npor (muy) + adjetivo + que + subjuntivo: Por (muy) difícil que sea, hay que decir la verdad.\naun cuando = aunque (formal)',
  'Por mucho que, por más que and por (muy) + adjective + que mean “however much / however …”. With hypothetical or future situations they take the subjunctive.',
  'por mucho que وpor más que وpor (muy) + صفة + que تعني «مهما»، ومع المواقف الافتراضية أو المستقبلية يتبعها الـ subjuntivo.',
  'Por difícil que sea, debemos asumir nuestra responsabilidad.',
  'Por ___ que insistas, no cambiaré de opinión.|mucho|muy|tanto|más bien',
  'Por muy ___ que sea, la mentira nunca está justificada.|útil|útilmente|utilidad|útiles'],
c1u4: ['Otras estructuras condicionales','Other conditional structures: de + infinitive, como + subjunctive, a no ser que','تراكيب شرطية أخرى',
  'de + infinitivo = si: De seguir así, el planeta sufrirá.\ncomo + subjuntivo (advertencia): Como no actuemos ya, será tarde.\na no ser que / a menos que / siempre que / con tal de que + subjuntivo',
  'Besides si, Spanish expresses conditions with de + infinitive, como + subjunctive (often a warning), siempre que / con tal de que (“provided that”) and a no ser que / a menos que (“unless”), which take the subjunctive.',
  'إلى جانب si تعبّر الإسبانية عن الشرط بـ de + المصدر، وcomo + الـ subjuntivo (غالباً للتحذير)، وsiempre que / con tal de que (بشرط أن)، وa no ser que / a menos que (إلّا إذا)، ويتبعها الـ subjuntivo.',
  'De seguir consumiendo así, agotaremos los recursos del planeta.',
  '___ seguir así, agotaremos los recursos del planeta.|De|Si|Como|Con tal de',
  'El proyecto saldrá adelante a no ser que el gobierno ___ los fondos.|retire|retira|retirará|retiraba'],
c1u5: ['Verbos con preposición fija','Verbs with fixed prepositions: consistir en, contar con, apostar por','أفعال مع حروف جر ثابتة',
  'depender de · consistir en · apostar por · contar con\ntratarse de · confiar en · dedicarse a · enfrentarse a\nLa estrategia consiste en reducir costes.',
  'Many verbs need a fixed preposition that often differs from English: consistir en (consist of), contar con (count on, have), apostar por (bet on, opt for). Learn the verb and the preposition together.',
  'كثير من الأفعال يحتاج حرف جر ثابتاً يختلف غالباً عن الإنجليزية: consistir en (يتمثّل في)، وcontar con (يعتمد على / يمتلك)، وapostar por (يراهن على). يجب حفظ الفعل مع حرف الجر.',
  'Nuestra empresa apuesta por la innovación y cuenta con un equipo joven.',
  'La nueva estrategia consiste ___ reducir los costes.|en|de|a|por',
  'Para este proyecto contamos ___ un equipo muy experimentado.|con|en|de|por'],
c1u6: ['Verbos de cambio','Verbs of change: ponerse, volverse, hacerse, quedarse, convertirse en','أفعال التحوّل والتغيّر',
  'ponerse (cambio rápido de estado): ponerse nervioso, triste\nvolverse (cambio de carácter): volverse desconfiado\nhacerse (con esfuerzo) · quedarse (resultado): quedarse sin palabras · convertirse en + sustantivo',
  'Spanish has several verbs meaning “to become”: ponerse for quick changes of mood, volverse for deep changes of character, hacerse for changes achieved by effort, quedarse for the result of an event, and convertirse en for a transformation into something new.',
  'في الإسبانية عدة أفعال بمعنى «يصبح»: ponerse للتغيّر السريع في المزاج، وvolverse للتغيّر العميق في الشخصية، وhacerse للتغيّر بالجهد، وquedarse لنتيجة حدث ما، وconvertirse en للتحوّل إلى شيء جديد.',
  'Cuando habla en público, se pone muy nervioso.',
  'Cuando tiene que hablar en público, se ___ muy nerviosa.|pone|vuelve|hace|convierte',
  'Después de años de esfuerzo, se ___ médico.|hizo|puso|quedó|volvió'],
c1u7: ['Futuro y condicional de probabilidad','Future and conditional of probability (guesses)','المستقبل والشرط للتعبير عن الاحتمال',
  'presente → futuro: ¿Dónde está? – Estará en el juzgado.\npretérito perfecto → futuro compuesto: Habrá olvidado la cita.\npasado → condicional: Serían las diez cuando ocurrió.',
  'Spanish uses the future to guess about the present (Estará en casa = he is probably at home), the future perfect to guess about a recent past, and the conditional to guess about the past: Serían las diez (it was probably about ten).',
  'تستخدم الإسبانية المستقبل لافتراض شيء في الحاضر (Estará en casa = ربما هو في البيت)، والمستقبل التام لافتراض شيء في الماضي القريب، والـ condicional لافتراض شيء في الماضي: Serían las diez (ربما كانت الساعة العاشرة).',
  'El testigo no ha venido; se habrá olvidado de la citación.',
  'Cuando ocurrió el robo, ___ las diez de la noche, más o menos.|serían|serán|son|sean',

  'كم in a question (“how many?”) is followed by a singular noun in the accusative: كم عاماً؟ The exclamatory كم (“how many …!”) stresses a large number and is followed by a noun in the genitive, often with من.',
  '',
  'كم من إمبراطوريةٍ ظنّت أنها خالدة ثم انهارت!',
  'كم ___ حكم العثمانيون المنطقة؟|قرناً|قرنٍ|قرونٌ|قرنٌ',
  'كم من ___ دُمّرت في تلك الحرب!|مدينةٍ|مدينةً|مدينةٌ|المدينةَ'],
c1u9: ['النسبة (ياء النسب)','The relative adjective (nisba): رقمي، اجتماعي، إلكتروني','الاسم المنسوب',
  'اسم + ـيّ: رقم ← رقميّ · مجتمع ← مجتمعيّ\nحذف التاء: سياسة ← سياسيّ · وأحياناً يتغيّر الوزن: مدينة ← مدنيّ\nالمؤنث: رقميّة · الجمع: رقميّون',
  'Adding ـيّ to a noun turns it into an adjective meaning “related to”: رقم → رقمي (digital), اجتماع → اجتماعي (social). A final ـة is dropped first, and the adjective agrees with its noun: المنصّات الرقمية.',
  '',
  'أصبحت الهوية الرقمية جزءاً من حياتنا الاجتماعية.',
  'نعيش اليوم في عصر التحوّل ___.|الرقميّ|الرقميّة|رقمٍ|الرقم',
  'تزداد الهجمات ___ على الشركات الكبرى.|الإلكترونيّة|الإلكترونيّ|إلكترونيّاً|الإلكترون'],
c1u10: ['الاستفهام البلاغي في الحِجاج','Rhetorical questions in argument: أليس … ؟ ألا … ؟','الاستفهام البلاغي',
  'أليس + اسم + خبر منصوب: أليس التعليمُ حقّاً للجميع؟\nألا + جملة: ألا ترون أنّ …؟\nهل يُعقل أن … ؟ · أفلا … ؟',
  'In debates, a rhetorical question does not ask for information but makes a point. أليس (isn’t it …?) works like ليس: its predicate is accusative. ألا ترون أنّ … ؟ means “don’t you see that …?”',
  '',
  'أليس من حقّ كل طفل أن يتعلّم؟',
  'أليس التعليمُ ___ للجميع؟|حقّاً|حقٌّ|حقٍّ|الحقُّ',
  '___ ترون أنّ هذا القرار ظالم؟|ألا|ألّا|إلّا|إلى']
});
